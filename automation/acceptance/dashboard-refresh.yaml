schema_version: 1
automation: dashboard-refresh
gated: false
type: hybrid   # Python scripts own verify+render; thin skill owns invocation + --approve

# Covers dashboard Stages 3-5: update_dashboard.py (render + verify) and the /dashboard-refresh skill.

roles:
  scripts_own: "ALL verification + rendering logic (deterministic, testable, run without Claude)"
  skill_owns: "invocation, delta summaries, and the --approve path only"
  never: "the thing that verifies must not be the thing that claims"

design_complete:
  - "This acceptance file approved; three-state ladder + evidence checks specified."
  - "APPROVAL-BIND (AUT-APPROVAL-BIND, 2026-07-10): claim-binding contract approved -- see claim_binding_contract below."
implementation_complete:
  - "update_dashboard.py --render regenerates RESEARCH_DASHBOARD.md + status.json idempotently."
  - "update_dashboard.py --verify computes VERIFIED from receipt evidence (files+sha, exit codes, acceptance parse, split_usage, forbidden-pattern scan, git-clean on protected paths, no .pt/.pth/.ckpt/.log staged)."
  - "/dashboard-refresh skill runs verify+render, summarizes deltas, and processes --approve (writes actor.kind:user approval receipt)."
  - "An approval receipt is bound to the exact claim receipt it approves (approved_claim_receipt_id), never merely to a task_id."

# ---------------------------------------------------------------- claim-binding contract (APPROVAL-BIND)
claim_binding_contract:
  root_cause: >
    Before this fix, has_user_approval(task_id, receipts) checked whether ANY user-kind receipt
    existed for a task_id, ignoring which claim it approved. A newer claim for the same task_id
    therefore inherited ACCEPTED from an older approval that had never seen it -- discovered live
    during REG-GOALS reconciliation (2026-07-10) and confirmed to affect AUT-TSG-impl as well.
  matching_rule: >
    An approval approves a claim iff approval.task_id == claim.task_id AND
    approval.approved_claim_receipt_id == claim.receipt_id (and, when approved_claim_sha256 is
    present, it must equal sha256 of the claim's own receipt file on disk). Binding never rests on
    task_id, task name, claim type, timestamp prefix, or "latest receipt position" alone.
  active_claim_selection: >
    The active claim for a task is the newest receipt with status_claimed=='done' for that
    task_id -- approval receipts are NEVER eligible to be selected as the active claim (this also
    fixes a latent bug where a same-day-later approval receipt could be mistaken for the newest
    claim in the per-task status table).
  legacy_compatibility: >
    Approval receipts written before this fix carry no approved_claim_receipt_id. Such an approval
    is honored ONLY for the claim that was genuinely active at the moment the approval was written
    (the latest claim with an earlier receipt_id) -- deterministic and conservative. It is NEVER
    treated as covering a claim created after the approval. No historical receipt is edited,
    fabricated, or bulk-migrated; the rule is applied at read time by the verifier.
  supersession_behavior: >
    When a newer claim supersedes an older one, the older claim may remain historically ACCEPTED
    (its own approval still resolves against it if queried directly), the newer claim starts
    VERIFIED-AWAITING-APPROVAL, and the old approval never transfers. The dashboard always reflects
    the state of the ACTIVE (newest) claim only.
test_passed:
  render_idempotency:
    - "Run --render twice -> byte-identical output."
    - "Golden-master diff vs the Stage-1 hand-written dashboard."
  three_fixture_verify:
    - "(a) receipt with all evidence present -> task shows VERIFIED."
    - "(b) receipt whose claimed file is missing -> CLAIMED-UNVERIFIED with named failed check."
    - "(c) gated task with full evidence but no approval -> VERIFIED-AWAITING-APPROVAL, not DONE."
  claim_binding_suite:
    - "A: claim + its own exact-bound approval -> ACCEPTED."
    - "B: a superseding claim with no approval of its own -> VERIFIED-AWAITING-APPROVAL, even though an older approval exists for the same task."
    - "C: the superseding claim gains its own exact-bound approval -> ACCEPTED."
    - "D: an approval whose approved_claim_receipt_id matches but whose task_id does not -> never approves."
    - "E: write_approval() always stamps approved_claim_receipt_id; an empty/missing binding field falls back to the legacy rule, never to a false match."
    - "F: approved_claim_sha256 present but wrong -> provenance mismatch, never approves."
    - "G: synthetic historical-format (no binding field) approvals apply only to their deterministically-associated claim, never to a later superseding one."
    - "H: --approve's underlying mechanism (write_approval) always binds a new approval to the CURRENT active claim, and correctly detects an already-approved active claim as a no-op."
    - "Synthetic reproduction of the real incident: Claim A + Approval A = ACCEPTED; Claim B supersedes A with no Approval B = VERIFIED-AWAITING-APPROVAL; Claim B + Approval B = ACCEPTED."
accepted:
  - "User approval receipt exists for DASH-S3/S4/S5 as each lands."
  - "User approval receipt (claim-bound) exists for AUT-APPROVAL-BIND."
required_evidence_files:
  - "automation/status.json"
  - "<three rendered dashboard snapshots from the fixture test (scratchpad)>"
  - "scripts/automation/test_approve.py (claim-binding suite A-H + REG-GOALS scenario reproduction)"
forbidden_actions:
  - "marking ACCEPTED without a user approval receipt"
  - "hand-editing the generated RESEARCH_DASHBOARD.md once Stage 3 lands"
  - "rendering any metric without its evidence-level tag (hard error, not a default)"
  - "PostToolUse hook that mutates state (a Stop-event reminder is the only allowed hook)"
  - "an approval receipt binding to a claim of a different task_id"
  - "treating a claim as approved via an approval that predates a later, superseding claim"
