schema_version: 1
automation: experiment-candidates
stage: research-os-4b-design
gated: true    # every future claim over this contract is approval-gated, like every prior registry
type: design_contract   # SPEC ONLY -- no registry file, validator, or test exists yet

status: DESIGN_ONLY_NOT_IMPLEMENTED

# ---------------------------------------------------------------------------------- 1. purpose
purpose: >
  Defines the future experiment-candidate registry's contract BEFORE any registry file, validator,
  or checker is built. The registry (once implemented) will record possible research experiments
  and their evidence basis before any execution decision is made. Every candidate record must be
  able to answer:
    - what gap the candidate targets
    - why it may be worth considering
    - what current verified results support or oppose it
    - what accepted papers support it
    - what dataset is required
    - what split may be used
    - what risks or blockers exist
    - whether a future checker should derive GO, REVIEW, or NO-GO
  This spec makes NO experiment recommendation itself. It is a contract for a future layer, not an
  evaluation of any specific direction.

# --------------------------------------------------------------- 2. read-only authoritative inputs
read_only_authoritative_inputs:
  - "automation/literature/paper_registry.yaml"       # literature support/relationship strength, gap IDs
  - "automation/frontier.yaml"                         # current milestone status, counters, frozen-protocol registry
  - "automation/registry/goals.yaml"                   # goal status, datasets_available, data_needs, success_targets, allowed_evidence_levels
  - "automation/registry/datasets.yaml"                # supported_goals/unsupported_goals integrity gate
  - "automation/registry/reference_evidence.yaml"      # curated already-committed evidence pointers
  - "automation/registry/experiment_identity.yaml"     # canonical run/evaluation identity, legacy aliases
  - "automation/artifact_manifest.csv"                 # evidence-level authority for committed artifacts
  - "Result Explorer outputs (scripts/automation/result_explorer.py run_query()) or canonical result identities"
authority_rule: >
  The future registry and its checker may REFERENCE these sources by stable ID (paper_id,
  goal id, dataset id, reference_evidence_key, evaluation_id, protocol_id) but must NEVER
  duplicate, copy, re-derive, or modify their content. A candidate record that needs a metric or
  identity must point at the authoritative source, never restate the number itself -- the same
  architectural rule already enforced for scripts/automation/dashboard_research_summary.py
  (D3) and automation/acceptance/paper-registry.yaml (D4a-1).

# ------------------------------------------------------------------------ 3. candidate record schema
candidate_record_schema:
  candidate_id: "stable ID, pattern candidate_<short-slug>_v<n>; unique; never reused after rejection"
  title: "short human-readable title"
  hypothesis: "one falsifiable statement this candidate would test"
  target_gap: "the specific gap this candidate addresses (a literature_gaps.gap_id, a goal's data_needs entry, or a named frontier shortfall -- referenced, not restated)"
  direction_tags: "list drawn from the SAME candidate-direction vocabulary already used in automation/literature/paper_registry.yaml (e.g. low_far_afac_calibration, neyman_pearson_far_control, ensemble_or_gating, walking_detection_baseline, gait_or_fall_risk_data_acquisition, temporal_false_alarm_reduction, low_far_partial_auc_objective) -- no new vocabulary invented ad hoc per candidate"
  literature_support:
    - paper_id: "reference into automation/literature/paper_registry.yaml -- never copied metadata"
      relationship: "direct | indirect | background | not_established (see vocab section 4)"
  literature_gap_ids: "list of automation/literature/paper_registry.yaml literature_gaps.gap_id entries this candidate would need to close, if any"
  current_evidence_refs: "list of repository-relative references to authoritative evidence (reference_evidence_key, evaluation_id, protocol_id, or a Result Explorer query spec) -- pointers only, never inlined metrics"
  current_evidence_summary: "short paraphrase of what the referenced evidence shows, traceable to current_evidence_refs -- never a number not present in the referenced source"
  prior_negative_evidence_refs: "list of repository-relative references to prior negative/failed results relevant to this candidate (e.g. D10/D11 transfer-failure diagnosis, D13/D14 failed validation gates, BASAT/GAIRAT/SAT plateau capstone)"
  our_rationale: "OUR INTERPRETATION, prefixed as such -- never presented as a paper's or a prior result's own claim (same separation rule as paper_registry.yaml relevance_to_current_results)"
  required_dataset_ids: "list of automation/registry/datasets.yaml dataset ids this candidate needs"
  target_goal_ids: "list of automation/registry/goals.yaml goal ids this candidate targets"
  dataset_readiness: "available | available_not_evaluated | unavailable | aspirational_only (see vocab section 4) -- MUST be derivable from goals.yaml/datasets.yaml, never hand-asserted independently of them"
  allowed_split: "validation_only | training_and_validation | requires_new_frozen_protocol | existing_frozen_protocol_only | no_experiment_allowed (see vocab section 4)"
  frozen_protocol_requirement: "null, or the protocol_id of an existing authorized frozen protocol this candidate would reuse (automation/frontier.yaml frozen_protocol_registry), or 'new_protocol_required' if none exists"
  test_read_risk: "none | low | requires_review | blocked_without_protocol (see vocab section 4)"
  other_risks: "list of free-text risk notes not covered by test_read_risk (e.g. compute budget, seed-42-only constraint, sequential-execution-only constraint from automation/acceptance/experiment-queue.yaml hard_rules)"
  evidence_strength: "strong_local_and_literature | local_supported_literature_indirect | literature_only | local_negative_evidence | literature_gap | dataset_blocked (see vocab section 4)"
  status: "proposed | under_review | approved_for_planning | rejected | superseded (see vocab section 4)"
  claim_boundaries: "list of what must NOT be inferred from this candidate record (mirrors paper_registry.yaml claim_boundaries) -- e.g. 'a GO verdict is not permission to run,' 'validation success on this candidate would not itself meet R90F10 at test'"
  supersedes: "candidate_id of an earlier record this one replaces, or null"
  superseded_by: "candidate_id of a later record that replaced this one, or null (set only on the OLD record; append-only, never edited to delete history)"
id_and_reference_rules:
  - "all IDs stable, snake_case, repository-safe"
  - "every cross-reference (paper_id, gap_id, dataset id, goal id, protocol_id, evaluation_id) uses the EXACT ID from its authoritative source -- never a paraphrase or renamed alias"
  - "every file reference is repository-relative -- no absolute local filesystem path (same rule as paper_registry.yaml)"

# ------------------------------------------------------------------------- 4. controlled vocabularies
controlled_vocabularies:
  literature_relationship: [direct, indirect, background, not_established]
  dataset_readiness: [available, available_not_evaluated, unavailable, aspirational_only]
  allowed_split:
    - validation_only
    - training_and_validation
    - requires_new_frozen_protocol
    - existing_frozen_protocol_only
    - no_experiment_allowed
  test_read_risk: [none, low, requires_review, blocked_without_protocol]
  evidence_strength:
    - strong_local_and_literature
    - local_supported_literature_indirect
    - literature_only
    - local_negative_evidence
    - literature_gap
    - dataset_blocked
  candidate_status: [proposed, under_review, approved_for_planning, rejected, superseded]

# ------------------------------------------------------------------------------ 5. derived verdict policy
derived_verdict_policy:
  principle: >
    GO / REVIEW / NO-GO are NEVER manually entered scientific facts on a candidate record. A future
    Brainstorm Checker (not implemented by this spec) computes the verdict deterministically from
    the structured fields above -- the same computed-not-asserted pattern already used by
    scripts/automation/update_dashboard.py's compute_display() (CLAIMED never self-reports VERIFIED)
    and result_explorer.py's manifest-authoritative evidence levels (never trusts a filename or a
    hand claim). A candidate record with no computed verdict yet is simply unverdicted, never
    defaulted to GO.
  minimum_rules:
    - rule: "dataset_readiness in (unavailable, aspirational_only) for any required_dataset_ids -> NO-GO"
      rationale: "mirrors goals.yaml NO_DATA / NO_DATA_ASPIRATIONAL and datasets.yaml unsupported_goals -- no tool may synthesize evidence for an unsupported (goal, dataset) pair"
    - rule: "allowed_split == no_experiment_allowed for any target_goal_ids -> NO-GO"
    - rule: "allowed_split in (requires_new_frozen_protocol) with frozen_protocol_requirement == new_protocol_required, OR test_read_risk == blocked_without_protocol -> NO-GO or REVIEW, NEVER GO"
      rationale: "a new frozen-test read is itself a separate, human-approval-gated action (protocol-freeze, AUT-PF); this checker may flag the need, never authorize it"
    - rule: "allowed_split == validation_only AND dataset_readiness in (available, available_not_evaluated) AND evidence_strength in (strong_local_and_literature, local_supported_literature_indirect) -> MAY be GO"
      rationale: "GO is reachable only for validation-only, data-available, evidenced candidates"
    - rule: "evidence_strength in (literature_gap, literature_only) with literature_relationship not direct for any literature_support entry -> normally REVIEW"
    - rule: "evidence_strength == local_negative_evidence AND the candidate's hypothesis is not materially different from the prior negative result's -> REVIEW or NO-GO"
      rationale: "mirrors the D10/D11 transfer-failure and D13/D14 failed-validation-gate precedents -- repeating a documented failure without a new hypothesis is not a fresh GO case"
    - rule: "a candidate record NEVER auto-enters the experiment queue regardless of verdict"
    - rule: "GO means suitable for human planning review only -- it is never permission to run, never a test-read authorization, and never a queue-entry trigger"
  verdict_is_advisory: >
    Every verdict is a recommendation surfaced for a human decision-maker. Promotion to
    automation/experiment_queue.yaml (a separate, later, human-gated step) is the ONLY path to
    execution, and that promotion is never automatic from a verdict.

# ------------------------------------------------------------------- 6. current project-specific constraints
current_project_specific_constraints:
  - constraint: "H15 has already consumed one frozen-test read (automation/frontier.yaml counters.frozen_test_reads_consumed == 1)."
    implication: "any candidate proposing a new frozen-test read must be weighed against this budget, never treated as free."
  - constraint: "AFAC/F20 is post-hoc boundary evidence (evidence_level test-post-hoc), not a frozen read, and the qualifying threshold is a narrow (~0.00028-wide) knife edge."
    implication: "a candidate citing AFAC/F20 as support must characterize it as post-hoc/fragile, never as frozen-test-equivalent evidence."
  - constraint: "D10/D11 documented a validation-to-test transfer-failure risk (results/defense_attempt_inventory/D10_D11_TRANSFER_FAILURE_DIAGNOSIS.md)."
    implication: "any candidate resembling the D10/D11 boundary-reweighting approach must reference this diagnosis as prior_negative_evidence_refs and explain what is materially different, or accept a REVIEW/NO-GO-leaning evidence_strength."
  - constraint: "D13 (score-fusion gate) and D14 (low-FAR ranking-loss fine-tune) both failed their pre-registered validation gates; the appendix's internal interpretation explicitly closes the F20 chase for this reason."
    implication: "a new F20-chasing candidate in the same closed line needs an explicit, materially-different-hypothesis justification, not a restatement of D13/D14."
  - constraint: "UT-HAR (automation/registry/datasets.yaml) supports walking_detection (dataset-supported, not yet evaluated) but does NOT support walking_pattern_recognition or gait_or_mobility_change_detection (both in datasets.yaml unsupported_goals)."
    implication: "candidates targeting those two goals are dataset_blocked by construction and must derive NO-GO from dataset_readiness, never claim available support."
  - constraint: "R90F10 remains aspirational (automation/frontier.yaml milestones R90F10 status: not_met, evidence_level: none)."
    implication: "no candidate record may claim R90F10 is met or nearly met from unsupported/validation-only data; any R90F10 framing must cite frontier.yaml's not_met status."
  - constraint: "held-out test data must never be used for casual threshold tuning or candidate comparison."
    implication: "a candidate's current_evidence_refs may cite an EXISTING accepted test-evidence artifact (e.g. reference_evidence.yaml entries), but this spec/registry itself never triggers a new test read, threshold sweep, or comparison run against test data."

no_transient_metrics_here: >
  This acceptance specification intentionally encodes NO current metric values (no TP/FN/FP/TN,
  no Rfall/FAR, no AUROC). Every constraint above references its authoritative source file by
  path; the future registry and checker must re-read those sources at evaluation time, never copy
  a number into this spec or into a candidate record.

# --------------------------------------------------------------------------- 7. separation from later layers
separation_from_later_layers:
  - "the candidate registry is NOT an experiment queue -- automation/experiment_queue.yaml remains the sole execution-scheduling artifact, built and gated separately (task AUT-EQ)"
  - "the candidate registry does NOT launch commands, training runs, evaluations, exports, or threshold selections"
  - "the candidate registry does NOT authorize test reads -- protocol-freeze (task AUT-PF) remains the sole path to a new frozen-test read"
  - "the candidate registry does NOT promote literature records -- automation/literature/paper_registry.yaml verification_status changes only happen in a separate D4a-2 step"
  - "the candidate registry does NOT update thesis claims or any Overleaf/thesis-repository file"
  - "the Next Experiment Brainstorm Checker (verdict computation over candidate records) is a LATER task, not implemented by this spec"
  - "the validation-pilot gate (AUT-VPG) is a LATER, separately-scoped task"
  - "controlled experiment-queue integration (candidate -> queue entry) is a LATER task, requiring its own explicit approval"
  - "dashboard rendering of candidate records is a LATER task -- this spec does not touch RESEARCH_DASHBOARD.md, automation/status.json, or scripts/automation/dashboard_research_summary.py"

# --------------------------------------------------------------------------------- 8. expected future files
expected_future_files_not_created_by_this_spec:
  - path: "automation/registry/experiment_candidates.yaml"
    role: "the actual candidate registry data file (SOURCE-OF-TRUTH), implementing the schema in section 3"
  - path: "scripts/automation/validate_experiment_candidates.py"
    role: "read-only validator enforcing the vocabularies (section 4), ID/reference integrity, and the derived-verdict policy (section 5) -- mirrors scripts/automation/validate_paper_registry.py"
  - path: "scripts/automation/test_experiment_candidates.py"
    role: "synthetic-fixture test suite for the validator, mirroring scripts/automation/test_paper_registry.py's P1-P25 pattern"
  - path: "automation/acceptance/next-experiment-review.yaml"
    role: "the FUTURE Brainstorm Checker's own acceptance contract (a separate design step, not this one) -- covers verdict computation, human-review surfacing, and its own read-only source list"
  - path: "(future) Brainstorm Checker implementation script"
    role: "not yet named; consumes automation/registry/experiment_candidates.yaml (once it exists) read-only and computes/reports verdicts per section 5 -- never writes back to the candidate registry, never queues, never runs anything"

# ------------------------------------------------------------------------------------------ 9. dependencies
dependencies:
  likely_task_id: REG-CANDIDATES
  depends_on: [REG-PAPERS, REG-GOALS, REG-DATASETS, REG-EXPERIMENT-ID, REF-EVID]
  registration_note: >
    NOT registered in automation/tasks.yaml by this spec. Repository precedent (receipts
    2026-07-10T064710Z_val-pilot-gate_AUT-VPG-design.json and
    2026-07-10T064711Z_dashboard_DASH-S8-design.json, both ACCEPTED) shows design-only work uses a
    "-design"-suffixed task_id on its claim/approval receipts WITHOUT a corresponding
    automation/tasks.yaml entry -- update_dashboard.py's verification ledger processes any
    done-receipt's task_id, registered or not ("incl. tasks not in tasks.yaml, e.g. legacy"). A
    tasks.yaml entry for REG-CANDIDATES is therefore expected only at IMPLEMENTATION time (mirroring
    how TOOL-REXP/DASH-D3/REG-PAPERS were each registered together with their real registry/tool
    files), not at this design-only step.

# ------------------------------------------------------------------------------------------ acceptance criteria
design_complete:
  - "This acceptance file approved by the user."
implementation_complete:
  - "NOT YET -- automation/registry/experiment_candidates.yaml does not exist."
  - "NOT YET -- scripts/automation/validate_experiment_candidates.py does not exist."
  - "NOT YET -- scripts/automation/test_experiment_candidates.py does not exist."
test_passed:
  not_applicable: "no implementation exists yet to test"
accepted:
  - "User approval receipt (actor.kind: user) exists for this design step, using whatever task_id the user designates (e.g. REG-CANDIDATES-design, following the AUT-VPG-design/DASH-S8-design precedent)."

forbidden_actions:
  - "create automation/registry/experiment_candidates.yaml in this step"
  - "create a validator or test file in this step"
  - "implement the Next Experiment Brainstorm Checker in this step"
  - "modify automation/experiment_queue.yaml"
  - "make or imply any experiment recommendation"
  - "edit dashboard rendering (RESEARCH_DASHBOARD.md, automation/status.json, dashboard_research_summary.py)"
  - "duplicate or modify any of the read-only authoritative inputs listed in section 2"
  - "encode a transient metric value directly in this spec"
  - "let any future verdict authorize execution, a test read, or automatic queue entry"
  - "stage, commit, or push"
