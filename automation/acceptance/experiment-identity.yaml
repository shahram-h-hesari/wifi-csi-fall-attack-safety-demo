schema_version: 1
automation: experiment-identity
stage: research-os-3
gated: false
type: registry   # + a read-only validator script; no executable/mutating behavior beyond validation

status: DESIGN_AND_INITIAL_BACKFILL_D2E1   # registry + validator + tests exist and pass. Result
  # Explorer integration is explicitly deferred to a future, separate step (see
  # integration_boundary below). D3 dashboard rendering of canonical names is also deferred.

purpose: >
  A parallel identity layer that gives historical results (H15, D8, G1, A1, H1, ...) readable
  canonical run/evaluation IDs and display names WITHOUT renaming, moving, or reinterpreting any
  historical artifact, path, receipt, protocol ID, or reference-evidence key. Solves: "H15" alone
  tells a reader nothing about goal, dataset, method, attack, epsilon, split, or protocol.

policy_document: "automation/registry/experiment_identity.md"
registry_file: "automation/registry/experiment_identity.yaml"
validator_script: "scripts/automation/validate_experiment_identity.py"
fixture_test: "scripts/automation/test_experiment_identity.py"

# ---------------------------------------------------------------- run/evaluation separation
identity_model:
  run: "training/model/checkpoint provenance, independent of any one attack evaluation"
  evaluation: "the conditions a run (or legacy artifact) was evaluated under: attack, epsilon, split, evidence_level, threshold/protocol"
  display_name: "a researcher-facing sentence, understandable without opening any file (mandatory on every evaluation record)"
  legacy_alias: "a structured record (value/alias_type/meaning/meaning_status/source_paths/note) for a historical label -- never a bare unexplained string, never overrides canonical identity"
  reference_evidence_key: "the pre-existing, immutable automation/registry/reference_evidence.yaml lookup key -- this standard cites it, never replaces or renames it"

canonical_id_format:
  charset: "snake_case, lowercase, repository-safe, no spaces"
  run_id_pattern: "run_<goal>_<dataset>_<method>_<verified-disambiguator>_v<version>"
  evaluation_id_pattern: "eval_<goal>_<dataset>_<method>_<attack>_eps<epsilon-token>_<evidence-token>_v<version>"
  epsilon_token_rule: "decimal point -> 'p', trailing zeros preserved (0.015 -> eps0p015; 0.030 -> eps0p030)"
  forbidden: "a canonical ID must never be JUST a bare historical code (h15, d8, g1, a1) -- rule 4"

readable_display_name_requirement: >
  Every evaluation record MUST carry a non-empty display_name that is not itself a bare historical
  code (rule 5, 17). Example: "AFAC frozen-test evaluation under PGD epsilon=0.015" for H15.

legacy_alias_preservation: >
  Historical labels remain fully searchable via structured legacy_aliases / legacy_alias_glossary
  entries, cited by exact source path. They are preserved for provenance, never used as the
  primary display identity, and never override the canonical run/evaluation ID (rule 11).

unverified_meaning_behavior: >
  If no authoritative repository artifact explicitly defines a code's expansion, the alias record
  MUST carry meaning: null, meaning_status: unverified, and an explanatory note. Proximity,
  chronology, or a plausible-sounding guess is never sufficient evidence (rule 13). Example: the
  letter "H" in "H15" has no proven expansion anywhere in the repository -- recorded as unverified,
  not guessed.

# ---------------------------------------------------------------- initial backfill (verified)
initial_h15_mapping:
  reference_evidence_key: H15_eps0015_frozen
  evaluation_id: eval_fall_detection_sensefi_ut_har_afac_pgd_eps0p015_frozen_test_v1
  display_name: "AFAC frozen-test evaluation under PGD epsilon=0.015"
  run_id: run_fall_detection_sensefi_ut_har_afac_optionb_seed42_maxscore_v1
  run_link_status: verified   # checkpoint SHA256 independently re-hashed during the D2e-1 audit; exact match
  legacy_alias: "H15 (meaning: null, meaning_status: unverified -- letter 'H' expansion not asserted)"

initial_afac_posthoc_mapping:
  reference_evidence_key: AFAC_eps0030_F20_posthoc
  evaluation_id: eval_fall_detection_sensefi_ut_har_afac_pgd_eps0p030_test_posthoc_v1
  display_name: "AFAC post-hoc F20 operating point under PGD epsilon=0.030"
  run_id: run_fall_detection_sensefi_ut_har_afac_optionb_seed42_maxscore_v1   # SAME run as H15 above -- proven, not assumed
  run_link_status: verified
  legacy_alias: "D8b (meaning: verified, cites scripts/analysis/plot_d1_d12_recall_far.py Target() entry; bare 'D8' recorded separately as the broader, unverified-scope family label)"

immutable_reference_keys:
  - H15_eps0015_frozen
  - AFAC_eps0030_F20_posthoc
  - "H15-TEST-EPS0015-AFAC-20260705 (protocol_id)"
  - "optionB_AFAC (ledger method name)"
no_historical_renaming: >
  D2e-1 renames, moves, or edits NOTHING under results/, automation/receipts/, or any existing
  automation/registry/*.yaml file. It only ADDS two new files plus one new task/receipt pair.

# ---------------------------------------------------------------- validator/test requirements
identity_safety_rules:
  - "canonical run IDs unique"
  - "canonical evaluation IDs unique"
  - "reference-evidence keys unique across evaluations"
  - "canonical IDs cannot be bare unexplained labels (h15/d8/g1/a1)"
  - "every evaluation has a readable display_name"
  - "every evaluation records goal, dataset, method, evidence level"
  - "attack evaluations record attack AND epsilon together"
  - "validation/test-post-hoc/frozen-test evaluations cannot collide on one evaluation ID"
  - "a changed protocol gets a new evaluation version/ID"
  - "a changed training run gets a new run ID"
  - "legacy aliases never override canonical identity"
  - "historical files/keys are never renamed to conform to this standard"
  - "unverified alias meanings stay null/unasserted"
  - "a run link cannot be marked verified without provenance"
  - "new (non-legacy) evaluations must have a run_id"
  - "legacy backfills may have unresolved run links only when explicitly identity_status: partial_legacy"
  - "display names must be understandable without decoding internal codes"
  - "canonical IDs use normalized lowercase tokens"
  - "numeric epsilon must agree with the epsilon token encoded in the evaluation ID"
  - "reference-evidence identity fields must agree with reference_evidence.yaml"

design_complete:
  - "This acceptance file approved; identity model, ID format, and 20 safety rules fixed."
implementation_complete:
  - "automation/registry/experiment_identity.md (policy) and experiment_identity.yaml (registry: 1 run, 2 evaluations, 9-entry glossary) exist."
  - "scripts/automation/validate_experiment_identity.py exists, is read-only, and passes against the real committed registry with zero errors."
test_passed:
  fixture_suite: "scripts/automation/test_experiment_identity.py: N1-N15 + 4 extra defensive cases, all synthetic except N12-N14 (which re-check the real, committed registry read-only) -- ALL PASS"
  regression: "test_approve.py ALL PASS; test_verify.py ALL PASS; test_result_explorer.py 24 passed -- none touched or affected by this step"
accepted:
  - "User approval receipt (actor.kind: user, claim-bound per AUT-APPROVAL-BIND) exists for REG-EXPERIMENT-ID."

# ---------------------------------------------------------------- future integration boundary
future_integration_boundary: >
  D2e-1 creates and validates the identity registry ONLY. It does NOT modify
  scripts/automation/result_explorer.py, does NOT add canonical names to Result Explorer's output,
  and does NOT touch automation/acceptance/result-explorer.yaml. A future "identity-integration"
  step (separately scoped and approved) would add optional display_name/evaluation_id fields to
  Result Explorer rows by cross-referencing this registry -- not started here. D3 (Markdown
  dashboard rendering using readable canonical names) is likewise a separate, later, unstarted step.

forbidden_actions:
  - "rename or move any historical artifact, receipt, protocol ID, reference-evidence key, or source path"
  - "assert an alias meaning without an authoritative, cited repository source"
  - "infer a run link from filename proximity or chronology alone (only verified provenance, e.g. a matching checkpoint hash, counts)"
  - "modify scripts/automation/result_explorer.py or automation/acceptance/result-explorer.yaml"
  - "modify automation/registry/reference_evidence.yaml, goals.yaml, or datasets.yaml"
  - "run experiments, training, validation, or threshold-selection scripts"
  - "invoke any command containing --split"
  - "stage, commit, or push"
