schema_version: 1
automation: experiment-queue
build_order: 4
gated: false
type: hybrid   # skill + queue spec + background sequential execution

hard_rules:
  - "sequential execution only (one model at a time)"
  - "seed 42 only"
  - "validation-only gating (test only via authorized frozen protocol)"
  - "no auto-enqueue; entries added by user"
  - "each entry must reference a pre-written pilot_config before it can run"

design_complete:
  - "This acceptance file approved; queue schema + triage format specified."
implementation_complete:
  - "Parses experiment_queue.yaml; runs entries strictly sequentially."
  - "Runs val-pilot-gate after each; writes one receipt per entry + one triage receipt."
test_passed:
  dummy_queue_test:
    - "Two entries: one tiny no-op training config, one that intentionally crashes."
    - "Triage shows one completed-with-gate-verdict and one failed-with-log-excerpt."
    - "Crash did NOT contaminate the other candidate's directory."
    - "Wall-clock cap enforced."
accepted:
  - "User approval receipt exists for AUT-EQ."
required_evidence_files:
  - "results/experiment_queue/<date>/QUEUE_TRIAGE.md"
  - "<both candidate directories from the dummy run>"
required_commands:
  - ".venv/Scripts/python.exe scripts/train_<x>.py --seed 42 ... (writes to NEW candidate dirs)"
  - "the val-pilot-gate pipeline; nvidia-smi"
forbidden_actions:
  - "parallel execution"
  - "seeds other than 42"
  - "any test-split command (blocked by test-split-guard regardless)"
  - "auto-enqueueing anything; modifying queue entries mid-flight"
