schema_version: 1
automation: next-experiment-brainstorm-checker
stage: research-os-4d-design
gated: true    # every future claim over this contract is approval-gated, like every prior registry
type: design_contract   # SPEC ONLY -- no checker code, validator, test, or generated review exists yet

status: DESIGN_ONLY_NOT_IMPLEMENTED

# ---------------------------------------------------------------------------------- 1. purpose
purpose: >
  Defines the future Next Experiment Brainstorm Checker's contract BEFORE any checker code,
  validator, test, or generated review exists. The checker (once implemented) reads the accepted
  registries and produces a deterministic, ranked research-planning review over
  automation/registry/experiment_candidates.yaml's candidates. It may derive GO, REVIEW, or NO-GO
  per candidate, but:
    - GO means suitable for human planning review only.
    - GO never authorizes an experiment.
    - GO never authorizes a test read.
    - No verdict may automatically create or modify an automation/experiment_queue.yaml entry.
    - No verdict may modify any candidate record.
  This spec makes NO experiment recommendation and computes NO verdict for the current 8
  candidates. It is a contract for a future layer only.

# --------------------------------------------------------------- 2. authoritative read-only sources
read_only_authoritative_inputs:
  - "automation/registry/experiment_candidates.yaml"    # the candidates being reviewed
  - "automation/literature/paper_registry.yaml"          # paper_id/relationship/literature_gaps ground truth
  - "automation/frontier.yaml"                           # frozen_protocol_registry, counters, milestone status
  - "automation/registry/goals.yaml"                     # goal status/data_needs/allowed_evidence_levels ground truth
  - "automation/registry/datasets.yaml"                  # dataset id / supported_goals ground truth
  - "automation/registry/reference_evidence.yaml"        # reference_evidence_key / evidence_level ground truth
  - "automation/registry/experiment_identity.yaml"       # evaluation_id / canonical identity ground truth
  - "automation/artifact_manifest.csv"                   # evidence-level authority for raw artifacts
  - "accepted protocol-freeze records where available (automation/acceptance/protocol-freeze.yaml and any future golden-master/verify receipts)"
authority_rule: >
  The checker may REFERENCE these sources by stable ID but must never duplicate, copy, re-derive,
  or modify their content -- the same architectural rule already enforced for
  scripts/automation/dashboard_research_summary.py (D3), automation/acceptance/paper-registry.yaml
  (D4a-1), and automation/acceptance/experiment-candidates.yaml (REG-CANDIDATES).
reference_resolution_requirement: >
  The checker must RE-RESOLVE every reference it reports on at generation time -- never trust a
  cached or previously-computed result. Specifically: candidate_id, paper_id, literature_gap_id,
  dataset_id, goal_id, evaluation identity (experiment_identity.yaml evaluation_id), reference-
  evidence identity (reference_evidence.yaml key), protocol_id (frontier.yaml
  frozen_protocol_registry), and every repository-relative evidence path. Any reference that no
  longer resolves at generation time (a paper removed, a path renamed, a key deleted) is a
  blocker for that candidate, never silently skipped and never treated as if it still resolved.

# --------------------------------------------------------------------------- 3. generated artifact
future_generated_artifact:
  path: "automation/reviews/next_experiment_review.yaml"
  nature: "a GENERATED planning artifact -- not a source registry, not an experiment result, never hand-edited"
  not_created_by_this_spec: true
likely_later_files_not_created_now:
  - path: "scripts/automation/next_experiment_brainstorm_checker.py"
    role: "the read-only checker: resolves references, derives material-difference status, computes verdicts, ranks candidates, writes automation/reviews/next_experiment_review.yaml"
  - path: "scripts/automation/validate_next_experiment_review.py"
    role: "read-only validator for a generated review: schema, reference resolution, verdict-vs-reasons consistency, ranking-order consistency, idempotency-related field checks"
  - path: "scripts/automation/test_next_experiment_brainstorm_checker.py"
    role: "synthetic-fixture test suite mirroring scripts/automation/test_experiment_candidates.py's P-style pattern"
  - path: "automation/reviews/next_experiment_review.yaml"
    role: "the generated review output itself (see future_generated_artifact above)"

# ------------------------------------------------------------------------------ 4. output schema
output_schema:
  schema_version: "int"
  review_id: "stable ID, pattern review_<UTC-timestamp>; unique per generation where the source_fingerprint changed"
  generated_at: "UTC timestamp of generation; MUST be preserved (not bumped) across a re-run whose source_fingerprint is unchanged -- see section 9"
  source_fingerprint: "deterministic digest of every authoritative input file's content plus the checker's own policy_version -- see section 9"
  policy_version: "version tag for the verdict/ranking rules in THIS acceptance contract; bump only when section 6/8 rules change"
  authoritative_sources: "list of the exact source paths in read_only_authoritative_inputs, each with its own content hash at generation time"
  candidate_count: "int; must equal len(entries)"
  ranking_policy: "short label/reference to section 8's ranking tuple definition -- not a re-explanation of it"
  entries:
    - candidate_id: "must resolve in automation/registry/experiment_candidates.yaml"
      rank: "1-based position in the deterministic ranking (section 8)"
      target_gap: "pointer/short paraphrase, never the full candidate field copied verbatim beyond a brief restatement"
      direction_tags: "copied verbatim from the candidate record (these are already-short controlled-vocabulary tags, not prose to paraphrase)"
      scientific_promise: "derived label (see section 7) -- literature-relationship-driven, kept separate from other dimensions"
      practical_readiness: "derived label (see section 7) -- prior-negative-evidence/material-difference-driven"
      data_readiness: "derived label (see section 7) -- dataset_readiness-driven"
      split_safety: "derived label (see section 7) -- allowed_split/test_read_risk/frozen_protocol_requirement-driven"
      literature_support_summary: "short paraphrase + paper_id/relationship pointers only -- never full paper_contribution_summary text"
      current_evidence_summary: "short paraphrase + evidence-identity pointers only -- never full source report text"
      prior_negative_evidence_summary: "short paraphrase + evidence-identity pointers only -- never full source report text or copied metric tables"
      dataset_readiness: "copied verbatim from the candidate record (already a controlled-vocabulary value)"
      allowed_split: "copied verbatim from the candidate record"
      test_read_risk: "copied verbatim from the candidate record"
      frozen_protocol_requirement: "copied verbatim from the candidate record"
      blockers: "list of derived blocker strings (unresolved references, dataset blocks, missing material-difference, etc.) -- empty list if none"
      material_difference_requirement:
        required: "bool; see section 5"
        status: "not_applicable | missing | stated_unverified; see section 5"
        basis_refs: "pointers to the prior_negative_evidence_refs this determination was derived from"
        explanation: "one short sentence, never a re-typed copy of the candidate's own our_rationale field"
      derived_verdict: "GO | REVIEW | NO-GO"
      verdict_reasons: "list of short strings, one per rule from section 6 that fired for this candidate"
      required_human_actions: "list of short strings naming what a human must do next (e.g. 'review stated material difference against D14', 'confirm protocol-freeze before any further step') -- never an instruction the checker itself could execute"
      claim_boundaries: "copied verbatim from the candidate record's own claim_boundaries -- never re-authored"
  summary:
    go_count: "int"
    review_count: "int"
    no_go_count: "int"
    unresolved_reference_count: "int; total blockers of the 'unresolved reference' kind across all entries"
no_duplication_rule: >
  Every *_summary field is a short paraphrase plus a source pointer. The checker must never copy
  a complete paper contribution summary, a full metric table, or long report prose into the
  generated review -- the same text-length ceiling and markdown-table-row heuristic already
  enforced by scripts/automation/validate_paper_registry.py and
  scripts/automation/validate_experiment_candidates.py apply to every generated *_summary field.

# ------------------------------------------------------------------- 5. material-difference derivation
material_difference_derivation:
  principle: >
    automation/registry/experiment_candidates.yaml does NOT define a material_difference_requirement
    field. The checker must DERIVE it at generation time from a candidate's prior_negative_evidence_refs
    together with its hypothesis, our_rationale, other_risks, and notes fields -- it is never assumed
    to already exist in the registry.
  cases:
    - condition: "prior_negative_evidence_refs is empty"
      required: false
      status: not_applicable
    - condition: >
        prior_negative_evidence_refs is non-empty AND no materially different hypothesis can be
        identified from the candidate's hypothesis/our_rationale/other_risks/notes text (i.e. the
        candidate reads as a restatement of the same formulation the negative evidence already
        covers)
      required: true
      status: missing
      derived_verdict_effect: "forces NO-GO (section 6)"
    - condition: >
        prior_negative_evidence_refs is non-empty AND the candidate's own text states what would be
        materially different (a different formulation, different specialist set, different
        training objective, etc.)
      required: true
      status: stated_unverified
      derived_verdict_effect: "caps the verdict at REVIEW (section 6) -- a human must judge whether the stated difference is scientifically meaningful"
  never_certifies: >
    The checker never itself certifies that a claimed material difference IS sufficient or
    scientifically meaningful -- "stated_unverified" is the strongest status the checker may ever
    assign; certification is a human judgment, out of scope for this checker permanently.

# ------------------------------------------------------------------------------ 6. derived verdict rules
derived_verdict_rules:
  force_no_go:
    - "dataset_readiness is unavailable"
    - "dataset_readiness is aspirational_only"
    - "allowed_split is no_experiment_allowed"
    - "evidence_strength is dataset_blocked"
    - "the target goal has an empty allowed_evidence_levels list (goals.yaml)"
    - "a required source reference is stale or unresolved at generation time (section 2)"
    - "prior negative evidence exists and material_difference_requirement.status == missing"
    - "the candidate's own text implies casual held-out-test tuning or comparison"
    - "a required frozen protocol is absent, invalid, or does not resolve to a real protocol_id where test access is required"
  force_or_cap_at_review:
    - "literature support for the candidate's direction is only indirect, background, or not_established"
    - "a literature_gap_id applies to the candidate's direction"
    - "evidence_strength is literature_only or literature_gap"
    - "prior negative evidence exists and material_difference_requirement.status == stated_unverified"
    - "allowed_split is requires_new_frozen_protocol"
    - "test_read_risk is requires_review or blocked_without_protocol"
    - "an existing frozen protocol would be reused outside its original evaluation scope"
    - "dataset_readiness is available_not_evaluated"
    - "scientific_promise is favorable but practical_readiness remains unresolved"
  may_permit_go:
    all_of:
      - "dataset_readiness is available or available_not_evaluated"
      - "allowed_split is validation_only or training_and_validation"
      - "test_read_risk is none"
      - "zero unresolved references for this candidate"
      - "no dataset blocker fired"
      - "material_difference_requirement.status is not_applicable or (never missing)"
      - "evidence_strength is strong_local_and_literature or local_supported_literature_indirect"
      - "no force_or_cap_at_review rule fired for this candidate"
    note: "GO still means human planning review only -- see section 1"
  precedence: "any force_no_go rule firing overrides every force_or_cap_at_review rule, which in turn overrides may_permit_go; verdict_reasons must list every rule that fired, not only the deciding one"

# --------------------------------------------------------------------------------- 7. separate dimensions
separate_dimensions:
  principle: >
    The checker must never collapse its assessment into one opaque score. Four dimensions are
    reported independently per entry (see output_schema.entries):
  scientific_promise: "derived from literature_support relationship strength and evidence_strength's literature-facing component -- independent of data availability"
  practical_readiness: "derived from prior_negative_evidence_refs and material_difference_requirement -- independent of dataset/split status"
  data_readiness: "derived directly from dataset_readiness -- independent of literature or prior-evidence status"
  split_safety: "derived from allowed_split, test_read_risk, and frozen_protocol_requirement -- independent of scientific merit"
  execution_authorization: >
    NOT a reported dimension and NEVER a positive checker outcome of any kind. Execution
    authorization belongs exclusively to protocol-freeze (frozen-test reads) and a future,
    separate, human-gated queue-promotion step -- the checker has zero authority here under any
    circumstance, regardless of verdict.

# --------------------------------------------------------------------------------- 8. deterministic ranking
deterministic_ranking:
  principle: >
    Ranking is a computed property of the generated review only. No candidate record stores or is
    ever written a score or priority; automation/registry/experiment_candidates.yaml is never
    modified by ranking.
  ranking_tuple_order:
    1: { key: derived_verdict, order: ["GO", "REVIEW", "NO-GO"] }
    2: { key: data_readiness, order: ["available", "available_not_evaluated", "unavailable", "aspirational_only"] }
    3: { key: allowed_split, order: ["training_and_validation", "validation_only", "existing_frozen_protocol_only", "requires_new_frozen_protocol", "no_experiment_allowed"] }
    4: { key: evidence_strength, order: ["strong_local_and_literature", "local_supported_literature_indirect", "literature_only", "local_negative_evidence", "literature_gap", "dataset_blocked"] }
    5: { key: candidate_id, order: "alphabetical ascending -- final, always-decisive tie-breaker" }
  note: >
    The evidence_strength order above is the exact accepted controlled vocabulary from
    automation/acceptance/experiment-candidates.yaml section 4, listed strongest-to-weakest for
    ranking purposes; it does not redefine or reorder that vocabulary, only orders it for ranking.

# --------------------------------------------------------------------------------- 9. idempotency
idempotency:
  source_fingerprint: >
    A deterministic digest (e.g. a single combined hash) computed over the exact byte content of
    every file in read_only_authoritative_inputs plus the acceptance contract's own policy_version
    -- in a fixed, sorted file order so the digest itself is deterministic.
  unchanged_fingerprint_rule: >
    If a regeneration's computed source_fingerprint matches the fingerprint already recorded in
    the existing automation/reviews/next_experiment_review.yaml, the checker must PRESERVE that
    file's existing review_id and generated_at unchanged and must produce byte-identical output --
    a re-run against unchanged inputs is a no-op, not a new timestamp.
  changed_fingerprint_rule: >
    Only when source_fingerprint differs from the existing file's recorded value may a new
    review_id and a new generated_at be produced.
  never_time_based_alone: "generated_at by itself must never be the reason two runs over identical inputs produce different output"

# ------------------------------------------------------------------------------ 10. safety boundaries
safety_boundaries:
  the_future_checker_must_be_incapable_of:
    - "running shell commands"
    - "launching training or evaluation"
    - "constructing a runnable experiment command (reuse the same COMMAND_LIKE_RE-style static scan already used by scripts/automation/validate_experiment_candidates.py, applied to its own generated output too)"
    - "reading or writing the held-out test split"
    - "authorizing a frozen-test read"
    - "modifying automation/registry/experiment_candidates.yaml"
    - "modifying automation/experiment_queue.yaml"
    - "modifying any accepted registry (paper_registry.yaml, goals.yaml, datasets.yaml, reference_evidence.yaml, experiment_identity.yaml, artifact_manifest.csv)"
    - "changing thesis claims"
    - "promoting literature (verification_status changes remain a separate D4a-2 concern)"
    - "making a clinical or deployment claim"
    - "using network access"
  only_permitted_write_target: "automation/reviews/next_experiment_review.yaml"

# ------------------------------------------------------------------------------ 11. future task boundaries
future_task_boundaries:
  this_step: "NEXT-EXP-REVIEW-design -- this design-only contract; NOT registered in automation/tasks.yaml (mirrors the REG-CANDIDATES-design / AUT-VPG-design / DASH-S8-design precedent of design-only receipts using an unregistered '-design'-suffixed task_id)"
  future_implementation: "NEXT-EXP-REVIEW -- the actual checker implementation, registered in automation/tasks.yaml at that time"
  likely_implementation_dependencies: [REG-CANDIDATES, REG-PAPERS, REG-GOALS, REG-DATASETS, REF-EVID, REG-EXPERIMENT-ID]
  separate_downstream_systems_not_affected_by_this_layer:
    - "protocol-freeze (AUT-PF) -- the sole path to a new frozen-test read; remains separate and human-run"
    - "automation/experiment_queue.yaml / AUT-EQ -- the sole path to execution; a checker verdict never writes here"
    - "dashboard rendering (D3) -- no candidate/review section is added to RESEARCH_DASHBOARD.md by this or the future checker step without its own separate approval"

# ------------------------------------------------------------------------------------------ acceptance criteria
design_complete:
  - "This acceptance file approved by the user."
implementation_complete:
  - "NOT YET -- scripts/automation/next_experiment_brainstorm_checker.py does not exist."
  - "NOT YET -- scripts/automation/validate_next_experiment_review.py does not exist."
  - "NOT YET -- scripts/automation/test_next_experiment_brainstorm_checker.py does not exist."
  - "NOT YET -- automation/reviews/next_experiment_review.yaml does not exist."
test_passed:
  not_applicable: "no implementation exists yet to test"
accepted:
  - "User approval receipt (actor.kind: user) exists for this design step, using whatever task_id the user designates (e.g. NEXT-EXP-REVIEW-design, following the REG-CANDIDATES-design/AUT-VPG-design/DASH-S8-design precedent)."

forbidden_actions:
  - "create checker code, a validator, or tests in this step"
  - "generate an actual automation/reviews/next_experiment_review.yaml in this step"
  - "calculate a GO/REVIEW/NO-GO verdict for any of the 8 real candidates in this step"
  - "modify automation/registry/experiment_candidates.yaml"
  - "modify automation/experiment_queue.yaml"
  - "register a task in automation/tasks.yaml in this step"
  - "create claim or approval receipts in this step"
  - "duplicate or modify any of the read-only authoritative inputs listed in section 2"
  - "encode a transient metric value, full paper summary, or metric table directly in this spec"
  - "let any future verdict authorize execution, a test read, or automatic queue entry"
  - "stage, commit, or push"
