    - "before any write operation, verify target remote identity (git remote get-url origin == target remote_url) and source remote identity + source commit (per section 2)"
    - "stop (hard failure, not a warning) if either repository is dirty beyond explicitly allowed untracked files -- 'explicitly allowed' means ONLY pre-existing untracked items already known and named in the source repo's status at contract time (e.g. .codex/, results/**, scripts/analysis/** new files from unrelated prior work); any unexpected modification to a TRACKED file in either repository is a hard stop"
