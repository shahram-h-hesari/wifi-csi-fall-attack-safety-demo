# --------------------------------------------------- 8. receipt, provenance, and task-state policy (corrections 4 + 5)
receipt_and_historical_task_policy:
  historical_receipts:
    rule: "every receipt already in wifi-csi-fall-attack-safety-demo's automation/receipts/ (all ~70+ existing receipts as of this contract) is migrated as a FILE (via the history-preservation procedure, section 5) but its CONTENT is never rewritten, re-hashed, or edited -- byte-identical before and after migration."
    short_git_head_fields: "every historical receipt's ambiguous 7-character git.head value remains documented as referring to a commit in wifi-csi-fall-attack-safety-demo's history, never reinterpreted as a research-os commit merely because the file now physically resides in research-os."
    old_approval_bindings: "remain valid exactly as recorded (approved_claim_receipt_id / approved_claim_path / approved_claim_sha256 continue to point at the co-migrated claim receipt file, whose content and hash are unchanged by the file-level move)."
    no_rewrite_rule: "no historical receipt is rewritten, re-hashed, renamed, or reinterpreted merely because it changed repositories."

  migration_provenance_record:
    principle: >
      Historical receipts are NEVER edited to add cross-repository context (per the no-rewrite rule
      above). Instead, a SEPARATE, new, append-only record is created that maps historical/task
      identity to source-repository and target-migration context, without touching any historical
      receipt file.
    proposed_committed_path: "automation/migration_provenance.yaml (migrated into research-os as part of the final migration commit, section 5 step 4; does not exist in wifi-csi-fall-attack-safety-demo today and is authored fresh during the implementation)"
    proposed_schema:
      schema_version: 1
      migration:
        source_repository_id: "wifi-csi-fall-attack-safety-demo"
        source_remote_url: "https://github.com/shahram-h-hesari/wifi-csi-fall-attack-safety-demo.git"
        source_branch: "feature/safety-proxy-guided-defense"
        source_commit_range: "f64d5626d3b159f85988668f0a86281035678e93..<SOURCE_SNAPSHOT_SHA captured fresh at implementation preflight, per repositories.source_snapshot_policy -- e.g. 3021f1279ce8cdd9d5dd728e683d8376fb0f83ea or a later descendant that has it as an ancestor, whichever is HEAD of feature/safety-proxy-guided-defense at the moment the migration implementation actually runs; NEVER the stale ed50db0d62b755cd7aae9f00228665ba0cdb5750 endpoint from an earlier draft of this contract>"
        target_repository_id: "research-os"
        target_remote_url: "https://github.com/shahram-h-hesari/research-os.git"
        target_base_commit: "b997ed6aba4e3395c3b02eef951b3536450b8961"
        target_migration_branch: "migrate/research-os-layer"
        target_migration_merge_commits: "list of the actual merge/patch/final commit SHAs created on migrate/research-os-layer, filled in at implementation time"
        history_method: "git subtree split (automation/, scripts/automation/) + git format-patch/am (RESEARCH_DASHBOARD.md, SKILL.md) + one manual provenance-recorded content addition (.gitignore line) -- per section 5"
      per_receipt_or_task_mapping:
        - historical_identity: "e.g. receipt_id or task_id, one entry per historical receipt/task -- this MUST include research-os-migration.yaml itself, its superseded design claim, its active design claim, and its approval receipt (all committed at 3021f1279ce8cdd9d5dd728e683d8376fb0f83ea), plus every other receipt present at SOURCE_SNAPSHOT_SHA, not merely those present at ed50db0d"
          source_repository_id: "wifi-csi-fall-attack-safety-demo"
          source_remote_url: "https://github.com/shahram-h-hesari/wifi-csi-fall-attack-safety-demo.git"
          source_commit_context: "the short git.head value already recorded inside the historical receipt itself, restated here alongside its full-SHA resolution if resolvable (see interpretation policy below)"
          migration_source_snapshot: "full 40-character source commit SHA at the moment this receipt's file content was captured for migration (== SOURCE_SNAPSHOT_SHA, since all receipts migrate together in one pass)"
          target_migration_commit: "the research-os commit SHA (post-migration) whose tree contains this exact receipt file"
          legacy_hash_interpretation: "ALWAYS_SOURCE_REPOSITORY -- see interpretation policy below"
    interpretation_policy_for_legacy_seven_character_hashes: >
      Every historical receipt's short git.head value is interpreted, by fixed policy, as ALWAYS
      referring to the SOURCE repository (wifi-csi-fall-attack-safety-demo), NEVER to research-os,
      regardless of which repository the receipt file physically resides in after migration. This is
      a static, one-line interpretation rule recorded once in migration_provenance.yaml's `migration`
      block, not something computed per-receipt. If a short hash happens to also match a commit in
      research-os's own (unrelated) history by coincidence, the policy still resolves it as the
      SOURCE repository's commit -- ambiguity is resolved by fixed origin, not by disambiguation
      heuristics.
    when_a_legacy_short_hash_cannot_be_resolved: >
      If a historical receipt's short git.head value does not uniquely resolve to a commit in the
      source repository (e.g. it was truncated ambiguously, or the referenced commit was later
      garbage-collected -- not expected, but possible in principle), the migration_provenance.yaml
      entry for that receipt records `source_commit_context: "unresolvable"` explicitly, rather than
      guessing or silently omitting the entry. This is reported, never hidden.

  automated_verification_claim_classification:
    principle: "the migrated verifier (update_dashboard.py, run from research-os) must distinguish exactly three claim categories, never conflate them:"
    categories:
      - name: "historical source-repository claims"
        definition: "any receipt whose git.head is a short hash and predates migration -- verified ONLY via hash-check of the receipt's own claimed file content (already migrated, byte-unchanged); the verifier does NOT attempt to resolve git.head as a live commit in either repository for these -- it is read as a historical label, per the interpretation policy above."
        target_state: "historical ACCEPTED (unchanged from pre-migration status) -- see per-task classification below"
      - name: "reverified cross-repository claims"
        definition: "a task whose acceptance criteria require reading/hashing EXPERIMENT-repository evidence; after migration, its verification path changes from same-repo `Path(__file__).resolve().parents[2]` to resolver-based cross-repo resolution via automation/registry/external_repositories.yaml + the real local override"
        target_state: "must be actively re-run via `--verify` from research-os; expected to reproduce identical check counts (see per-task table below); becomes a NEW receipt only if reconciliation is genuinely needed (see reconciliation policy)"
      - name: "new target-repository claims"
        definition: "any claim authored AFTER migration, describing work done from/about research-os itself"
        target_state: "must record full 40-character SHAs for both the research-os (governance) commit and any external (experiment) repository commit touched, per the Phase 1 commit-and-provenance policy -- never a 7-character abbreviation"
    the_migrated_verifier_must_not:
      - "interpret a historical source-repository hash as a research-os hash, under any circumstance"
      - "silently accept an unresolvable legacy hash as verified -- an unresolvable hash is reported exactly as 'unresolvable' (see migration_provenance_record above), never treated as a pass"
      - "require rewriting any historical receipt to add cross-repository context -- all such context lives in migration_provenance.yaml only"

  per_task_target_state_classification:
    principle: "every migrated task's target-repository state (in research-os, post-migration) is one of: historical ACCEPTED, actively-reverified ACCEPTED, VERIFIED-AWAITING-APPROVAL, VERIFIED, BLOCKED, or excluded from active target-state computation. No task is left ambiguous."
    historical_accepted_no_reconciliation_needed:
      - "REG-GOALS, REG-DATASETS, REF-EVID, REG-PAPERS -- acceptance criteria never depended on a live experiment-repository read (hand-curated/pointer registries); target state: historical ACCEPTED"
      - "AUT-APPROVAL-BIND, ROADMAP-V2, DASH-S8-design, AUT-VPG-design, VALIDATION-PILOT-GATE-design, EXTERNAL-REPO-RESOLUTION-design, EXTERNAL-REPO-RESOLUTION, RESEARCH-OS-MIGRATION-design -- design/dashboard-refresh/resolver-implementation tasks whose acceptance criteria are self-contained within automation/ (no live experiment-repository read at verification time); target state: historical ACCEPTED"
    actively_reverified_expected_identical_counts:
      - task: "TOOL-REXP (result-explorer)"
        why: "directly resolves results/ paths and hashes evidence in the experiment repository"
        target_state_before_reverification: "VERIFIED-AWAITING-APPROVAL is NOT the right label here -- its historical approval remains valid per the no-rewrite rule; its target state is historical ACCEPTED immediately post-migration (file-level, unchanged), then upgraded to actively-reverified ACCEPTED once a fresh --verify run from research-os (using the resolver) reproduces the same check count"
      - task: "DASH-D3 (dashboard-research-summary)"
        why: "reads Result Explorer output, which reads experiment evidence"
        target_state_before_reverification: "historical ACCEPTED immediately post-migration; actively-reverified ACCEPTED once re-verification matches"
      - task: "REG-EXPERIMENT-ID (experiment-identity)"
        why: "references checkpoint hashes in the experiment repository"
        target_state_before_reverification: "historical ACCEPTED immediately post-migration; actively-reverified ACCEPTED once re-verification matches"
      - task: "REG-CANDIDATES, NEXT-EXP-REVIEW, DASH-NEXT-EXP-REVIEW"
        why: "re-resolve candidate/dataset/evidence references that ultimately trace to experiment-repo paths"
        target_state_before_reverification: "historical ACCEPTED immediately post-migration; actively-reverified ACCEPTED once re-verification matches"
    special_case_excluded_from_normal_reverification:
      - task: "AUT-TSG-impl (test-split-guard)"
        why: "its enforcement files (test_split_guard.py, test_split_guard_cases.py, and the .claude hook) do NOT migrate (section 3 exception) -- there is no live research-os-side mechanism to reverify"
        target_state: "historical ACCEPTED ONLY in research-os (a governance/tracking record of a decision made and enforced elsewhere) -- EXCLUDED from active target-state computation in research-os, since research-os cannot execute or verify this hook. The task's LIVE, operationally-meaningful state continues to be governed and verified from wifi-csi-fall-attack-safety-demo, which remains authoritative for AUT-TSG-impl specifically, indefinitely, regardless of the overall authority transition (section 10). The migrated dashboard MUST render this exclusion explicitly (e.g. a visible annotation: 'operational files not migrated; live state tracked in the experiment repository') and MUST NOT present AUT-TSG-impl as if it were actively reverified from research-os -- doing so would misrepresent an unmigrated enforcement mechanism as if research-os had verified it."
    dashboard_rendering_requirement: >
      The target dashboard (research-os's RESEARCH_DASHBOARD.md) must never render a historical task
      as "actively reverified" before its actual re-verification run has occurred and matched, and
      must never render AUT-TSG-impl (or any future task in the same special-case category) as if its
      operational files were migrated when they were not -- this is a rendering-honesty requirement,
      not merely a policy statement, and is added to the implementation validation suite (section 11).
    reconciliation_receipts: >
      A reconciliation receipt (a NEW claim, never an edit of a historical one) is created ONLY if a
      re-verification run from research-os produces a DIFFERENT check count or outcome than the
      historical acceptance recorded -- the discrepancy is investigated and reported, never silently
      accepted. If re-verification reproduces identical counts, no reconciliation receipt is needed;
      the migration receipt's own record of "reverified, counts matched" is sufficient.

# ------------------------- 9. source decommission policy, branch/merge boundary, and authority transition (correction 6)
migration_implementation_sequence:
  principle: >
    The prior version of this contract left the boundary between "migration validation" and
    "main-branch authority transition" ambiguous (it described authority changing "after a Phase 4
    merge" while also describing rollback as "deleting an unmerged branch" -- an internal
    contradiction). This section replaces that ambiguity with one exact, unambiguous sequence.
  rule_check_performed: >
    No existing accepted repository rule (in any acceptance/*.yaml, tasks.yaml, or prior receipt in
    this repository) mandates a specific merge-timing convention for a cross-repository migration --
    this is a novel operation with no established precedent to follow or deviate from. The sequence
    below is therefore a fresh, explicit design choice, not a deviation from any existing rule.
  exact_sequence:
    - step: 1
      name: "Create migration branch"
      description: "create migrate/research-os-layer in research-os from the exact verified target base_commit (section 2); never from an arbitrary later main state without re-verifying identity first"
    - step: 2
      name: "Import"
      description: "run the history-preservation procedure (section 5) in full: subtree split (in a temporary, disposable clone) + format-patch/am + the manual .gitignore line + automation/requirements.txt, all committed onto migrate/research-os-layer only"
    - step: 3
      name: "Configure the local external-repository override for LOCAL VALIDATION ONLY"
      description: "create the real (gitignored) automation/local/external_repository_paths.yaml in the research-os checkout, pointing at the existing wifi-csi-fall-attack-safety-demo local path -- this file is never committed and exists only on the local machine running validation"
    - step: 4
      name: "Run all target-side validations"
      description: "execute the full implementation_validation_suite (section 11) from within the research-os checkout on migrate/research-os-layer -- dashboard render/idempotency, registries/validators, resolver, Result Explorer, artifact scanning, Brainstorm Checker, dependency/import proof (section 3b), collision-free proof (section 4b), and every historical-receipt byte-identity/reconciliation check (section 8)"
    - step: 5
      name: "Create and approve the migration implementation claim"
      description: "author the RESEARCH-OS-MIGRATION claim receipt (recording full source/target SHAs, the migration_provenance.yaml contents, and validation results) and obtain a human approval receipt through the standard --approve CLI, exactly as every other implementation task in this repository requires -- BEFORE any push"
    - step: 6
      name: "Push the migration branch normally"
      description: "push migrate/research-os-layer to origin as a new branch (non-force, first-time push); main is NOT touched by this push"
    - step: 7
      name: "STOP -- do not merge into research-os/main in this task"
      description: "RESEARCH-OS-MIGRATION's implementation ENDS here. migrate/research-os-layer exists, is pushed, is validated, and is approved as a claim -- but research-os/main is untouched and wifi-csi-fall-attack-safety-demo remains fully authoritative at this point."
    - step: 8
      name: "Main-branch merge and authority transition (SEPARATE, later, explicitly-approved task)"
      description: "merging migrate/research-os-layer into research-os's main, and the resulting authority transition, is its OWN separate task with its OWN design contract and its OWN user approval -- NOT part of RESEARCH-OS-MIGRATION's scope, and NOT performed automatically just because step 4's validations passed"
    - step: 9
      name: "Source remains authoritative until the separate transition task completes"
      description: "wifi-csi-fall-attack-safety-demo's existing automation/ and scripts/automation/ remain the ONLY authoritative, live Research OS copy through steps 1-7 and until the separate transition task (step 8) is itself approved and executed"
    - step: 10
      name: "Source decommission (a further separate, later, separately-gated task)"
      description: "removal of automation/ and scripts/automation/ (minus the test-split-guard exception) from wifi-csi-fall-attack-safety-demo happens only after the separate transition task (step 8) has been live and stable, and only via its own accepted design contract and its own user approval"
  this_contract_and_its_future_implementation_cover: "steps 1-7 only"
  steps_8_through_10_are_explicitly_out_of_scope: true

# ------------------------------------------------------------------------------------- 10. authority transition
authority_transition:
  before_authority_transition:
    - "wifi-csi-fall-attack-safety-demo's existing automation/ and scripts/automation/ remain the authoritative, live Research OS copy"
    - "migrate/research-os-layer may exist, be validated, be pushed, and even be claim-approved (steps 1-7) WITHOUT this changing authority -- an approved, pushed, unmerged migration branch is not yet authoritative"
    - "VALIDATION-PILOT-GATE implementation stays paused"
    - "no new Research OS governance work is redirected to research-os yet"
  exact_transition_point: >
    Authority transitions to research-os ONLY after ALL of: (a) the SEPARATE, later, explicitly-
    approved main-branch-merge task (migration_implementation_sequence step 8) actually merges
    migrate/research-os-layer into research-os's main; (b) that separate task's own validation
    (re-confirming everything in section 11 still holds post-merge) passes with zero discrepancy;
    (c) a human approval receipt is recorded for THAT separate task's claim. Passing step 4's
    validations on the unmerged branch is a PREREQUISITE for proposing the separate transition task --
    it is explicitly NOT itself the transition point.
  after_authority_transition:
    - "research-os becomes authoritative for all NEW dashboard and automation work"
    - "no new Research OS tasks are developed inside wifi-csi-fall-attack-safety-demo going forward"
    - "VALIDATION-PILOT-GATE implementation MAY resume, but ONLY in research-os, and ONLY after this exact transition point (not merely after an unmerged migration branch passes tests, per the correction above) -- resuming it any earlier would resume gate-implementation work in a repository the migration has not yet made authoritative"
    - "the source Research OS copy in wifi-csi-fall-attack-safety-demo becomes FROZEN (read-only in practice, not technically locked) pending the separate, later, separately-gated decommission task (sequence step 10)"
    - "the test-split-guard exception continues operating from wifi-csi-fall-attack-safety-demo indefinitely -- it is never frozen or decommissioned, since it protects live experiment-repository operations regardless of where governance lives"

# ------------------------------------------------------------------------------------- 10b. rollback procedure
rollback_procedure:
  during_steps_1_to_6: "delete the local and (if pushed) remote migrate/research-os-layer branch in research-os; this has zero effect on research-os's main (never touched) and zero effect on wifi-csi-fall-attack-safety-demo (never written to at any point in steps 1-6, only read from)"
  after_step_6_push_before_step_8_merge: "identical rollback: delete the pushed-but-unmerged migrate/research-os-layer branch; main is still untouched because step 8 (merge) has not occurred"
  after_step_8_merge_ever_occurs: "rollback is explicitly OUT OF SCOPE for this contract -- it belongs to the separate transition task's own design contract (sequence step 8), which must define its own rollback procedure for an already-merged main before it is approved to execute"
  source_repository_rollback: "not applicable at any point covered by this contract -- wifi-csi-fall-attack-safety-demo is never written to by steps 1-7"

# ------------------------------------------------------------------------------------- 11. required validation (future implementation acceptance criteria)
implementation_validation_suite:
  criteria:
    - "correct source and target remote identities verified via git remote get-url origin against both configured URLs before any write"
    - "SOURCE_SNAPSHOT_SHA is captured fresh at preflight per repositories.source_snapshot_policy (never a hard-coded value), has minimum_required_ancestor (3021f1279ce8cdd9d5dd728e683d8376fb0f83ea) as a verified ancestor, exactly matches origin/feature/safety-proxy-guided-defense, and is recorded in both migration_provenance.yaml and the migration claim"
    - "exact target base commit (b997ed6aba4e3395c3b02eef951b3536450b8961 or a later main descendant, reverified at implementation time per base_commit_change_policy) is recorded in the migration claim"
    - "the migrated inventory at SOURCE_SNAPSHOT_SHA is proven (by explicit file-listing diff, not assumed) to include automation/acceptance/research-os-migration.yaml itself, its superseded design claim (2026-07-11T082139Z...), its active design claim (2026-07-11T083329Z...), its approval receipt (2026-07-11T083643Z...), the corresponding automation/tasks.yaml / dashboard_changelog.md / RESEARCH_DASHBOARD.md / automation/status.json content, and every other receipt present at SOURCE_SNAPSHOT_SHA -- not merely those present at the earlier, now-superseded ed50db0d snapshot"
    - "the migration implementation claim and its approval receipt are correctly recorded as NEW target-repository records (full governance-commit SHA required, per the Phase 1 commit-and-provenance policy) -- they are never claimed to exist in, or backdated to, the source snapshot itself"
    - "if the migration is re-run with a different SOURCE_SNAPSHOT_SHA than a prior attempt, this is proven to fail visibly unless a new migration claim explicitly supersedes the earlier attempt's claim and documents the new snapshot and why it differs"
    - "exact migration inventory (section 3) and exclusion inventory (section 4) match what was actually imported -- verified by an explicit file listing diff, not assumed"
    - "no file under results/, figures/, checkpoints, or any model-weight path appears anywhere in migrate/research-os-layer's tree or history -- verified by scanning the imported tree for any of these path prefixes and asserting zero matches"
    - "every migrated file's content matches the accepted source snapshot byte-for-byte where no intentional target adaptation is documented (the only intentionally adapted content is the two-line .gitignore entry and any research-os-local requirements.txt addition, both explicitly logged as adaptations, not silent drift)"
    - "every historical receipt's sha256 (recomputed post-migration) matches its pre-migration sha256 exactly -- zero-byte-drift proof, not a spot check"
    - "every historical approval receipt's approved_claim_receipt_id / approved_claim_path / approved_claim_sha256 still resolves correctly against its co-migrated claim receipt"
    - "the full existing Research OS test suite (test_scan_artifacts.py, test_result_explorer.py, test_repo_resolver.py, test_verify.py, all validate_*.py-backed tests, etc.) passes when run from research-os"
    - "EXTERNAL-REPO-RESOLUTION's resolver works correctly when invoked from research-os, resolving wifi-csi-fall-attack-safety-demo via the real (gitignored) local override created in phase 2"
    - "Result Explorer resolves and hashes evidence correctly in the experiment repository via the resolver, from research-os"
    - "artifact scanning (scan_artifacts.py) remains strictly read-only against the experiment repository -- verified via before/after hash comparison of the experiment repository's working tree"
    - "the dashboard renders from research-os and is idempotent (two consecutive --render runs byte-identical; --check reports PASS)"
    - "every registry (goals, datasets, reference_evidence, experiment_candidates, experiment_identity, paper_registry) and every validator passes when run from research-os"
    - "the Brainstorm Checker (NEXT-EXP-REVIEW) and dashboard candidate review (DASH-NEXT-EXP-REVIEW) reproduce identical verdicts/ranks from research-os as they did from wifi-csi-fall-attack-safety-demo"
    - "test-split guards and held-out-test protections are demonstrably unweakened: the .claude hook and test_split_guard.py remain fully in force in wifi-csi-fall-attack-safety-demo (section 3 exception), unmodified by this migration"
    - "automation/experiment_queue.yaml's content is migrated unchanged and remains empty/unchanged in effect -- no queue action is introduced by migration"
    - "wifi-csi-fall-attack-safety-demo remains fully operational and byte-unchanged (beyond the explicitly allowed pre-existing untracked items) throughout the entire import and validation process"
    - "migrate/research-os-layer contains zero copied result/evidence data anywhere in its tree or history"
    - "no absolute machine-specific path (e.g. C:\\Users\\Hesar\\...) is committed anywhere in migrate/research-os-layer -- verified by grepping the entire imported tree for the local username/path pattern and asserting zero matches outside the gitignored, uncommitted local-override file"
    - "rollback is proven possible by deleting the unmerged migrate/research-os-layer branch with zero effect on research-os's main or on wifi-csi-fall-attack-safety-demo (per rollback_procedure, section 10b)"
    - "a clean Python virtual environment installing only automation/requirements.txt can import every scripts/automation/*.py production module and pass the full pytest scripts/automation/ suite, run from within research-os's own checkout (section 3b)"
    - "every per-path collision resolution in target_collision_and_preservation_policy (section 4b) is verified against research-os's THEN-CURRENT state at implementation time (not merely this contract's snapshot), and the preflight collision report (section 4b) hard-stops on any newly-discovered, unresolved collision"
    - "the migration_provenance.yaml record (section 8) is created, is internally consistent with the actual imported commits, and every historical receipt's legacy short-hash interpretation resolves per the fixed source-repository policy (section 8) with zero ambiguous/unresolvable entries left unreported"
    - "the migrated dashboard renders AUT-TSG-impl (and any task in the same special-case category) with an explicit non-migrated-operational-files annotation, never as if actively reverified from research-os (section 8 dashboard-rendering requirement)"
    - "migrate/research-os-layer is pushed to origin (a normal, non-force push of a new branch) and a human approval receipt exists for the RESEARCH-OS-MIGRATION claim -- BOTH occur strictly before any main-branch merge is even proposed, per migration_implementation_sequence steps 5-7"
    - "no merge into research-os's main occurs as part of this implementation -- verified by confirming main's HEAD is unchanged from base_commit throughout, and that the separate transition task (sequence step 8) has not been created or executed by this implementation"
  test_requirement: "dry-run and synthetic temporary-repository tests are used wherever they can substitute for operating on the real target (e.g. the resolver's dirty-worktree and traversal/escape tests, per Phase 1 precedent, and the clean-venv dependency-import proof, section 3b); the real source/target pair is touched only for the identity-verification, subtree-split/format-patch/am, and final cross-repository resolution proof steps, all of which are read-only against the source repository and confined to the new, unmerged, pushed-but-not-merged migration branch in the target repository."

# ------------------------------------------------------------------------------------- 12. design deliverable boundary
design_deliverable_boundary:
  this_contract_creates: "only this acceptance/design specification"
  this_contract_does_not_create:
    - "a migration branch in research-os"
    - "any copied or moved file in either repository"
    - "any deletion in either repository"
    - "any change to either repository's remote configuration"
    - "any merged history"
    - "any git subtree/filter-repo/format-patch/cherry-pick/bundle invocation"
    - "any real local override file"
    - "any VALIDATION-PILOT-GATE implementation"
    - "any experiment, queue action, protocol-freeze record, or held-out-test read"
  future_task_boundaries:
    this_step: "RESEARCH-OS-MIGRATION-design -- this design-only contract; registered in automation/tasks.yaml as its own gated design task, following the EXTERNAL-REPO-RESOLUTION-design / VALIDATION-PILOT-GATE-design precedent of explicit registration."
    future_implementation: "RESEARCH-OS-MIGRATION -- the actual migration (import, dependency setup, collision-safe placement, cross-repository configuration and validation), registered in automation/tasks.yaml at that time, covering ONLY steps 1-7 of migration_implementation_sequence (create branch through push+approve) -- steps 8-10 (main-branch merge/authority transition, source decommission) are explicitly separate, later, separately-gated tasks."
    likely_implementation_dependencies: [EXTERNAL-REPO-RESOLUTION, EXTERNAL-REPO-RESOLUTION-design]
    separate_downstream_tasks_not_created_by_this_contract:
      - "the future main-branch-merge / authority-transition task (migration_implementation_sequence step 8)"
      - "the future source-decommission task (migration_implementation_sequence step 10)"
      - "VALIDATION-PILOT-GATE implementation -- remains paused until the separate authority-transition task (step 8) completes in research-os, not merely after this migration's unmerged branch passes validation"
      - "any full legacy-path-migration cleanup task (converting every bare path reference to explicit (repository_id, repository_relative_path) pairs -- a separate, later task per the Phase 1 contract's own path-migration policy)"
      - "any future clarifying edit to research-os's CLAUDE.md distinguishing .claude/agents/research-os.md from the migrated automation/ layer (section 4b naming-ambiguity note) -- a non-blocking, optional, separate follow-up"

# ------------------------------------------------------------------------------------------ acceptance criteria
design_complete:
  - "This acceptance file approved by the user."
implementation_complete:
  - "NOT YET -- no migration branch exists in research-os."
  - "NOT YET -- no subtree-split/format-patch import has been performed."
  - "NOT YET -- no cross-repository resolution has been validated from research-os."
  - "NOT YET -- no authority transition has occurred."
test_passed:
  not_applicable: "no implementation exists yet to test"
accepted:
  - "User approval receipt (actor.kind: user) exists for this design step, task_id RESEARCH-OS-MIGRATION-design, registered in automation/tasks.yaml as its own gated design task, depending on EXTERNAL-REPO-RESOLUTION and EXTERNAL-REPO-RESOLUTION-design."

forbidden_actions:
  - "create a migration branch in this step"
  - "copy, move, or delete any file in either repository in this step"
  - "change either repository's remote configuration in this step"
  - "merge histories, or run git subtree/filter-repo/format-patch/cherry-pick/bundle in this step"
  - "create a real local override file in this step"
  - "implement VALIDATION-PILOT-GATE in this step"
  - "run any experiment or access held-out-test data in this step"
  - "merge migrate/research-os-layer into research-os's main as part of this contract or its future implementation task -- that is exclusively migration_implementation_sequence step 8, a separate, later, separately-approved task"
  - "perform the source decommission (migration_implementation_sequence step 10) as part of this contract or its future implementation task"
  - "stage, commit, or push"
