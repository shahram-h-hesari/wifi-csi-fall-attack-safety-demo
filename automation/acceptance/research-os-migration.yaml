# --------------------------------------------------- 8. receipt, provenance, and task-state policy (corrections 4 + 5)
receipt_and_historical_task_policy:
  historical_receipts:
    rule: "every receipt already in wifi-csi-fall-attack-safety-demo's automation/receipts/ (all ~70+ existing receipts as of this contract) is migrated as a FILE (via the history-preservation procedure, section 5) but its CONTENT is never rewritten, re-hashed, or edited -- byte-identical before and after migration."
    short_git_head_fields: "every historical receipt's ambiguous 7-character git.head value remains documented as referring to a commit in wifi-csi-fall-attack-safety-demo's history, never reinterpreted as a research-os commit merely because the file now physically resides in research-os."
    old_approval_bindings: "remain valid exactly as recorded (approved_claim_receipt_id / approved_claim_path / approved_claim_sha256 continue to point at the co-migrated claim receipt file, whose content and hash are unchanged by the file-level move)."
    no_rewrite_rule: "no historical receipt is rewritten, re-hashed, renamed, or reinterpreted merely because it changed repositories."
    byte_identity_is_literal_not_approximate: >
      "byte-identical" means the exact raw bytes, including line-ending encoding -- NOT "the same
      content after normalization." An audit of the first migration attempt found 29 of 68 shared
      historical receipts changed from CRLF to LF due to a target `.gitattributes` rule applying
      `text eol=lf` broadly under `automation/**`, which silently changed their sha256 even though
      their parsed JSON content was unchanged. This is a CONFIRMED VIOLATION of this rule, not a
      theoretical risk: it must never recur. Line-ending normalization, whitespace normalization, or
      any other content transformation of a historical receipt file during import, checkout, or any
      later operation is explicitly FORBIDDEN. See gitattributes_policy (below) for the exact required
      fix, and implementation_validation_suite for the required proof (raw sha256 equality against the
      source snapshot, not merely JSON-equivalence).
    required_correction_for_the_next_implementation_attempt: >
      Any future migration-implementation attempt must RESTORE every already-migrated historical
      receipt in migrate/research-os-layer (or any successor branch) to its EXACT source-snapshot
      bytes before that branch can be considered valid -- re-checking out each receipt file from the
      recorded source blob, or re-importing it through a corrected `.gitattributes` (or its absence),
      whichever the implementation determines actually achieves byte equality, and then proving it via
      the raw sha256 comparison in implementation_validation_suite. A JSON-content-equivalence check
      (e.g. comparing parsed objects) is explicitly NOT sufficient proof of byte-identity.

# ---------------------------------------------------------------- absolute-path classification policy (correction)
absolute_path_classification_policy:
  problem_being_corrected: >
    The implementation's superseding migration claim reclassified a failing absolute-path scan as a
    generic "scoped pass" after discovering that this very design contract's own prose (written before
    this correction) contains literal machine-specific paths (e.g.
    C:\Users\Hesar\Documents\GitHub\wifi-csi-fall-attack-safety-demo). That reclassification was not
    authorized by the accepted contract text at the time, which stated an unconditional "zero matches
    ... outside the gitignored, uncommitted local-override file" rule with no historical-literal
    exception. This section replaces the vague "scoped pass" with two explicit, narrow, non-generic
    categories and a required scanner output schema -- a "scoped pass" phrase alone is NEVER sufficient
    acceptance evidence going forward.
  forbidden_active_machine_specific_paths:
    definition: >
      An absolute, machine-specific filesystem path (e.g. matching the pattern of this machine's
      username/home-directory structure) that appears in content that is READ, RESOLVED, or ACTED
      UPON at runtime, or that is newly generated by any tool in this repository.
    forbidden_in:
      - "active tracked registries (automation/registry/*.yaml, automation/registry/external_repositories.yaml)"
      - "runtime configuration read by any script (any file scripts/automation/*.py opens and parses to make a decision)"
      - "generated status (automation/status.json)"
      - "generated dashboard content (RESEARCH_DASHBOARD.md)"
      - "any NEW claim or approval receipt authored after this contract's acceptance (i.e. every receipt whose task_id or content did not already exist at the source snapshot)"
      - "migration_provenance.yaml's runtime fields (source_commit_range, target_migration_merge_commits, generated_history_shas, and any other field a script reads programmatically)"
      - "executable code defaults (e.g. a hard-coded fallback path in repo_resolver.py or update_dashboard.py)"
      - "any committed local-override-shaped file (the real local override itself must never be committed at all, per external_repository_configuration, section 7)"
    requirement: "active_machine_path_matches MUST equal exactly 0 in every category above. This is a hard, unconditional pass/fail gate -- no scope, exception, or waiver may reduce it."
  historical_documentary_literals:
    definition: >
      A literal absolute path that exists ONLY inside an IMMUTABLE historical artifact -- a receipt or
      an accepted design contract's own prose -- that was already committed, byte-identical, before
      this correction, and that this contract's own no-rewrite rule (historical_receipts.no_rewrite_rule
      above) forbids editing.
    rules:
      - "a historical/documentary literal must NEVER be used as runtime configuration by any script"
      - "a historical/documentary literal must NEVER be interpreted as a resolver path, fallback, or default by repo_resolver.py or any other script"
      - "a historical/documentary literal must NEVER be copied, quoted, or re-derived into any newly generated claim, status, or dashboard field -- it stays confined to the historical file it already lives in"
      - "every historical/documentary literal must be individually reported by the absolute-path scanner, by exact file path and line number, never summarized as a single generic count or silently folded into a 'pass'"
      - "a historical/documentary literal is classified as documentary provenance, explicitly labeled as such -- it is never silently ignored and never counted toward, or used to justify, active_machine_path_matches"
  required_scanner_outcome_schema:
    active_machine_path_matches: "integer; MUST be 0 for the scan to pass at all"
    historical_documentary_literal_matches:
      - path: "repository-relative path of the file containing the literal"
        line: "line number"
        literal_excerpt: "the matched text, for human review"
        justification: "why this specific occurrence is classified as historical/documentary rather than active (e.g. 'inside automation/acceptance/research-os-migration.yaml, an immutable historical design-contract file already accepted before this scan; describes a temporary clone location in prose, never read by any script')"
    outcome: "PASS only if active_machine_path_matches == 0; every historical_documentary_literal_matches entry is enumerated (never zero-summarized) and has been HUMAN-REVIEWED, not merely machine-classified, before the claim is considered acceptable"
  explicitly_forbidden: >
    A claim receipt MAY NOT report this check as a bare "pass" or "scoped pass" string. It MUST report
    the full required_scanner_outcome_schema above, including every historical_documentary_literal_matches
    entry, so a human reviewer (not the implementation itself) makes the final call on whether the
    enumerated historical literals are acceptable. Self-authored scope narrowing of this check, as
    occurred in the audited superseding migration claim, is a defect requiring correction, not a valid
    precedent for future claims.

  migration_provenance_record:
    principle: >
      Historical receipts are NEVER edited to add cross-repository context (per the no-rewrite rule
      above). Instead, a SEPARATE, new, append-only record is created that maps historical/task
      identity to source-repository and target-migration context, without touching any historical
      receipt file.
    proposed_committed_path: "automation/migration_provenance.yaml (migrated into research-os as part of the final migration commit, section 5 step 4; does not exist in wifi-csi-fall-attack-safety-demo today and is authored fresh during the implementation)"
    proposed_schema:
      schema_version: 1
      migration:
        source_repository_id: "wifi-csi-fall-attack-safety-demo"
        source_remote_url: "https://github.com/shahram-h-hesari/wifi-csi-fall-attack-safety-demo.git"
        source_branch: "feature/safety-proxy-guided-defense"
        source_commit_range: "f64d5626d3b159f85988668f0a86281035678e93..<SOURCE_SNAPSHOT_SHA captured fresh at implementation preflight, per repositories.source_snapshot_policy -- e.g. 3021f1279ce8cdd9d5dd728e683d8376fb0f83ea or a later descendant that has it as an ancestor, whichever is HEAD of feature/safety-proxy-guided-defense at the moment the migration implementation actually runs; NEVER the stale ed50db0d62b755cd7aae9f00228665ba0cdb5750 endpoint from an earlier draft of this contract>"
        target_repository_id: "research-os"
