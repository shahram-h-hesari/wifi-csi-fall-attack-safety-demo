schema_version: 1
automation: research-os-migration
stage: research-os-migration-phase-2-design
gated: true    # every future claim over this contract is approval-gated, like every prior registry
type: design_contract   # SPEC ONLY -- no migration branch, import, or file move exists yet

status: DESIGN_ONLY_NOT_IMPLEMENTED

relationship_to_prior_phases: >
  This is Migration Phase 2 of the accepted architecture recommendation (read-only migration audit)
  and builds directly on the now-ACCEPTED Migration Phase 1 (EXTERNAL-REPO-RESOLUTION-design /
  EXTERNAL-REPO-RESOLUTION, checks 9/9 and 52/52 respectively). Phase 1 built and validated the
  resolver, tracked registry (automation/registry/external_repositories.yaml), and gitignored
  local-override template (automation/local/external_repository_paths.example.yaml) that let Research
  OS code resolve an external experiment repository's evidence WITHOUT co-location. This contract
  (Phase 2) designs the actual, history-preserving RELOCATION of the Research OS layer out of
  wifi-csi-fall-attack-safety-demo and into research-os, using that resolver -- it does not perform
  the relocation, and it does not touch either repository's committed state.

# ---------------------------------------------------------------------------------- 1. purpose
purpose: >
  Defines a controlled, history-preserving migration of the Research OS governance layer (dashboard,
  registries, acceptance contracts, receipts, reviews, automation scripts) from
  wifi-csi-fall-attack-safety-demo into research-os, such that:
    - research-os becomes the sole home of dashboard/governance/registries/acceptance/receipts/
      reviews/automation;
    - wifi-csi-fall-attack-safety-demo remains the sole home of experiment code, results,
      checkpoints, figures, analysis scripts, and evidence artifacts;
    - research-os accesses experiment evidence exclusively through the accepted external-repository
      resolver (EXTERNAL-REPO-RESOLUTION), never by copying evidence;
    - no two permanent Research OS sources of truth remain after the migration completes.
  This contract creates NO migration branch, copies NO file, deletes NO file, changes NO remote,
  merges NO history, runs NO git subtree/filter-repo/format-patch/cherry-pick/bundle command, creates
  NO real local override, and does not resume VALIDATION-PILOT-GATE implementation. It is a contract
  for a future, separately-approved implementation task (RESEARCH-OS-MIGRATION) only.

# --------------------------------------------------------------------- 2. repositories and starting state
repositories:
  source:
    local_path: "C:\\Users\\Hesar\\Documents\\GitHub\\wifi-csi-fall-attack-safety-demo"
    remote_url: "https://github.com/shahram-h-hesari/wifi-csi-fall-attack-safety-demo.git"
    branch: "feature/safety-proxy-guided-defense"
    research_os_history_floor: "f64d5626d3b159f85988668f0a86281035678e93 -- the repository's own root commit, i.e. the fixed, permanent lower bound of every commit that could ever touch the migrated paths; this floor never changes and is safe to hard-code, unlike a moving upper endpoint (see source_snapshot_policy, correction below)"
    minimum_required_ancestor: "3021f1279ce8cdd9d5dd728e683d8376fb0f83ea -- the commit that accepted THIS design contract itself; the eventual SOURCE_SNAPSHOT_SHA (defined below) MUST have this commit as an ancestor, so the migrated inventory is guaranteed to include this contract, its own claim/approval receipts, and everything accepted alongside it. This is a MINIMUM bound, not a fixed endpoint -- see source_snapshot_policy."
  target:
    local_path: "C:\\Users\\Hesar\\Documents\\GitHub\\research-os"
    remote_url: "https://github.com/shahram-h-hesari/research-os.git"
    base_branch: "main"
    base_commit: "b997ed6aba4e3395c3b02eef951b3536450b8961"
    base_commit_change_policy: "the target base remains exactly b997ed6aba4e3395c3b02eef951b3536450b8961 unless a separately approved design amendment to THIS contract explicitly changes it -- it is never silently advanced just because research-os's main moves"

  # ------------------------------------------------------------- source-snapshot policy (correction)
  source_snapshot_policy:
    problem_being_corrected: >
      The prior version of this contract hard-coded the history range's upper endpoint to
      ed50db0d62b755cd7aae9f00228665ba0cdb5750 (the commit at which EXTERNAL-REPO-RESOLUTION was
      accepted). This design contract (research-os-migration.yaml) and its own claim/approval
      receipts were themselves subsequently committed at 3021f1279ce8cdd9d5dd728e683d8376fb0f83ea --
      AFTER ed50db0d. Following the old hard-coded endpoint literally would OMIT this very contract,
      its superseded and active design claims, its approval receipt, and the automation/tasks.yaml /
      dashboard/status/changelog updates that came with it -- directly violating the migration
      inventory's own "entire automation directory / all historical receipts" requirement. This
      section replaces the fixed endpoint with an execution-time policy so the same self-referential
      staleness cannot recur with THIS correction's own commit either.
    rule: >
      The history range's upper endpoint is NEVER a value hard-coded in this contract. It is always
      SOURCE_SNAPSHOT_SHA -- a full 40-character commit SHA captured fresh at migration-implementation
      PREFLIGHT time, defined as follows:
    preflight_capture_procedure:
      - "1. Run `git -C <source_local_path> rev-parse HEAD` on the wifi-csi-fall-attack-safety-demo checkout, on branch feature/safety-proxy-guided-defense. The full 40-character result is SOURCE_SNAPSHOT_SHA."
      - "2. Verify SOURCE_SNAPSHOT_SHA has minimum_required_ancestor (3021f1279ce8cdd9d5dd728e683d8376fb0f83ea) as an ancestor: `git merge-base --is-ancestor 3021f1279ce8cdd9d5dd728e683d8376fb0f83ea SOURCE_SNAPSHOT_SHA` must succeed. If it fails, HARD STOP -- the checkout is somehow behind the accepted design contract itself, which must never be silently tolerated."
      - "3. Verify SOURCE_SNAPSHOT_SHA is exactly synchronized with origin/feature/safety-proxy-guided-defense: `git rev-parse origin/feature/safety-proxy-guided-defense` (after a read-only `git fetch --dry-run` style check, or by trusting a just-fetched remote-tracking ref) must equal SOURCE_SNAPSHOT_SHA exactly. If local HEAD is ahead of or diverged from the pushed remote, HARD STOP -- the migration must never operate on unpushed local-only commits."
      - "4. Verify the source checkout has zero tracked modifications and zero staged files: `git status --porcelain` restricted to tracked paths must be empty (pre-existing untracked items such as .codex/, results/**, scripts/analysis/** are permitted and irrelevant to this check, per the existing dirty-worktree cleanliness policy in target_branch_policy)."
      - "5. Record SOURCE_SNAPSHOT_SHA in both the migration_provenance.yaml record (section 8) and the RESEARCH-OS-MIGRATION implementation claim receipt -- never only in one or the other."
    freeze_after_capture: >
      Once SOURCE_SNAPSHOT_SHA is captured and verified (steps 1-4 above), the source repository is
      considered FROZEN for the remainder of the migration implementation. If source HEAD, tracked
      working-tree state, current branch, or the remote-tracking relationship to
      origin/feature/safety-proxy-guided-defense changes at any point before target-side validation
      (migration_implementation_sequence step 4) completes, the migration implementation MUST ABORT
      -- it may not silently re-capture a new snapshot mid-run and continue as if nothing changed.
    no_self_referential_hardcoding: >
      This correction does deliberately NOT replace ed50db0d62b755cd7aae9f00228665ba0cdb5750 with
      another permanently hard-coded "latest design commit" (e.g. 3021f1279ce8cdd9d5dd728e683d8376fb0f83ea
      itself) as the new fixed upper endpoint -- doing so would immediately become stale again the
      moment this very correction is committed, reproducing the exact defect being fixed. Instead,
      3021f1279ce8cdd9d5dd728e683d8376fb0f83ea is recorded ONLY as minimum_required_ancestor (a floor
      the eventual snapshot must be at or after), never as the snapshot itself. The snapshot is always
      captured fresh, at execution time, per the procedure above.
    rerun_with_a_different_snapshot: >
      If the migration implementation is re-run and captures a DIFFERENT SOURCE_SNAPSHOT_SHA than a
      prior attempt (e.g. because more commits landed on feature/safety-proxy-guided-defense in the
      meantime), this is NOT silently accepted as an equivalent re-run. It must fail visibly unless a
      NEW migration claim is authored that EXPLICITLY supersedes the earlier attempt's claim (per the
      existing supersedes convention used throughout this repository's receipts) and explicitly
      documents the new SOURCE_SNAPSHOT_SHA and why it differs. A silent, undocumented re-snapshot is
      exactly the ambiguity this correction exists to prevent.

  identity_verification_required_before_any_implementation_step: >
    The implementation must verify, via read-only git commands only: source repo's `git remote get-url
    origin` equals the source remote_url above; source HEAD equals the freshly-captured
    SOURCE_SNAPSHOT_SHA (per source_snapshot_policy above), which must in turn have
    research_os_history_floor as a distant ancestor and minimum_required_ancestor as a nearer ancestor;
    target repo's `git remote get-url origin` equals the target remote_url above;
    target main is at (or a descendant of) base_commit. Any mismatch is a hard stop, not a warning.

# ------------------------------------------------------------------------------- 3. migration inventory
migration_inventory:
  principle: >
    The inventory is NOT limited to the three paths named in the task prompt (RESEARCH_DASHBOARD.md,
    automation/, scripts/automation/) -- every root-level file and every import/execution dependency
    of the Research OS layer was inspected before finalizing this list.
  root_level_files_to_migrate:
    - path: "RESEARCH_DASHBOARD.md"
      reason: "the generated Research OS dashboard itself"
    - path: ".gitignore (Research-OS-relevant lines only)"
      reason: "the single tracked line 'automation/local/external_repository_paths.yaml' must be reproduced in research-os's own .gitignore; the source .gitignore as a whole is NOT migrated (it also covers experiment-repo-specific patterns -- pilot logs, checkpoints, results -- that do not apply to research-os)"
    - path: ".claude/skills/dashboard-refresh/SKILL.md"
      reason: "a thin wrapper skill over scripts/automation/update_dashboard.py; belongs with the automation it wraps"
  directories_to_migrate:
    - path: "automation/"
      reason: "entire directory: README.md, acceptance/, artifact_manifest.csv + .meta.json, dashboard_changelog.md, designs/, do_not_build_yet.md, experiment_queue.yaml, frontier.yaml, literature/, local/ (template only, see local-override policy), receipts/, registry/, reviews/, roadmap.yaml, status.json, tasks.yaml"
      exclusion_within_this_directory: "none -- automation/ contains no experiment-specific content; confirmed by the Phase 1 audit and re-confirmed for this contract (grep of automation/ for results/ or checkpoints/ finds only STRING REFERENCES to evidence paths, never the evidence itself)"
    - path: "scripts/automation/"
      reason: "entire directory: update_dashboard.py, repo_resolver.py, result_explorer.py, scan_artifacts.py, dashboard_research_summary.py, dashboard_candidate_review.py, next_experiment_brainstorm_checker.py, all validate_*.py, all test_*.py -- EXCEPT test_split_guard.py and test_split_guard_cases.py (see explicit exception below)"
  explicit_exception_test_split_guard:
    files: ["scripts/automation/test_split_guard.py", "scripts/automation/test_split_guard_cases.py"]
    decision: "REMAIN in wifi-csi-fall-attack-safety-demo; NOT migrated, despite being tracked under scripts/automation/ and governed by task AUT-TSG."
    reason: >
      test_split_guard.py is invoked by .claude/settings.json's PreToolUse hook using a path relative
      to whatever repository Claude Code is running Bash/PowerShell commands in. That hook protects
      the EXPERIMENT repository's own git/shell operations (blocking or warning on unauthorized
      --split test invocations of export_probability_predictions.py / adaptive_gate_attack.py, both
      of which live in the experiment repository). If this script moved to research-os, the hook
      would silently stop firing in wifi-csi-fall-attack-safety-demo the moment the source copy was
      later decommissioned -- an unacceptable safety regression. This is a deliberate, narrow,
      documented exception to "automation/scripts/automation moves wholesale," not an oversight or a
      second source of truth: the AUT-TSG *governance record* (acceptance/test-split-guard.yaml,
      its receipts, its tasks.yaml entry) moves to research-os as history/tracking, while the *live
      enforcement mechanism* (script + .claude hook) necessarily stays operationally bound to the
      repository it protects -- exactly analogous to how a CI config lives in every repository it
      guards, not only in a central governance repo.
    consequence: "research-os's copy of tasks.yaml will describe AUT-TSG and reference its acceptance file, but the actual .py enforcement files are not present in research-os; this is called out explicitly in the migration receipt so it is never mistaken for a missed file."
  additional_dependency_check_performed:
    - checked: "requirements.txt"
      finding: "lists numpy/pandas/matplotlib/scipy/scikit-learn/jupyter/streamlit/pytest -- experiment-code dependencies. PyYAML (used by every Research OS script) is installed in the local .venv but is NOT listed in requirements.txt today. This is a pre-existing gap, not introduced by this design; the migration implementation must add a minimal research-os-local requirements file (e.g. requirements.txt with pytest + PyYAML) rather than assuming the experiment repo's requirements.txt is available post-migration."
    - checked: ".claude/skills/git-stage-check/SKILL.md"
      finding: "a pre-commit staging verifier for THIS repo's thesis-specific hygiene (seed isolation, checkpoint leakage, log files) -- experiment-repo-specific, NOT migrated; distinct from automation/acceptance/git-stage-check.yaml's AUT-GSC-EXT task, which is a Research-OS-tracked future automation idea and DOES migrate as a governance record (design-only, unimplemented either way)"
    - checked: "EXPERIMENT_EVIDENCE_INDEX.md, LOCAL_PROJECT_MAP.md, README.md, THIRD_PARTY_NOTICES.md, LICENSE"
      finding: "all experiment-repository-specific (thesis evidence trail, local path map naming this specific machine's experiment checkout, project README, licensing) -- NOT migrated"
    - checked: "import/execution dependencies of scripts/automation/*.py"
      finding: "no script imports anything from outside automation/ or scripts/automation/ other than the standard library, PyYAML, and (in tests) pytest; scan_artifacts.py and repo_resolver.py read experiment-repo paths only through repository-relative strings / the resolver, never via a Python import of experiment code -- confirming no hidden source-tree dependency exists beyond the two directories and the root dashboard file"
    - checked: "pytest.ini / conftest.py / pyproject.toml at repo root or under scripts/automation/"
      finding: "none exist; every scripts/automation/test_*.py inserts its own directory into sys.path at the top of the file (HERE = Path(__file__).resolve().parent; sys.path.insert(0, str(HERE))), so tests are runnable via `pytest scripts/automation/` from any working directory without any additional test-configuration file. No test-configuration file needs to migrate beyond the test files themselves."

# --------------------------------------------------------------- 3b. dependency and runtime policy (correction 1)
dependency_and_runtime_policy:
  problem_being_corrected: >
    The original contract excluded the experiment repository's requirements.txt (correctly -- it
    lists numpy/pandas/matplotlib/scipy/scikit-learn/jupyter/streamlit/pytest, all experiment-code
    dependencies) but did not define what the TARGET repository uses instead. This section resolves
    that gap with one explicit, chosen policy, based on an actual inspection of both the source
    scripts and the target repository (not an assumption).
  source_import_inventory: >
    Every module under scripts/automation/ was grepped for `import`/`from` statements. The complete
    set of non-stdlib imports across the ENTIRE directory (production code and tests) is exactly two
    third-party packages: PyYAML (imported as `import yaml`) and pytest (imported only by test_*.py
    files, i.e. a test/dev-only dependency, never a runtime dependency of update_dashboard.py,
    repo_resolver.py, scan_artifacts.py, result_explorer.py, or any validator). No script imports
    numpy, pandas, matplotlib, scipy, scikit-learn, jupyter, streamlit, torch, or any other package
    from the source repository's requirements.txt. Locally installed versions (from the source
    repository's .venv, via `pip freeze`): PyYAML==6.0.3, pytest==9.1.0, Python 3.10.11.
  target_environment_inventory: >
    A read-only inventory of research-os at commit b997ed6aba4e3395c3b02eef951b3536450b8961 found NO
    requirements.txt, pyproject.toml, Pipfile, setup.py, or any other Python dependency/environment
    file anywhere in the repository. research-os today is a Markdown/config-only repository (its own
    .gitignore explicitly states: "this repo is Markdown/config only" and blocks *.pdf/*.csv/*.png/
    *.pt/etc.) operated by a Claude Code agent (.claude/agents/research-os.md) that reads/writes
    Markdown ledgers -- it has never executed Python code. There is therefore no existing target
    dependency file to extend, and no committed environment specification to prove sufficient.
  chosen_policy: >
    CREATE a new, minimal, explicitly-scoped dependency file at automation/requirements.txt (inside
    the migrated automation/ directory, NOT at research-os's repository root) containing exactly:
      PyYAML==6.0.3
      pytest==9.1.0
    This is scoped to automation/ specifically (not a root-level requirements.txt) so it is
    unambiguous that only the newly-added automation subsystem has a Python dependency surface --
    research-os's pre-existing Markdown/config-only character for everything else is preserved and
    not silently redefined as "a Python project" by this migration. A short note is added to
    automation/README.md (migrated) documating "python -m venv + pip install -r
    automation/requirements.txt" as the setup step, and stating the Python version convention
    (3.10+, matching the source repository's .venv) inherited from wifi-csi-fall-attack-safety-demo.
  do_not_copy_full_requirements_txt: "explicitly rejected -- copying the source's complete requirements.txt would pull in numpy/pandas/matplotlib/scipy/scikit-learn/jupyter/streamlit/torch, none of which any automation/ or scripts/automation/ script imports; this would misrepresent the automation layer's actual dependency surface and bloat the target environment for no functional reason."
  migration_inventory_addition: "automation/requirements.txt is added to the migration inventory (section 3) as a NEW file authored during the implementation, not copied from any existing source file -- it does not exist in wifi-csi-fall-attack-safety-demo today and is not claimed to."
  validation_requirement: >
    The implementation must prove, as part of the validation suite (section 11): starting from a
    CLEAN Python virtual environment (no packages beyond a bare Python 3.10+ interpreter), running
    `pip install -r automation/requirements.txt` followed by `python -c "import sys;
    sys.path.insert(0,'scripts/automation'); import update_dashboard, repo_resolver, result_explorer,
    scan_artifacts, dashboard_research_summary, dashboard_candidate_review,
    next_experiment_brainstorm_checker"` succeeds with no ImportError, AND the full
    `pytest scripts/automation/` suite passes, all executed from within research-os's own checkout
    post-migration -- proving automation/requirements.txt is complete and sufficient on its own,
    with no hidden dependency on the source repository's environment.

# ------------------------------------------------------------------------------- 4. exclusion inventory (remains in experiment repository)
exclusion_inventory:
  - "results/ (all experiment outputs)"
  - "figures/ (referenced by artifact_manifest.csv, never duplicated into research-os)"
  - "checkpoints and model weights, wherever stored"
  - "scripts/analysis/ (analysis/plotting scripts, referenced as generator_script)"
  - "scripts/archive/ (pre-thesis plot generators)"
  - "SenseFi/UT-HAR dataset and training code"
  - "experiment execution scripts (export_probability_predictions.py, adaptive_gate_attack.py, and similar)"
  - "thesis-specific or experiment-specific files: EXPERIMENT_EVIDENCE_INDEX.md, LOCAL_PROJECT_MAP.md, README.md, THIRD_PARTY_NOTICES.md, LICENSE, requirements.txt (experiment-code deps)"
  - "scripts/automation/test_split_guard.py, scripts/automation/test_split_guard_cases.py, and .claude/settings.json's PreToolUse hook wiring (explicit exception, section 3)"
  - ".claude/skills/git-stage-check/SKILL.md (experiment-repo-specific pre-commit hygiene)"
  - "root-level pilot logs (A1_seed42_pilot_run.log, basat_*.log, bilstm_*.log, optionB_*.log -- already gitignored, local-only)"

# --------------------------------------------------------- 4b. target collision and preservation policy (correction 2)
target_collision_and_preservation_policy:
  method: >
    A read-only inventory of research-os at commit b997ed6aba4e3395c3b02eef951b3536450b8961
    (`git ls-tree -r`, plus direct inspection of every root file and .claude/ subtree) was performed
    and cross-checked against every path in the migration inventory (section 3).
  actual_target_state_found: >
    research-os is NOT an empty or scaffold repository. It is an existing, operating, differently-
    architected system: a "Weekly PhD Research OS Agent" -- a Markdown-ledger + Claude-Code-agent
    research-operations tracker, governed by its own CLAUDE.md, with its own dashboard (dashboard.md),
    its own append-only state ledgers (state/experiments.md, state/commits.md, state/roadmap.md,
    state/decisions.md, state/thesis-updates.md, state/literature.md, state/weekly/*.md), its own
    audience-specific "lanes/" files, its own "guardrails/" claim-safety files, its own agent
    definition (.claude/agents/research-os.md) and slash commands
    (.claude/commands/research-log.md, roadmap-change.md, weekly-review.md), its own README.md,
    CLAUDE.md, LICENSE-equivalent notices, and its own .gitignore. Its own CLAUDE.md documents that it
    ALREADY reads wifi-csi-fall-attack-safety-demo (and two other repos) via an implicit SIBLING-
    FOLDER convention ("This repo sits beside the work repos in the local parent GitHub workspace") --
    this is noted explicitly below as a pre-existing, DIFFERENT mechanism from the Phase 1 resolver,
    not something this migration modifies or is authorized to modify.
  per_path_collision_report:
    - migration_path: "RESEARCH_DASHBOARD.md"
      target_state: "does not exist under this name; target has a DIFFERENT existing file, dashboard.md, serving a different purpose (a thesis-roadmap P1-P5 committee-facing status pane, not a governance/automation dashboard)"
      collision_type: "none (no file/directory collision) -- but a NAMING/PURPOSE ambiguity is flagged: after migration research-os will contain two conceptually distinct 'dashboards' (dashboard.md = thesis roadmap; RESEARCH_DASHBOARD.md = Research OS governance/automation status). Both are preserved unmodified and unmerged; RESEARCH_DASHBOARD.md keeps its name exactly as migrated. No rename, merge, or deletion of either file is in scope for this migration."
      resolution: "PRESERVE both files as-is, unmodified, un-merged, distinctly named. Flag the naming ambiguity in the migration receipt so it is never mistaken for a missed conflict."
    - migration_path: ".gitignore (single line: automation/local/external_repository_paths.yaml)"
      target_state: "target HAS its own .gitignore, structured around 'this repo is Markdown/config only' and explicitly blocking *.csv, *.png, *.pdf, *.pt, *.pth, and other binary/data extensions"
      collision_type: "REAL, BLOCKING collision: automation/artifact_manifest.csv (a tracked .csv file being migrated) would be silently caught by the target's existing `*.csv` ignore rule if added without an explicit exception -- a `git add -f` workaround is EXPLICITLY REJECTED here as it would silently fight the target's own ignore policy on every future automation/ change, not just this one."
      resolution: >
        The implementation must APPEND (never overwrite) to research-os's existing .gitignore, in a
        clearly-labeled new section (e.g. "# === Research OS automation (tracked, exempt from the
        Markdown/config-only rule above) ==="), both: (a) the migrated line
        `automation/local/external_repository_paths.yaml` (to gitignore the real local override), and
        (b) an explicit negation `!automation/artifact_manifest.csv` (and `!automation/**/*.json` for
        receipts, if JSON is ever later added to a blocking rule -- confirmed NOT currently blocked,
        so no negation is needed for receipts today, but the check is repeated at implementation time
        in case the target .gitignore changes before then). Every other existing line in the target
        .gitignore is left completely untouched.
    - migration_path: ".claude/skills/dashboard-refresh/SKILL.md"
      target_state: "target's .claude/ directory ALREADY EXISTS and already contains .claude/agents/research-os.md and .claude/commands/{research-log,roadmap-change,weekly-review}.md -- a DIFFERENT Claude Code extension mechanism (agents + commands) for a DIFFERENT purpose (the weekly advisor-ledger agent), NOT skills"
      collision_type: "no file or directory collision (skills/ is a new subdirectory under the existing .claude/) -- but a NAMING ambiguity is flagged: .claude/agents/research-os.md is itself literally named 'research-os' and governs an entirely separate system from the migrated automation/dashboard-refresh skill. Both can and do coexist as distinct .claude/ subpaths (agents/, commands/, skills/) with no technical conflict."
      resolution: "ADD .claude/skills/dashboard-refresh/SKILL.md as a new file under a new subdirectory. Do not modify .claude/agents/research-os.md, any .claude/commands/*.md, or any other existing .claude/ content. Flag the naming ambiguity (two different things both called 'research-os' in the same repo -- the pre-existing weekly-ledger agent, and the migrated governance/automation layer this contract moves) explicitly in the migration receipt and recommend, as a non-blocking follow-up NOT part of this migration, that a human later add one clarifying sentence to CLAUDE.md distinguishing the two."
    - migration_path: "automation/ (entire directory)"
      target_state: "no automation/ directory exists in research-os today"
      collision_type: "none"
      resolution: "add as a wholly new top-level directory"
    - migration_path: "scripts/automation/ (entire directory, minus the test-split-guard exception)"
      target_state: "no scripts/ directory of any kind exists in research-os today"
      collision_type: "none"
      resolution: "add as a wholly new top-level directory tree (scripts/automation/)"
    - migration_path: "automation/requirements.txt (new file, section 3b)"
      target_state: "no Python dependency file of any kind exists in research-os today"
      collision_type: "none"
      resolution: "add as a wholly new file"
  root_files_explicitly_not_touched: "README.md, CLAUDE.md, LICENSE-equivalent notices, dashboard.md, guardrails/, lanes/, state/, templates/ -- none of these are part of the migration inventory, and this contract's future implementation must not modify, rename, or delete any of them"
  hard_requirements_confirmed:
    - "no target file is silently overwritten -- the only pre-existing target file touched at all is .gitignore, and only via an explicit, labeled APPEND, never a full-file replace"
    - "no source file is silently omitted -- every migration-inventory path (section 3) and its disposition is enumerated above; the test-split-guard exception (section 3) is the only intentional omission from scripts/automation/, and it is documented, not silent"
    - "any collision NOT explicitly resolved above is an UNEXPECTED collision and must STOP the migration implementation -- it may not proceed via ad hoc improvisation"
  preflight_requirement: >
    Before importing anything, the implementation must generate a machine-readable preflight
    inventory and collision report (see migration_provenance_record, section 8, for its schema) that
    re-runs this exact per-path check against research-os's THEN-CURRENT state (in case main has
    moved since this contract was written) and HARD-STOPS if any newly-discovered collision is not
    already covered by the resolutions listed above.

# -------------------------------------------------------------- .gitattributes policy (correction, exact decision)
gitattributes_policy:
  problem_being_corrected: >
    The first migration-implementation attempt added a `.gitattributes` file to research-os that was
    NOT named anywhere in the accepted migration inventory (section 3), applying `text eol=lf` broadly
    to `automation/**`, `scripts/automation/**`, `RESEARCH_DASHBOARD.md`, `.claude/skills/**`,
    `.gitignore`, and `.gitattributes` itself. Because `automation/receipts/**` falls under
    `automation/**`, this silently normalized 29 of 68 shared historical receipts from CRLF to LF,
    changing their sha256 -- directly violating historical_receipts.rule (above). This contract now
    makes the exact, non-discretionary decision required, rather than leaving it to the implementation.
  decision: >
    A `.gitattributes` file MAY be added to research-os for the migrated code/documentation paths
    (this is a reasonable, low-risk normalization for newly-added Python/YAML/Markdown source), BUT it
    MUST explicitly exclude every path whose bytes are subject to a historical byte-identity
    requirement from any normalization. This is option 2 of the two choices posed in the correction
    review: include `.gitattributes`, with an exact, explicit exclusion.
  required_exact_patterns:
    - "automation/** text eol=lf   # safe: newly migrated Python/YAML/Markdown source, no historical byte-identity requirement on these paths"
    - "scripts/automation/** text eol=lf   # safe: newly migrated Python source"
    - "RESEARCH_DASHBOARD.md text eol=lf   # safe: generated file, regenerated fresh on every render, no historical-byte requirement"
    - "automation/receipts/** -text   # REQUIRED EXCLUSION: every historical receipt's exact source bytes must survive migration unmodified; -text disables any line-ending conversion Git would otherwise apply"
  rule: >
    `automation/receipts/**` (and any other path a historical claim receipt's own recorded sha256
    refers to, if ever expanded beyond receipts themselves) must be pattern-excluded from EVERY
    `.gitattributes` normalization rule, listed as its OWN explicit line using `-text`, positioned so
    it is not shadowed by an earlier broader pattern (`.gitattributes` patterns are matched in file
    order with later, more specific patterns taking precedence for a given path -- the receipts
    exclusion line must appear, and be verified to take effect, for every path under
    automation/receipts/).
  required_correction_for_the_next_implementation_attempt: >
    Any future migration-implementation attempt must: (1) add the `automation/receipts/** -text` line
    (or an equivalent exact exclusion) BEFORE importing any historical receipt; (2) if a prior attempt
    already normalized receipts (as the audited attempt did), re-import or restore those receipts to
    their exact source-snapshot bytes as part of the correction, not merely add the exclusion line
    going forward; (3) prove, via implementation_validation_suite's raw sha256 comparison, that every
    historical receipt in the corrected branch is byte-identical to its source-snapshot counterpart.
  migration_inventory_addition: ".gitattributes is now an explicit, named part of the migration inventory (section 3) -- a NEW file authored during implementation (it does not exist in wifi-csi-fall-attack-safety-demo today), with the exact required patterns above and no others that could shadow the receipts exclusion."

# ------------------------------------------ 5. history-preservation method (correction 3 -- one exact, reproducible procedure)
history_preservation:
  investigation_performed_before_finalizing: >
    Before finalizing this method, the source repository's actual commit history was inspected as of
    this correction's own writing: `git log --oneline -- automation/ scripts/automation/
    RESEARCH_DASHBOARD.md .gitignore .claude/skills/dashboard-refresh/` returned EXACTLY 27 commits at
    that time, oldest first f64d5626d3b159f85988668f0a86281035678e93 ("Create standalone WiFi CSI
    fall attack safety demo" -- the repository's own root commit, recorded as
    research_os_history_floor in the repositories section) through
    ed50db0d62b755cd7aae9f00228665ba0cdb5750 ("Add external-repository resolution support"), and a
    scripted check confirmed ZERO of those 27 commits also touch any excluded path (results/,
    figures/, scripts/analysis/, scripts/archive/, or any checkpoint-pattern path). This design
    contract itself (and its own claim/approval receipts) was SUBSEQUENTLY committed at
    3021f1279ce8cdd9d5dd728e683d8376fb0f83ea -- AFTER that 27-commit snapshot -- which is exactly why
    the upper endpoint is never hard-coded (see repositories.source_snapshot_policy, above): the
    investigation's specific commit list is illustrative evidence that this repository's history is
    cleanly separable, not a frozen enumeration the implementation may treat as complete. The
    implementation MUST re-run the equivalent `git log`/mixed-commit scan against the freshly-captured
    SOURCE_SNAPSHOT_SHA at execution time and hard-stop if it ever finds a commit mixing migrated and
    excluded paths, rather than trusting this investigation's historical commit count. The single
    .gitignore line (automation/local/external_repository_paths.yaml) was introduced in exactly one
    commit as of this investigation, ed50db0d62b755cd7aae9f00228665ba0cdb5750, confirmed via
    `git log -S <line> -- .gitignore`; this remains true for any later SOURCE_SNAPSHOT_SHA since
    nothing has since touched that line again (re-verified at implementation time, not assumed).
  chosen_method: >
    A SINGLE reproducible procedure, run once, in this exact order, with no implementation
    discretion over WHICH method to use (only over exact tool invocation syntax at execution time).
    Every reference below to "SOURCE_SNAPSHOT_SHA" means the full 40-character commit SHA captured
    fresh at preflight per repositories.source_snapshot_policy -- never a value hard-coded in this
    contract:
      1. In a TEMPORARY, disposable clone of the source repository (never the working checkout at
         C:\Users\Hesar\Documents\GitHub\wifi-csi-fall-attack-safety-demo), run
         `git subtree split --prefix=automation --branch=migration-split-automation` and
         `git subtree split --prefix=scripts/automation --branch=migration-split-scripts-automation`,
         each scoped to the exact source commit range
         f64d5626d3b159f85988668f0a86281035678e93..SOURCE_SNAPSHOT_SHA (i.e. `git subtree split`
         naturally only includes commits touching the given prefix within reachable history up to
         SOURCE_SNAPSHOT_SHA; the implementation must re-run the mixed-commit scan from
         investigation_performed_before_finalizing against this exact range before proceeding, rather
         than assuming the illustrative 27-commit count above still applies verbatim).
      2. In the SAME temporary clone, run
         `git format-patch f64d5626d3b159f85988668f0a86281035678e93^..SOURCE_SNAPSHOT_SHA -- RESEARCH_DASHBOARD.md`
         and
         `git format-patch f64d5626d3b159f85988668f0a86281035678e93^..SOURCE_SNAPSHOT_SHA -- .claude/skills/dashboard-refresh/SKILL.md`
         to produce ordered, per-commit patch files for each standalone root file, up through
         SOURCE_SNAPSHOT_SHA.
      3. The single .gitignore line is EXPLICITLY NOT handled via format-patch/am (correction from
         an even earlier version of this contract): `git format-patch`/`git am` operate on the WHOLE
         FILE's diff, and research-os's .gitignore is a structurally different, pre-existing file (see
         target_collision_and_preservation_policy, section 4b) -- applying a source-derived .gitignore
         patch would either fail to apply cleanly (context mismatch) or silently reintroduce
         source-repository-specific ignore patterns (checkpoints, pilot logs) that do not belong in
         research-os. Instead, the ONE line is added as an explicit, manually-authored content
         addition (see section 4b's resolution) in the SAME migration commit that applies the
         automation/scripts.automation subtree merges -- its provenance (which source commit
         introduced it, re-confirmed at implementation time via `git log -S` against
         SOURCE_SNAPSHOT_SHA rather than assumed to still be ed50db0d62b755cd7aae9f00228665ba0cdb5750)
         is recorded in the migration provenance record (section 8) exactly as if it had been
         format-patched, without pretending the mechanical patch-apply tooling was actually used on a
         file it cannot cleanly handle.
      4. In research-os, create `migrate/research-os-layer` from `main` at
         b997ed6aba4e3395c3b02eef951b3536450b8961 (never from a later main state without first
         re-verifying identity per repositories.identity_verification_required_before_any_implementation_step).
         Fetch the temporary clone's two subtree-split branches as a temporary remote, then
         `git merge --allow-unrelated-histories migration-split-automation` followed by
         `git merge --allow-unrelated-histories migration-split-scripts-automation` (each a distinct,
         ordinary merge commit, not a squash), then `git am` the two root-file patch series, then
         commit the single .gitignore line addition and the new automation/requirements.txt
         (section 3b) as one final, clearly-labeled "Research OS migration: add
         automation/requirements.txt and .gitignore entry" commit.
      5. Delete the temporary clone and its local subtree-split branches; they are disposable
         scaffolding, never pushed anywhere, never referenced again after step 4 completes.
  why_safest_for_this_repository_shape: >
    The 27-commit investigation above confirms the Research OS layer is cleanly confined -- zero
    commits mix migrated and excluded paths -- making `git subtree split` (which mechanically
    includes only commits touching a given prefix) both correct and sufficient, without needing the
    far riskier alternative of a full `git filter-repo` pass over the entire source repository's
    history (which would also touch results/, figures/, scripts/analysis/ commits and require active,
    error-prone path-exclusion filtering across hundreds of unrelated commits). Using a TEMPORARY,
    disposable clone (never the working checkout) for the subtree-split step ensures the working
    checkout at C:\Users\Hesar\Documents\GitHub\wifi-csi-fall-attack-safety-demo is never touched,
    branched, or checked-out-from during the import.
  how_root_files_are_preserved: >
    RESEARCH_DASHBOARD.md and SKILL.md are carried via `git format-patch` + `git am` (step 2/4 above),
    which preserves original author/committer metadata via the mbox format's headers; the single
    .gitignore line is handled as a manual, provenance-recorded content addition (step 3), not a
    file-level patch, for the structural reason given above.
  how_commits_touching_both_migrated_and_excluded_paths_are_filtered: >
    They do not exist -- confirmed by the 27-commit investigation above (a scripted per-commit
    name-only scan found zero commits touching both a migrated path and results/, figures/,
    scripts/analysis/, scripts/archive/, or any checkpoint-pattern path in the same commit). This is
    stated as a VERIFIED FACT about this specific repository's history, not an assumption the
    procedure merely hopes is true; the implementation must re-run this exact check at execution time
    and hard-stop if a newly-created mixed commit is ever found (e.g. if new commits landed between
    this design and implementation).
  how_unrelated_experiment_files_are_proven_absent: >
    Post-import, the implementation must grep the ENTIRE tree of migrate/research-os-layer for
    results/, figures/, checkpoints, scripts/analysis/, scripts/archive/ path prefixes and assert zero
    matches (this is also implementation_validation_suite item 4, section 11) -- proof, not assertion.
  original_source_commit_identities: >
    `git subtree split` rewrites commit SHAs (paths change); the exact original commit hashes remain
    fully reachable in the SOURCE repository forever (nothing there is rewritten or deleted), and the
    migration provenance record (section 8) maps every migrated commit's new research-os SHA back to
    its original wifi-csi-fall-attack-safety-demo SHA -- traceability comes from that record, not from
    identical SHAs across repositories. The record's `migration.source_commit_range` field always
    states the ACTUAL SOURCE_SNAPSHOT_SHA captured and used for that specific migration run (per
    repositories.source_snapshot_policy), never a value copied from this contract's own illustrative
    examples.
  authorship_and_timestamps: >
    `git subtree split`, `git format-patch`, and `git am` all preserve original author name, author
    email, and author/committer timestamps by design; only the NEW merge/commit metadata created
    during import (steps 4-5) carries a new committer identity, clearly distinguishable from the
    preserved original commits it merges in.
  duplicate_import_detection: >
    Before running step 4, the implementation must check whether `migrate/research-os-layer` (or any
    branch reachable from research-os's remote) already contains a commit whose message and diff
    exactly match any commit about to be merged in (a simple `git log --grep` / patch-id comparison
    against the two subtree-split branches) -- if a match is found, the run STOPS rather than
    creating a duplicate merge; this makes a second, accidental invocation of the same migration
    procedure fail safely instead of silently duplicating history.
  rerun_safety: >
    Re-running the entire procedure from scratch (e.g. after a failed or aborted attempt) is safe
    PROVIDED the target's `migrate/research-os-layer` branch (if partially created) is deleted first
    -- the procedure always creates the branch fresh from base_commit and never assumes or reuses a
    prior partial state. If `migrate/research-os-layer` already exists and is NOT empty/fresh, the
    implementation hard-stops and requires an explicit human decision (delete-and-retry, or continue
    from the existing partial branch) rather than silently appending a second import on top.
  duplicate_or_unrelated_history_note: >
    `--allow-unrelated-histories` is required and expected (research-os's `main` and the subtree-split
    branches share no common ancestor) -- this is correct for a first-time cross-repository import,
    not evidence of an error.
  why_no_force_push_or_history_rewrite_is_required: >
    Every step operates on NEW branches only: a temporary, disposable clone's local subtree-split
    branches (never pushed anywhere), and a new `migrate/research-os-layer` branch in research-os
    created from `main` (never `main` itself, and never the source repository's
    `feature/safety-proxy-guided-defense` branch, which is read-only throughout). Nothing already
    pushed to either remote is rewritten, reset, or force-pushed; `migrate/research-os-layer` is
    pushed for the first time as a normal, non-force push of a new branch.

# ------------------------------------------------------------------------------- 6. target branch and cleanliness policy
