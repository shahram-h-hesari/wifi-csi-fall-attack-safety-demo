schema_version: 1
automation: scan-artifacts
stage: 6
gated: false
type: script

purpose: >
  Read-only artifact scanner. Walks results/ figures/ tables/ notes/, classifies each artifact,
  links it to its generating script, and assigns a CONSERVATIVE evidence level. Emits
  automation/artifact_manifest.csv (+ .meta.json) only with --write; dry-run by default.

output:
  manifest: "automation/artifact_manifest.csv"
  sidecar: "automation/artifact_manifest.meta.json"
generator_script: "scripts/automation/scan_artifacts.py"

manifest_columns: [path, kind, sha256, size_bytes, generator_script, link_method,
                   evidence_level, evidence_provenance, split, claim_boundary,
                   overleaf_ready, overleaf_blockers, committed]
evidence_levels: [frozen-test, validation-only, test-descriptive, test-post-hoc, diagnostic-internal]
overleaf_ready_values: [yes, no, candidate]

hard_invariants:
  - "frozen-test assigned ONLY from the frozen-protocol allowlist (a dir with FROZEN_*_TEST_RESULT.md + a protocol twin); never from a filename."
  - "validation detection takes precedence over any 'test'-in-filename signal."
  - "default evidence level is diagnostic-internal."
  - "post-hoc detection reads the ledger result_status column (post_hoc_threshold_sweep_from_saved_scores)."
  - "overleaf_ready=yes requires thesis-safe claim + committed generator + committed artifact + admissible evidence; candidate = only the thesis-claim approval is missing."

design_complete:
  - "This acceptance file approved."
implementation_complete:
  - "scan_artifacts.py: dry-run default; --write; --manifest-out."
  - "update_dashboard.py renders inventory (§8) + Overleaf-ready (§9) from the manifest + a staleness banner line; NO change to verify/approve logic."
test_passed:
  dry_run_no_write: "default run does not create automation/artifact_manifest.csv"
  write_only_manifest: "--write writes only the manifest + .meta.json; no protected path modified"
  idempotency: "two --write runs produce byte-identical manifest CSV"
  no_frozen_from_heuristic: "a fabricated '..._FROZEN_TEST_..._test_...' path is NOT frozen-test"
  val_named_test_is_val: "a validation file with 'test' in the name -> validation-only"
  spot_check_15: "the 15 known artifacts get their expected evidence_level (path preflight first)"
accepted:
  - "User approval receipt exists for DASH-S6."
required_evidence_files:
  - "scripts/automation/test_scan_artifacts.py"
  - "automation/artifact_manifest.csv"
  - "automation/artifact_manifest.meta.json"
forbidden_actions:
  - "write/modify/delete anything under results/, figures/, tables/, notes/, thesis_artifacts/, checkpoints/, .codex/"
  - "write anywhere except the --manifest-out target + its .meta.json"
  - "run experiments; generate a test read; create authorization tokens; git add/commit/push; network"
  - "assign frozen-test without protocol-registry proof"
  - "change Stage 4/5 verification or approval logic"
