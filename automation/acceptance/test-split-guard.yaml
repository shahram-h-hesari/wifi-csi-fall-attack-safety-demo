schema_version: 1
automation: test-split-guard
build_order: 1
gated: false
type: hook   # PreToolUse on Bash (and PowerShell)

# Two phases. Phase A (warn-only) is CURRENT: the hook warns but never blocks. Phase B (blocking)
# is the future upgrade, gated on a warn-only observation window with zero false positives.
current_phase: warn-only

# Accepted warn-only contract (commit dbf658a, 2026-07-10). Supersedes the original exit-0/stdout
# design, which executed correctly but was not visible in the Claude Code Desktop main view.
warn_contract:
  risky_command: "prints ONE WARN-ONLY line to stderr and exits 1"
  exit_1_meaning: "non-blocking under Claude Code hook rules — stderr is shown to the user and the tool call CONTINUES; only exit 2 blocks"
  safe_command: "exits 0 silently (no stdout, no stderr)"
  auditability: "each warning is recorded in the session transcript as a hook_non_blocking_error attachment (durable audit trail even where the UI does not surface it)"
  unchanged: "no blocking, no tokens, no permission-decision output of any kind; normal permission flow untouched"

matcher_script: "scripts/automation/test_split_guard.py"
fixture_test: "scripts/automation/test_split_guard_cases.py"
hook_settings: ".claude/settings.json"   # NEVER settings.local.json

warn_rules:
  - "R1: --split test"
  - "R2: --split legacy"
  - "R3: export_probability_predictions.py invoked (python ...) without --split (default is test)"
  - "R4: adaptive_gate_attack.py invoked (python ...) without --split (default is test)"
allow_examples:
  - "--split val"
  - "reads of already-saved test CSVs (no new test inference)"
  - "dashboard refresh, artifact scan, git, pytest, grep, test_*-named invocations"

# ---------------------------------------------------------------- Phase A: warn-only (CURRENT)
phase_A_warn_only:
  design_complete:
    - "This acceptance file approved; warn rules + allow examples fixed."
  implementation_complete:
    - "Matcher script exists (pure stdlib, Windows-portable, read-only)."
    - "Hook registered in .claude/settings.json (PreToolUse, matcher Bash|PowerShell)."
  test_passed:
    - "Fixture suite (>=14 cases) classifies WARN vs ALLOW correctly."
    - "Warn-only NEVER blocks: risky command prints ONE WARN-ONLY line to stderr and exits 1 (non-blocking per hook rules — only exit 2 blocks; tool call continues); stdout stays empty."
    - "--split val is silent (exit 0, no output on either stream)."
    - "Warning is transcript-auditable: fires as a hook_non_blocking_error attachment in the session transcript."
    - "No false warns on pytest / test_*-named invocations / reading existing test CSVs / dashboard / scan / git."
    - "Static check: matcher writes nothing (no open()/write; guard log disabled this phase) and emits no permission-decision output."
  required_evidence_files:
    - "scripts/automation/test_split_guard.py"
    - "scripts/automation/test_split_guard_cases.py"
  accepted:
    - "User approval receipt (actor.kind: user) exists for AUT-TSG (warn-only)."
  forbidden_actions:
    - "block any command (warn-only never blocks)"
    - "write any guard log (disabled this phase)"
    - "create an authorization token; run a real test export; consume the test set"
    - "edit .claude/settings.local.json; edit Stage 4/5 verify/approve logic"

# ---------------------------------------------------------------- Phase B: blocking (FUTURE)
phase_B_blocking:
  status: not-built
  upgrade_trigger: "warn-only observation window with zero false positives, then explicit user approval"
  test_passed:
    fixture_suite_min: 10
    must_DENY:
      - "--split test"
      - "--split legacy"
      - "export_probability_predictions.py invoked with NO --split flag (default is test)"
      - "adaptive_gate_attack.py invoked with NO --split flag"
      - "any novel script path that generates a *_test_* probability CSV"
    must_ALLOW:
      - "--split val"
      - "reads of already-saved test CSVs (no new test inference)"
      - "one token-authorized frozen command WHEN a matching token + frozen protocol exist (logged)"
  proposed_guard_log: "automation/test_split_guard_log.csv"   # NOT results/ (write-forbidden); enabled only in Phase B
  forbidden_actions:
    - "auto-create authorization tokens (tokens are a human act)"
    - "never write the guard log outside automation/"
