schema_version: 1
automation: val-pilot-gate
build_order: 2
gated: false
type: skill

# Pre-registered GO/NO-GO gate numbers (validation-only, seed42, ε=0.030 primary).
# These are the bar a candidate must clear to justify continued investment. Read from THIS file;
# never typed inline. Reference frontier = best G1 LeNet checkpoint (not the matched selector).
reference_frontier:
  model: "G1 LeNet (best checkpoint)"
  val_pgd_auroc: 0.876
  val_recall_at_far_le_10: 0.477
gate_stage1_continue_if_any:
  - "val PGD-AUROC(P(fall)) >= 0.90"
  - "val recall@FAR<=10% >= 0.60"
gate_note: >
  Clearing stage-1 justifies MORE work on a candidate; it is NOT a promotion to test.
  Promotion to a frozen read is a separate, approval-gated protocol-freeze step.

design_complete:
  - "This acceptance file approved; gate numbers fixed."
implementation_complete:
  - "SKILL.md exists; orchestrates export_probability_predictions.py --split val + analysis."
  - "Appends one row to automation/validation_selection_log.csv per invocation."
test_passed:
  reproduction_test:
    - "Run against a known ledger entry (AFAC_maxscore val rows)."
    - "Reproduce recorded AUROC + recall@FAR{5,10,15,20} to 4 decimals."
    - "Assert substring '_val_' present in EVERY consumed filename."
    - "Confirm a validation_selection_log.csv row was appended."
accepted:
  - "User approval receipt exists for AUT-VPG."
required_evidence_files:
  - "results/<candidate>/val_gate/GATE_REPORT.md"
  - "<diff-vs-ledger reproduction output>"
  - "automation/validation_selection_log.csv"
required_commands:
  - ".venv/Scripts/python.exe scripts/export_probability_predictions.py ... --split val"
  - "analysis scripts on val CSVs; sha256 hashing; git rev-parse HEAD"
forbidden_actions:
  - "any --split test or --split legacy"
  - "typing gate numbers inline (must read from this file)"
  - "reading/plotting any test-split score"
