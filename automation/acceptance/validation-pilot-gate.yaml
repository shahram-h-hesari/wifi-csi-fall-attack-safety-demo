schema_version: 1
automation: validation-pilot-gate-readiness
stage: research-os-4e-design
gated: true    # every future claim over this contract is approval-gated, like every prior registry
type: design_contract   # SPEC ONLY -- no gate code, validator, test, or generated review exists yet

status: DESIGN_ONLY_NOT_IMPLEMENTED

relationship_to_existing_val_pilot_gate: >
  This is a DIFFERENT thing from the existing, still-unimplemented AUT-VPG task
  (automation/acceptance/val-pilot-gate.yaml / automation/designs/VAL_PILOT_GATE_DESIGN.md).
  AUT-VPG is a future SKILL that will actually EXECUTE a validation-split evaluation
  (export_probability_predictions.py --split val + analysis) and compute a numeric AUROC/recall
  gate against fixed thresholds. VALIDATION-PILOT-GATE (this contract) is a READ-ONLY reviewer of
  a WRITTEN PILOT PROPOSAL document -- it never runs code, never touches val or test data, and
  never computes a scientific metric. It sits strictly BEFORE any such execution: a human writes a
  pilot proposal for one selected candidate, this gate reviews the proposal's completeness and
  safety, and only after a READY-FOR-HUMAN-APPROVAL outcome AND separate human approval would a
  later, still-unbuilt step consider invoking something like AUT-VPG. The two are complementary,
  not duplicative, and neither is implemented by this contract.

# ---------------------------------------------------------------------------------- 1. purpose
purpose: >
  Defines the future Validation-Pilot Gate's contract BEFORE any gate code, validator, test, or
  generated review exists. The gate (once implemented) will read a human-authored pilot proposal
  for ONE selected experiment candidate and answer exactly one question:

    "Is this human-selected candidate specified clearly and safely enough to be proposed for a
     validation-only pilot?"

  It must NOT answer:
    - whether the experiment is scientifically guaranteed to succeed
    - whether it is approved to run
    - whether it may enter the experiment queue
    - whether held-out test data may be accessed
    - whether a frozen protocol may be used
    - whether the candidate receives final scientific approval

  This contract makes NO experiment recommendation, defines NO gate implementation, and reviews NO
  real pilot proposal (including no AFAC pilot proposal). It is a contract for a future layer only.

# --------------------------------------------------------------------------- 2. workflow relationship
workflow_relationship:
  intended_flow: >
    Next Experiment Brainstorm Checker (NEXT-EXP-REVIEW)
      -> Dashboard candidate review (DASH-NEXT-EXP-REVIEW)
      -> Human selects ONE REVIEW candidate
      -> Human authors a pilot proposal (schema: section 3)
      -> Validation-Pilot Gate (this contract; future task VALIDATION-PILOT-GATE)
      -> Human approval
      -> Later, separately-approved controlled queue and execution steps (AUT-EQ / protocol-freeze)
  rule: >
    The gate consumes a SEPARATELY DEFINED pilot proposal (section 3), never the raw candidate
    record or its rank/verdict alone. A candidate's `derived_verdict: REVIEW` from
    next_experiment_review.yaml is necessary context but is NEVER treated as sufficient readiness
    by itself -- REVIEW means "worth a human's planning attention," not "pre-cleared for a pilot."
    The gate re-resolves the candidate's current registry state itself (section 9) rather than
    trusting a cached rank/verdict.

# ------------------------------------------------------------------------ 3. pilot proposal schema
pilot_proposal_schema:
  note: >
    This is the schema of the SEPARATE artifact a human writes (the "pilot proposal") that the
    future gate reviews. It is NOT automation/registry/experiment_candidates.yaml, NOT
    automation/reviews/next_experiment_review.yaml, and is not created, generated, or populated by
    this design contract or by any future automated step -- a human authors it.
  fields:
    proposal_id: "stable ID, pattern pilot_<short-slug>_v<n>; unique"
    selected_candidate_id: "must resolve to exactly one automation/registry/experiment_candidates.yaml candidate_id"
    research_question: "one explicit question this pilot would answer"
    hypothesis: "one falsifiable statement, distinct from a restated candidate hypothesis where prior negative evidence applies (see section 8)"
    claimed_material_difference: "if the selected candidate has prior_negative_evidence_refs, an explicit statement of what is materially different in THIS pilot vs that prior work; null otherwise"
    prior_negative_evidence_refs: "list of repository-relative pointers to prior negative evidence relevant to this pilot (mirrors the candidate's own prior_negative_evidence_refs; must not omit any that apply)"
    goal_id: "must resolve in automation/registry/goals.yaml"
    dataset_id: "must resolve in automation/registry/datasets.yaml and be listed as supported for goal_id"
    model_or_method_scope: "short description of the model/method change scope (e.g. 'fine-tune existing AFAC checkpoint with a new loss term'); never a full training script"
    allowed_data_split: "validation_only | training_and_validation (see controlled_vocabularies.allowed_split_for_proposals; requires_new_frozen_protocol / existing_frozen_protocol_only / no_experiment_allowed are NEVER valid proposal values -- a pilot proposal is validation-scope by construction)"
    explicit_prohibition_on_held_out_test_access: "must be present and affirmatively state the pilot will not read, tune on, or compare against the held-out test split"
    pilot_size_and_bounded_scope: "explicit description of scope bounds (e.g. one model variant, one seed set, a stated max number of training runs) -- must describe ONE bounded pilot, never an open-ended program"
    seed_plan: "explicit seed(s) to be used (repository convention: seed 42 only unless a justified plan + a prior seed-42 frozen pass exists, per automation/acceptance/experiment-queue.yaml hard_rules)"
    success_criteria: "explicit, falsifiable condition(s) that would count as a positive pilot signal"
    failure_and_stop_criteria: "explicit condition(s) that would stop the pilot early or count as a negative result"
    metrics_to_inspect: "list of metric names the pilot will look at (e.g. Rfall, FAR, AUROC on validation) -- never a claim of held-out-test metrics"
    permitted_output_paths: "list of repository-relative path prefixes the pilot may write under (must not include results/ paths reserved for frozen-test evidence, must not include automation/registry or automation/experiment_queue.yaml)"
    expected_artifacts: "list of artifact types the pilot would produce (e.g. a validation metrics CSV, a short report) -- described, never pre-generated"
    provenance_requirements: "what provenance the pilot must record (checkpoint hash, seed, commit, script path, split) so a future artifact-manifest entry could be built honestly"
    compute_or_runtime_limits: "an explicit wall-clock or compute cap for the pilot"
    sequential_execution_requirement: "must affirmatively state the pilot runs one model at a time (repository convention; no parallel execution)"
    dependencies: "list of other proposals/tasks this pilot depends on, if any (e.g. an earlier logging-only change); empty list if none"
    unresolved_scientific_questions: "list of open questions the proposal author explicitly flags as unresolved -- required to be present (may be empty list, but the field itself must exist) so the gate can distinguish 'nothing unresolved' from 'author omitted this'"
    required_human_approvals: "list naming which human sign-off(s) are still needed after a READY-FOR-HUMAN-APPROVAL gate outcome (e.g. 'PI review of hypothesis', 'compute budget sign-off')"
    claim_boundaries: "list of what must NOT be inferred from this proposal or a favorable gate outcome (mirrors the claim_boundaries convention in paper_registry.yaml / experiment_candidates.yaml)"
  explicitly_forbidden_in_a_proposal:
    - "any runnable command, script invocation, or CLI string"
    - "any execution authorization or self-declared approval"
    - "any experiment-queue entry or entry_id"
    - "any reference to held-out test data as an allowed read, tuning, or comparison target -- UNCONDITIONALLY forbidden; see held_out_test_policy (section 3b) -- citing a real, already-accepted protocol_id never lifts this"
    - "any frozen-protocol invocation, use, or preparation of any kind within this proposal -- a real, already-accepted protocol_id may be recorded ONLY as contextual/dependency information pointing to a separate, later, human-run stage (protocol-freeze, AUT-PF), never as an operative element of this validation-only pilot"
    - "more than one candidate/experiment proposed in a single proposal (section 7 hard blocker)"

# ------------------------------------------------------------------------------- 3b. held-out-test policy (authoritative)
held_out_test_policy:
  principle: >
    This gate exists SPECIFICALLY to review validation-only pilot proposals. Held-out test data
    has no role inside it whatsoever -- not as a tuning target, not as a comparison target, not as
    a read target, and not as something an accepted protocol makes available.
  rules:
    - "any proposal requesting, implying, comparing on, tuning on, or reading held-out-test data is BLOCKED -- unconditionally, with no exception"
    - "the presence of an existing, already-accepted frozen protocol (automation/frontier.yaml frozen_protocol_registry) does NOT make a validation-pilot proposal READY, does NOT partially satisfy split_safety or protocol_readiness, and does NOT lift the BLOCKED condition above"
    - "a protocol_id may be recorded in a proposal's dependencies field ONLY as contextual/dependency information about a SEPARATE, later, human-run protocol/test-review stage -- it carries no operative meaning inside this gate and triggers no different handling"
    - "this gate never authorizes, prepares, stages, or short-circuits held-out-test use in any way, for any reason, under any gate outcome (READY-FOR-HUMAN-APPROVAL, NEEDS-REVISION, or BLOCKED)"
    - "READY-FOR-HUMAN-APPROVAL is possible ONLY when no held-out-test access is requested anywhere in the proposal -- this is a necessary condition, checked independently of every other dimension"

# ------------------------------------------------------------------------------- 4. controlled vocabularies
controlled_vocabularies:
  allowed_split_for_proposals: [validation_only, training_and_validation]
  gate_outcome: [READY-FOR-HUMAN-APPROVAL, NEEDS-REVISION, BLOCKED]
  gate_dimension_status: [satisfied, unresolved, insufficient, blocked, not_applicable]

# ------------------------------------------------------------------------------- 5. gate dimensions
gate_dimensions:
  principle: >
    The gate must never collapse its assessment into one opaque score. Nine dimensions are
    reported independently, each with a value from gate_dimension_status:
  dimensions:
    - name: scientific_specification
      checks: "research_question and hypothesis are explicit and non-vague; success/failure criteria are stated"
    - name: material_difference
      checks: "see section 9 (derived, mirrors the Brainstorm Checker's own material-difference policy but re-evaluated AT THE PROPOSAL level, never inherited from the candidate record alone)"
    - name: data_readiness
      checks: "goal_id/dataset_id resolve and the dataset supports the goal (datasets.yaml supported_goals)"
    - name: split_safety
      checks: "allowed_data_split is validation_only or training_and_validation; explicit_prohibition_on_held_out_test_access is present and affirmative; no test-split reference anywhere in the proposal"
    - name: protocol_readiness
      checks: "the proposal cites no frozen-protocol requirement as an operative element (a pilot proposal is validation-scope by construction -- any frozen-protocol need routes to a SEPARATE, later protocol-freeze step, never through this gate); if a protocol_id appears at all, it is contextual/dependency information ONLY (see held_out_test_policy, section 3b) and its presence -- accepted or not -- never upgrades this dimension or any gate outcome"
    - name: practical_readiness
      checks: "pilot_size_and_bounded_scope, seed_plan, and sequential_execution_requirement are all explicit and describe ONE bounded pilot"
    - name: resource_boundedness
      checks: "compute_or_runtime_limits is explicit and describes a bounded pilot, not an open-ended program"
    - name: provenance_readiness
      checks: "permitted_output_paths, expected_artifacts, and provenance_requirements are all explicit and consistent with repository write-path conventions"
    - name: human_approval_readiness
      checks: "required_human_approvals and unresolved_scientific_questions are both present (possibly empty lists, but present) and claim_boundaries are non-empty"

# ------------------------------------------------------------------------------- 6. gate outcomes
gate_outcomes:
  READY-FOR-HUMAN-APPROVAL: >
    The pilot proposal is sufficiently specified and validation-safe for a human approval
    decision. This does NOT mean approved to run, approved for queue entry, approved to access
    held-out test data, or approved to use a frozen protocol. Every gate report carrying this
    outcome must include the exact phrase "Suitable for human pilot-approval review only." and a
    statement that this does not authorize execution.
  NEEDS-REVISION: >
    The proposal may remain viable, but required information is incomplete, unclear, or
    unresolved (section 8). The gate names exactly which fields/dimensions need revision; it never
    silently defaults an incomplete proposal to BLOCKED or to READY.
  BLOCKED: >
    A hard policy, evidence, dataset, split, protocol, or safety restriction prevents the proposed
    pilot outright (section 7). BLOCKED always takes precedence over NEEDS-REVISION, which always
    takes precedence over READY-FOR-HUMAN-APPROVAL (same evidence-first precedence pattern already
    used by scripts/automation/next_experiment_brainstorm_checker.py's force_no_go > cap_at_review
    > may_permit_go ordering).
  never_authorizes: >
    No outcome, under any circumstance, authorizes running an experiment, entering
    automation/experiment_queue.yaml, accessing held-out test data, or using a frozen protocol.
    Those remain separate, later, human-gated steps outside this gate's authority entirely.

# ------------------------------------------------------------------------------- 7. hard BLOCKED rules
hard_blocked_rules:
  - "selected_candidate_id does not resolve in automation/registry/experiment_candidates.yaml"
  - "the selected candidate's current derived_verdict (re-resolved from automation/reviews/next_experiment_review.yaml at gate time, never cached) is NO-GO"
  - "dataset_id readiness is unavailable or aspirational_only (re-resolved from goals.yaml/datasets.yaml)"
  - "allowed_data_split (candidate-level, from experiment_candidates.yaml) is no_experiment_allowed"
  - "the proposal requests, implies, describes, compares on, tunes on, or reads held-out-test data in ANY way, for ANY reason -- this BLOCKS unconditionally (see held_out_test_policy, section 3b); citing a real, already-accepted protocol_id from automation/frontier.yaml frozen_protocol_registry NEVER lifts this block inside this gate -- a protocol_id may be recorded only as contextual/dependency information pointing to a separate, later, human-run protocol/test-review stage (protocol-freeze, AUT-PF), which this gate never authorizes, prepares, or short-circuits"
  - "the selected candidate has prior_negative_evidence_refs and the proposal's claimed_material_difference is missing or null (mirrors the Brainstorm Checker's own missing-material-difference -> NO-GO rule, re-applied at the proposal level)"
  - "the proposed work is not bounded as a single pilot (pilot_size_and_bounded_scope describes an open-ended program, a full training campaign, or is absent)"
  - "more than one candidate or experiment is proposed in a single proposal document"
  - "the proposal contains a runnable command, script invocation, CLI string, or any other execution-authorization content"
  - "the proposal contains an experiment-queue entry, entry_id, or any language implying automatic queue promotion"
  - "required provenance/output-path/artifact fields are missing entirely (not merely vague -- see NEEDS-REVISION for vague-but-present)"
  - "any source reference in the proposal (candidate_id, goal_id, dataset_id, paper_id, reference-evidence key, evaluation identity, protocol_id, repository-relative path) is unresolved or stale at gate time"
  - "the proposal requests or implies a mutation of any protected registry, acceptance contract, or automation/experiment_queue.yaml"

# ------------------------------------------------------------------------------- 8. NEEDS-REVISION conditions
needs_revision_conditions:
  - "research_question is present but unclear or not actually answerable by the described pilot"
  - "hypothesis is present but vague (not stated as a falsifiable claim)"
  - "success_criteria is missing or not falsifiable"
  - "failure_and_stop_criteria is missing"
  - "seed_plan is missing (present-but-unbounded is also insufficient -- must name an explicit seed or seed set)"
  - "claimed_material_difference is stated but has not yet received human scientific review (mirrors the Brainstorm Checker's stated_unverified status -- the gate never certifies sufficiency, only flags that human review is still required)"
  - "pilot_size_and_bounded_scope or model_or_method_scope is present but too vague to confirm boundedness"
  - "expected_artifacts or permitted_output_paths is present but incomplete or inconsistent with provenance_requirements"
  - "compute_or_runtime_limits is missing or unbounded"
  - "explicit_prohibition_on_held_out_test_access is present but not unambiguous (e.g. hedged language)"
  - "required_human_approvals or unresolved_scientific_questions is present but appears incomplete given the rest of the proposal"

# ------------------------------------------------------------------------------- 9. READY conditions
ready_conditions:
  all_of:
    - "selected_candidate_id resolves and its re-resolved derived_verdict is NOT NO-GO"
    - "allowed_data_split is validation_only or training_and_validation (proposal-level), and the candidate's own allowed_split is not no_experiment_allowed"
    - "no held-out-test access is requested anywhere in the proposal (necessary condition per held_out_test_policy, section 3b -- checked independently of whether any protocol_id is present or accepted; an accepted protocol's existence never itself contributes to this condition being satisfied)"
    - "dataset_id and every cited reference-evidence/evaluation/paper/gap/protocol identity resolve"
    - "pilot_size_and_bounded_scope, seed_plan, and sequential_execution_requirement are all explicit and describe one bounded, sequential pilot"
    - "success_criteria and failure_and_stop_criteria are both explicit and falsifiable"
    - "provenance_requirements, permitted_output_paths, and expected_artifacts are all complete and consistent"
    - "material-difference requirements are satisfied AT THE PROPOSAL LEVEL: if prior negative evidence applies, claimed_material_difference is present (status stated_unverified is REQUIRED here, not READY by itself -- see note below)"
    - "unresolved_scientific_questions and required_human_approvals fields are present (disclosure, not resolution, is what READY requires)"
    - "no execution authorization, runnable command, or queue-entry content appears anywhere"
    - "no hard_blocked_rules condition fired and no needs_revision_conditions condition fired"
  material_difference_note: >
    READY-FOR-HUMAN-APPROVAL is reachable even when material-difference status is
    stated_unverified, PROVIDED it is disclosed and required_human_approvals explicitly includes a
    human scientific-review step for it. The gate never itself upgrades stated_unverified to
    certified -- READY here means "ready for a human to review, including this open question,"
    never "the difference has been confirmed sufficient."
  exact_wording_required: >
    Every READY-FOR-HUMAN-APPROVAL output must include, verbatim: "Suitable for human
    pilot-approval review only." and an explicit statement that this outcome does not authorize
    execution, queue entry, held-out-test access, or frozen-protocol use.

# ------------------------------------------------------------------------------- 10. source resolution policy
read_only_authoritative_inputs:
  - "automation/registry/experiment_candidates.yaml"     # candidate ground truth (never trust a cached copy)
  - "automation/reviews/next_experiment_review.yaml"     # candidate verdict/rank ground truth (re-resolved, never trusted from the pilot proposal author's memory)
  - "automation/registry/goals.yaml"                     # goal status / allowed_evidence_levels ground truth
  - "automation/registry/datasets.yaml"                  # dataset id / supported_goals ground truth
  - "automation/registry/reference_evidence.yaml"        # reference-evidence identity ground truth
  - "automation/registry/experiment_identity.yaml"       # evaluation identity ground truth
  - "automation/literature/paper_registry.yaml"          # paper_id / literature_gap_id ground truth
  - "automation/frontier.yaml"                           # frozen_protocol_registry / counters ground truth
  - "automation/artifact_manifest.csv"                   # evidence-level authority for any cited artifact
  - "accepted protocol-freeze records when relevant (automation/acceptance/protocol-freeze.yaml and any future golden-master/verify receipts)"
authority_rule: >
  The gate may REFERENCE these sources by stable ID but must NEVER duplicate, copy, re-derive, or
  modify their content -- the same architectural rule already enforced for
  scripts/automation/dashboard_research_summary.py (D3), automation/acceptance/paper-registry.yaml
  (D4a-1), automation/acceptance/experiment-candidates.yaml (REG-CANDIDATES), and
  automation/acceptance/next-experiment-review.yaml (NEXT-EXP-REVIEW).
reference_resolution_requirement: >
  The gate must RE-RESOLVE every reference at review time -- the selected candidate's identity and
  current derived_verdict, every goal/dataset/paper/gap/reference-evidence/evaluation/protocol
  identity cited in the proposal, and every repository-relative path. An unresolved or stale
  required reference is a hard BLOCKED condition (section 7), never silently skipped.
must_not_modify: >
  The gate must not modify automation/registry/experiment_candidates.yaml,
  automation/reviews/next_experiment_review.yaml, automation/literature/paper_registry.yaml,
  automation/frontier.yaml, automation/registry/goals.yaml, automation/registry/datasets.yaml,
  automation/registry/reference_evidence.yaml, automation/registry/experiment_identity.yaml,
  automation/artifact_manifest.csv, any acceptance contract, or any protocol-freeze record.

# ------------------------------------------------------------------------------- 11. safety boundaries
safety_boundaries:
  the_future_gate_must_be_incapable_of:
    - "running shell commands"
    - "importing or invoking subprocess/shell/network execution"
    - "constructing a runnable experiment command"
    - "running training, validation, evaluation, export, or threshold selection"
    - "reading held-out test data"
    - "modifying automation/experiment_queue.yaml"
    - "approving execution of any kind"
    - "modifying any candidate verdict or ranking (automation/registry/experiment_candidates.yaml, automation/reviews/next_experiment_review.yaml)"
    - "modifying any accepted registry or acceptance contract"
    - "using network access"
  remain_read_only_except_for: "its own designated review output file (path TBD at implementation time, analogous to automation/reviews/next_experiment_review.yaml's pattern, e.g. automation/reviews/<proposal_id>_pilot_gate_review.yaml)"

# ------------------------------------------------------------------------------- 12. design deliverable boundary
design_deliverable_boundary:
  this_contract_creates: "only this acceptance/design specification"
  this_contract_does_not_create:
    - "the gate implementation script"
    - "a pilot proposal for AFAC or any other candidate"
    - "any experiment_queue.yaml entry"
    - "any experiment command or execution script"
    - "any protocol-freeze record"
    - "any experiment result"
  future_task_boundaries:
    this_step: "VALIDATION-PILOT-GATE-design -- this design-only contract; registered in automation/tasks.yaml as its own task (kind: design, gated, requires user approval), separate from the future VALIDATION-PILOT-GATE implementation task below. (Earlier design steps in this repo -- REG-CANDIDATES-design, NEXT-EXP-REVIEW-design, AUT-VPG-design, DASH-S8-design -- used an unregistered '-design'-suffixed receipt task_id instead; that was an inferred convention from precedent, not a written schema rule, since automation/tasks.yaml's own header imposes no such restriction and update_dashboard.py's verification ledger already supports both registered and unregistered task_ids. This step registers the design task explicitly, per direct instruction, rather than continuing that convention.)"
    future_implementation: "VALIDATION-PILOT-GATE -- the actual gate implementation (script + validator + tests + generated review schema + pilot-proposal template), registered in automation/tasks.yaml at that time"
    likely_implementation_dependencies: [NEXT-EXP-REVIEW, REG-CANDIDATES, REG-PAPERS, REG-GOALS, REG-DATASETS, REF-EVID, REG-EXPERIMENT-ID]
    separate_downstream_systems_not_affected_by_this_layer:
      - "AUT-VPG (existing val-pilot-gate design, still unimplemented) -- a later, separate, EXECUTING skill; this gate never invokes it and never implies it is authorized"
      - "protocol-freeze (AUT-PF) -- the sole path to a new frozen-test read; remains separate and human-run"
      - "automation/experiment_queue.yaml / AUT-EQ -- the sole path to execution; a gate outcome never writes here"
      - "dashboard rendering (DASH-D3, DASH-NEXT-EXP-REVIEW) -- no gate-review section is added to RESEARCH_DASHBOARD.md by this contract; that remains a separate, later, explicitly-approved task"

# ------------------------------------------------------------------------------------------ acceptance criteria
design_complete:
  - "This acceptance file approved by the user."
implementation_complete:
  - "NOT YET -- no gate implementation script exists."
  - "NOT YET -- no gate validator exists."
  - "NOT YET -- no gate test suite exists."
  - "NOT YET -- no pilot-proposal template or generated gate-review output exists."
test_passed:
  not_applicable: "no implementation exists yet to test"
accepted:
  - "User approval receipt (actor.kind: user) exists for this design step, using whatever task_id the user designates (e.g. VALIDATION-PILOT-GATE-design, following the REG-CANDIDATES-design/NEXT-EXP-REVIEW-design/AUT-VPG-design/DASH-S8-design precedent)."

forbidden_actions:
  - "create the gate implementation, validator, or tests in this step"
  - "author or generate a pilot proposal for AFAC or any other candidate in this step"
  - "create any experiment_queue.yaml entry"
  - "create any experiment command, execution script, or protocol-freeze record"
  - "generate any experiment result"
  - "modify automation/registry/experiment_candidates.yaml or automation/reviews/next_experiment_review.yaml"
  - "modify any other read-only authoritative input listed in section 10"
  - "register a task in automation/tasks.yaml in this step"
  - "let any future gate outcome authorize execution, queue entry, held-out-test access, or frozen-protocol use"
  - "stage, commit, or push"
