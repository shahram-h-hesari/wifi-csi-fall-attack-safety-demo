# Experiment queue. SOURCE-OF-TRUTH for enqueued pilots. You add entries; the experiment-queue
# skill updates only run-state via receipts (never edits definitions). Every entry MUST reference
# a pre-written pilot config (hypothesis + gates + epsilon + seed) BEFORE it can run — this
# preserves pre-registration at pilot level and protects the 44-fall validation split.
schema_version: 1

# Rules enforced by convention now, by test-split-guard + experiment-queue later:
#   - seed: 42 only (43-46 require a justified plan + a seed-42 frozen pass first)
#   - split: val only for gating; test only via an authorized frozen protocol
#   - sequential execution only (one model at a time)
#   - no auto-enqueue: entries are added by you

entries: []   # empty until val-pilot-gate + test-split-guard exist (queue opens Day 6)

