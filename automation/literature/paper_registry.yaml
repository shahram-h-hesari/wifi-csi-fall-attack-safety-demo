# Academic Paper Registry — SOURCE-OF-TRUTH (Research OS layer, D4a-1).
# Policy document: automation/literature/README.md (read that first).
# LOCAL CITED SOURCES ONLY: every record below was backfilled read-only from the thesis
# repository's references.bib and the D1--D12 literature-framing appendix
# (appendices/internal_defense_experiment_ledger.md). NO external lookup (web, Crossref,
# Semantic Scholar) was performed -- bibliographic fields are copied verbatim from the local
# bibliography and are pending external verification (D4a-2, separate step). Nothing here is
# invented: a missing field stays null; a locally conflicting field is recorded as a conflict;
# a direction with no locally cited paper is a literature_gaps entry, never a fabricated record.
# paper_contribution_summary paraphrases what the LOCAL framing text says the paper reports;
# relevance_to_current_results is OUR Research-OS interpretation and is never a paper's claim.
schema_version: 1

registry_scope:
  source_policy: local_cited_sources_only
  external_metadata_verification: pending
  clinical_claims_allowed: false
  allowed_repositories: [research_os, thesis_overleaf]
  note: >
    thesis_overleaf = C-drive-local clone of the Overleaf-linked proposal repository (read-only
    source; path aliases below are relative to that repository's root, never absolute).
    research_os = this repository. Internal labels (AFAC, BASAT, H15, D1..D14, G1, A1) are
    experiment/ledger identities, NOT papers, and must never appear as paper titles or IDs.

