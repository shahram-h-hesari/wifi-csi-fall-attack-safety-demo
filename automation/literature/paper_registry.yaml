# ------------------------------------------------------------------- literature gaps (honest)
# Directions the Research OS currently tracks that have NO locally cited supporting paper (or
# whose local anchors are in the wrong modality). A gap is first-class information: it must be
# closed by finding/citing a real publication (D4a-2+), never by inventing a record here.
literature_gaps:
  - gap_id: gap_ut_har_source_publication
    direction: dataset_provenance
    current_status: not_locally_cited
    reason: >
      UT-HAR is used throughout the experiments, but no UT-HAR-origin dataset publication is
      separately cited in the local bibliography; local coverage is only through the SenseFi
      benchmark-library paper.
    required_future_action: >
      D4a-2: locate the authoritative UT-HAR dataset publication, verify metadata externally, and
      add it as a cited record (also cite it in the thesis where the dataset is introduced).

  - gap_id: gap_probability_calibration_low_far
    direction: low_far_afac_calibration
    current_status: partially_supported_locally
    reason: >
      The AFAC low-FAR calibration direction currently leans on ROC/Neyman-Pearson/partial-AUC
      operating-point anchors (fawcett2006roc, tong2013pluginnp, tong2018np,
      narasimhan2013partialauc); no dedicated post-hoc probability-calibration publication
      (e.g., modern neural-network calibration literature) is locally cited.
    required_future_action: >
      D4a-2+: identify and cite a real probability-calibration publication before any
      calibration-based experiment candidate claims literature support.

  - gap_id: gap_wifi_csi_temporal_false_alarm_reduction
    direction: temporal_false_alarm_reduction
    current_status: wrong_modality_anchors_only
    reason: >
      The locally cited false-alarm-reduction anchors (abbate2011false_alarms,
      kangas2014fall_sensor) are wearable/accelerometer-domain; no WiFi-CSI-specific temporal or
      event-level false-alarm-reduction publication is locally cited.
    required_future_action: >
      D4a-2+: find and cite WiFi-CSI (or at least RF-sensing) temporal/event-level false-alarm
      reduction work before treating this direction as literature-backed for CSI.

  - gap_id: gap_walking_pattern_labeled_csi_dataset
    direction: walking_pattern_recognition
    current_status: not_locally_cited
    reason: >
      goals.yaml marks walking_pattern_recognition as NO_DATA; no gait-pattern-labeled CSI dataset
      publication is locally cited that could support fine-grained walking-pattern recognition.
    required_future_action: >
      D4a-2+: locate a gait-pattern-labeled CSI dataset publication (or record that none exists)
      before this goal can leave NO_DATA status.

  - gap_id: gap_longitudinal_csi_fall_risk_cohort
    direction: gait_or_fall_risk_data_acquisition
    current_status: wrong_modality_anchors_only
    reason: >
      All locally cited prognostic fall-risk anchors use wearable, PIR/in-home-sensor, wrist, or
      other non-CSI modalities (verghese2009quantitative, hausdorff2001gait, piau2019when,
      vanschooten2016daily, chan2023prediction, beattie2020cart); no longitudinal WiFi-CSI
      fall-risk cohort publication is locally cited.
    required_future_action: >
      D4a-2+: search for longitudinal WiFi-CSI fall-risk cohort work; if none exists, this remains
      a data-acquisition gap (consistent with goals.yaml NO_DATA_ASPIRATIONAL), never a claim.
