# Dataset Capability Registry — SOURCE-OF-TRUTH for what each dataset can and cannot support
# (Research OS layer, Commit D1). The supported_goals/unsupported_goals split is an integrity gate:
# Result Explorer (D2, future) must refuse any (goal, dataset) pair marked unsupported, preventing
# plausible-looking but meaningless numbers. Missing capability is first-class information.
schema_version: 1

datasets:
  - id: sensefi_ut_har
    family: SenseFi
    name: UT-HAR
    signal_type: wifi_csi_amplitude
    classes: ["lie down", "fall", "walk", "pickup", "run", "sit down", "stand up"]   # indices 0..6
    label_map:
      # Verified read-only from the repo's own analysis scripts (identical in all four):
      #   scripts/analyze_safety_guided_seed.py:39, scripts/analyze_variantE.py:35,
      #   scripts/analyze_variantF.py:32, scripts/analysis/h15_e0_hard_window_inventory.py:127
      0: "lie down"
      1: "fall"
      2: "walk"
      3: "pickup"
      4: "run"
      5: "sit down"
      6: "stand up"
      fall_class_index: 1
      walk_class_index: 2
      source: "scripts/analyze_safety_guided_seed.py:39 (cross-checked against 3 sibling scripts; see registry README)"
    supported_goals: [fall_detection, walking_detection]
    unsupported_goals: [walking_pattern_recognition, gait_or_mobility_change_detection, future_fall_risk_prediction]
    split_policy: >
      Frozen held-out test split: protocol-gated, one-shot reads only (registry:
      automation/frontier.yaml frozen_protocol_registry; guarded by test-split-guard warn-only hook).
      Validation split: candidate selection only (val-pilot-gate design memo governs promotion).
      Never derive a threshold on test.
    known_limitations:
      - "single environment / lab-collected (acted activities, not real-world falls)"
      - "digital white-box adversarial perturbations only (no over-the-air attacks)"
      - "seed-42 LeNet family is the primary evaluated line"
      - "window-level evaluation (no event-level aggregation)"
      - "no gait-pattern, longitudinal, or clinical-outcome labels"
    exists_locally: true
    local_data_status: PRESENT_LOCAL
    local_paths_known: true   # resolved through the training scripts' shared UT-HAR loader; deliberately not hardcoded here
    supported_attack_families: [fgsm, pgd]   # canonical values of the ledger 'attack' column
    supported_defense_families:
      # families as used in ledger 'approach_group'; see defense_attempt_results_long.csv for canonical values
      - undefended
      - adversarial_training      # fgsm_at / pgd_at
      - safety_guided             # variants E-H, optionA/B, G1
      - basat                     # trades / gairat / sat lines
      - afac
      - representation_pivots     # bilstm / gru / resnet / transformer cross-architecture
    recommended_first_query:
      goal: fall_detection
      attack: pgd
      epsilon: 0.030
      split: val          # validation-first bias; test/frozen evidence only via goals.yaml reference_evidence_queries
      defense: any
