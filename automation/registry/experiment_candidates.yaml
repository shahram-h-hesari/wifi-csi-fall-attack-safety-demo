        identity: "automation/registry/datasets.yaml"
        relationship: direct
        note: "sensefi_ut_har.supported_goals includes walking_detection; label_map documents walk_class_index: 2"
    current_evidence_summary: >
      The dataset registry confirms UT-HAR supports walking_detection and documents the walk class
      index; the goal registry confirms no evaluated result yet exists for this goal.
    prior_negative_evidence_refs: []
    our_rationale: >
      OUR INTERPRETATION: this is the most immediately reachable new-goal baseline given already
