      evaluated baseline results (automation/registry/goals.yaml status DATA_AVAILABLE_NOT_EVALUATED,
      primary_metric_keys walking_recall/precision/F1 all currently unpopulated).
    direction_tags: [walking_detection_baseline]
    literature_support:
