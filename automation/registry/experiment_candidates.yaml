      of walking-related sensing from WiFi signals -- but none of them evaluate UT-HAR's specific
      walk-vs-rest binary task, so this remains an untried baseline, not a replicated result.
    required_dataset_ids: [sensefi_ut_har]
    target_goal_ids: [walking_detection]
    dataset_readiness: available_not_evaluated
    allowed_split: validation_only
    frozen_protocol_requirement: null
    test_read_risk: none
    other_risks:
      - "any pilot must respect the seed-42-only and sequential-execution constraints in automation/acceptance/experiment-queue.yaml hard_rules"
    evidence_strength: local_supported_literature_indirect
    status: proposed
    claim_boundaries:
      - "a walking-detection baseline is not evidence of fall-risk prediction"
      - "it is a baseline/mobility-track candidate, not a gait-pathology or mobility-decline claim"
      - "this record is not a GO/REVIEW/NO-GO verdict and does not authorize any experiment"
