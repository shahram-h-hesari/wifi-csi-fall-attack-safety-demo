# Experiment Identity Registry (D2e-1) — SOURCE-OF-TRUTH.
# Policy document: automation/registry/experiment_identity.md (read that first).
# Read-only reference layer: does NOT rename any historical file, directory, receipt, protocol ID,
# or reference-evidence key. Not yet consumed by scripts/automation/result_explorer.py (future,
# separate integration step). Every "verified" field below was independently confirmed during this
# audit (2026-07-10) via repository text citation or direct file hashing -- never inferred from
# naming patterns, chronology, or plausibility.
schema_version: 1

naming_policy:
  id_charset: "snake_case, lowercase, repository-safe, no spaces"
  run_id_pattern: "run_<goal>_<dataset>_<method>_<verified-disambiguator>_v<version>"
  evaluation_id_pattern: "eval_<goal>_<dataset>_<method>_<attack>_eps<epsilon-token>_<evidence-token>_v<version>"
  epsilon_tokens:      # decimal value -> token; point becomes 'p', trailing zeros preserved
    0.015: eps0p015
    0.03: eps0p030
  evidence_tokens:     # goals.yaml/manifest evidence_level -> id token (hyphen -> underscore)
    frozen-test: frozen_test
    test-post-hoc: test_posthoc
    validation-only: validation_only
    test-descriptive: test_descriptive
    diagnostic-internal: diagnostic_internal

# ---------------------------------------------------------------------------------------- runs
runs:
  - run_id: run_fall_detection_sensefi_ut_har_afac_optionb_seed42_maxscore_v1
    display_name: "AFAC optionB seed-42 (maxscore-selected) checkpoint"
    goal: fall_detection
    dataset_family: SenseFi
    dataset: sensefi_ut_har
    method_family: AFAC
    method_variant: optionB_AFAC
    seed: 42
    protocol_id: null   # protocol binding belongs to the EVALUATION (see H15 evaluation below), not the run
    checkpoint_or_artifact: "checkpoints/safety_guided_defense/variantH_dual_tail_budget/adaptive_lagrangian_far_constrained/optionB/seed42/seed42_optionB_maxscore_best.pt"
    checkpoint_sha256: "b85c68a7f4834c514a06d737af167542c9139bed45dde8a40380eac78cab1146"
    identity_status: verified
    provenance:
      training_metadata: "results/safety_guided_defense/variantH_dual_tail_budget/adaptive_lagrangian_far_constrained/optionB/seed42/metadata/seed42_optionB_metadata.json"
      selection_rule: "maxscore (validation-only selection; training metadata 'selection' field)"
      checkpoint_hash_verification: >
        Checkpoint SHA256 documented in results/defense_attempt_inventory/H15_FROZEN_TEST_DECISION_MEMO.md
        (line ~141) and results/defense_attempt_inventory/pgd_epsilon_frontier/FROZEN_H15_TEST_PROTOCOL_EPS0015_AFAC.md;
        INDEPENDENTLY RE-VERIFIED during this D2e-1 audit (2026-07-10) by directly hashing the
        checkpoint file on disk -- exact match, proving this is the same trained checkpoint used by
        BOTH evaluations below (a genuinely shared run, not an assumption).
    legacy_aliases: []   # no bare historical letter-code names the RUN itself; codes below attach to evaluations

# ------------------------------------------------------------------------------------ evaluations
evaluations:
  - evaluation_id: eval_fall_detection_sensefi_ut_har_afac_pgd_eps0p015_frozen_test_v1
    display_name: "AFAC frozen-test evaluation under PGD epsilon=0.015"
    run_id: run_fall_detection_sensefi_ut_har_afac_optionb_seed42_maxscore_v1
    run_link_status: verified
    reference_evidence_key: H15_eps0015_frozen
    goal: fall_detection
    dataset_family: SenseFi
    dataset: sensefi_ut_har
    method_family: AFAC
    method_variant: optionB_AFAC
    attack: pgd
    epsilon: 0.015
    split: test
    evidence_level: frozen-test
    threshold_policy: pre_registered_frozen_threshold
    protocol_id: "H15-TEST-EPS0015-AFAC-20260705"
    identity_status: verified
    provenance:
      confusion_csv: "results/defense_attempt_inventory/pgd_epsilon_frontier/frozen_test_read/frozen_h15_test_confusion.csv"
      result_report: "results/defense_attempt_inventory/pgd_epsilon_frontier/frozen_test_read/FROZEN_H15_TEST_RESULT.md"
      decision_memo: "results/defense_attempt_inventory/H15_FROZEN_TEST_DECISION_MEMO.md"
      matches_reference_evidence_entry: "automation/registry/reference_evidence.yaml key H15_eps0015_frozen (field-for-field: TP/FN/FP/TN, Rfall, FAR, threshold, protocol_id all identical)"
    legacy_aliases:
      - value: H15
        alias_type: historical_milestone_label
        meaning: null
        meaning_status: unverified
        source_paths:
          - "results/defense_attempt_inventory/H15_PHASED_EXPERIMENT_ROADMAP.md"
          - "results/defense_attempt_inventory/pgd_epsilon_frontier/frozen_test_read/FROZEN_H15_TEST_RESULT.md"
        note: >
          Used throughout the repo as a target/milestone label (defined operationally as
          "recall > 0.85 AND FAR < 0.15", see H15_PHASED_EXPERIMENT_ROADMAP.md line ~9-10) and, by
          extension, the frozen-test protocol event that evaluated a checkpoint against that target.
          The letter "H" has NO authoritative expansion anywhere in the repository -- searched
          exhaustively (Part 1 audit, 2026-07-10). Historical internal label; expansion not asserted.

  - evaluation_id: eval_fall_detection_sensefi_ut_har_afac_pgd_eps0p030_test_posthoc_v1
    display_name: "AFAC post-hoc F20 operating point under PGD epsilon=0.030"
    run_id: run_fall_detection_sensefi_ut_har_afac_optionb_seed42_maxscore_v1
    run_link_status: verified
    reference_evidence_key: AFAC_eps0030_F20_posthoc
    goal: fall_detection
    dataset_family: SenseFi
    dataset: sensefi_ut_har
    method_family: AFAC
    method_variant: optionB_AFAC
    attack: pgd
    epsilon: 0.03
    split: test
    evidence_level: test-post-hoc
    threshold_policy: post_hoc_f20_operating_point
    protocol_id: null
    identity_status: verified
    provenance:
      source_file: "results/safety_guided_defense/variantH_dual_tail_budget/adaptive_lagrangian_far_constrained/optionB/seed42/test_eval/optionB_maxscore_pgd_probabilities_test_epsilon_0_03.csv"
      d8b_definition_source: "scripts/analysis/plot_d1_d12_recall_far.py (Target(\"D8b\", \"AFAC-score post-hoc FAR<=0.20\", ...) entry)"
      matches_reference_evidence_entry: "automation/registry/reference_evidence.yaml key AFAC_eps0030_F20_posthoc (field-for-field: TP/FN/FP/TN, Rfall, FAR, threshold all identical)"
      run_link_evidence: >
        Same checkpoint (seed42_optionB_maxscore_best.pt) as the H15 evaluation above -- see that
        run record's checkpoint_hash_verification note. Same run, different epsilon/evidence_level.
    legacy_aliases:
      - value: D8b
        alias_type: historical_appendix_target_label
        meaning: "AFAC-score post-hoc FAR<=0.20 operating point -- one specific Target() entry in the D1-D12 appendix recall/FAR frontier plot script"
        meaning_status: verified
        source_paths:
          - "scripts/analysis/plot_d1_d12_recall_far.py"
        note: >
          Verified field-for-field match against the D8b Target() entry (TP 36/FN 9/FP 91/TN 364,
          Rfall 0.80, FAR 91/455, threshold~0.1532, identical source_file). This is a positive
          identity match, not an inference from proximity.
      - value: D8
        alias_type: historical_family_label
        meaning: null
        meaning_status: unverified
        source_paths:
          - "scripts/analysis/plot_d1_d12_recall_far.py"
          - "results/defense_attempt_inventory/H15_PHASED_EXPERIMENT_ROADMAP.md"
        note: >
          Refers to the broader D8a (x3 fixed/argmax sub-variants) + D8b (post-hoc sweep) appendix
          family, not uniquely to this evaluation. Deliberately recorded SEPARATELY from D8b above,
          per the rule that bare "D8" must not be asserted as equivalent to one specific evaluation
          merely because it belongs to that broader family.

