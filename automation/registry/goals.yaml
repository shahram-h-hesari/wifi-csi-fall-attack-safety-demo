# Goal Registry — SOURCE-OF-TRUTH for WiFi-sensing research goals (Research OS layer, Commit D1).
# Rules: missing data is FIRST-CLASS information, never a failure. No clinical claims. No goal may
# claim results unless it can point to verified result evidence (ledger/manifest). Result Explorer
# (D2, future) must refuse metrics outside primary_metric_keys and evidence outside
# allowed_evidence_levels. default_query_fields bias exploration to VALIDATION; known test/frozen
# evidence is preserved only as explicit reference_evidence_queries.
schema_version: 1

goals:
  - id: fall_detection
    display_name: "Fall Detection"
    aliases: ["fall", "fall-detection", "fall_vs_rest", "faller"]
    task_type: binary_safety_critical_detection
    status: ACTIVE_THESIS_PRIMARY
    metrics: ["fall recall (Rfall)", "false-alarm rate (FAR)", "AUROC", "recall at FAR budgets", "confusion counts"]
    primary_metric_keys: [Rfall, FAR, AUROC, Rfall_at_FAR_005, Rfall_at_FAR_010, Rfall_at_FAR_015, Rfall_at_FAR_020, TP, FN, FP, TN]  # exact ledger columns (defense_attempt_results_long.csv)
    success_targets:
      R90F10:
        rule: "Rfall > 0.90 AND FAR < 0.10 @ PGD eps=0.030"
        status: not_met
        evidence_level: none
      F20:
        rule: "Rfall >= 0.80 AND FAR <= 0.20 @ PGD eps=0.030"
        status: post_hoc_only
        evidence_level: test-post-hoc
      H15_eps015:
        rule: "Rfall > 0.85 AND FAR < 0.15 @ PGD eps=0.015"
        status: pass
        evidence_level: frozen-test
    datasets_available: ["sensefi_ut_har"]
    data_needs: ["real fall corpus (non-acted)", "clinical validation cohort", "multi-environment CSI"]
    evidence_rules: >
      Milestone claims resolve against automation/frontier.yaml; frozen evidence only via the
      frozen-protocol registry (currently H15-TEST-EPS0015-AFAC-20260705); validation evidence
      is selection-only, never a thesis result; post-hoc test analysis is descriptive only.
    allowed_evidence_levels: [frozen-test, validation-only, test-descriptive, test-post-hoc, diagnostic-internal]
    default_query_fields: { attack: pgd, epsilon: 0.030, split: val, defense: any }   # validation-first by design
    reference_evidence_queries:   # explicit, read-only lookups of KNOWN existing evidence (not defaults)
      H15_eps0015_frozen:
        split: test
        evidence_level: frozen-test
        attack: pgd
        epsilon: 0.015
        protocol_id: "H15-TEST-EPS0015-AFAC-20260705"
      AFAC_eps0030_F20_posthoc:
        split: test
        evidence_level: test-post-hoc
        attack: pgd
        epsilon: 0.030
    grant_relevance: "core thesis; adversarial-safety angle; foundation for mobility/aging-in-place narrative"
    clinical_caution: HIGH
    clinical_claim_boundary:
      permitted:
        - "software-level FGSM/PGD adversarial stress test"
        - "defended-vs-undefended descriptive comparison"
        - "H15@eps=0.015 frozen PASS (with mandatory disclosures)"
      forbidden:
        - "any certified / clinical / deployment / OTA claim"
        - "R90F10 @ eps=0.030 (unmet)"
        - "cross-dataset generalization"

  - id: walking_detection
    display_name: "Walking Detection"
    aliases: ["walk", "walking", "ambulation", "walk_vs_rest"]
    task_type: binary_activity_detection
    status: DATA_AVAILABLE_NOT_EVALUATED   # UT-HAR has a walk class (index 2); no evaluation run yet
    metrics: ["walking recall", "precision", "F1", "accuracy", "macro F1"]
    primary_metric_keys: [walking_recall, precision, F1, accuracy, macro_F1]   # walking_recall has NO ledger column yet -> explorer must report "defined, not evaluated"
    success_targets: null   # none pre-registered; set only via a future user-approved spec
    datasets_available: ["sensefi_ut_har"]
    data_needs: []   # baseline reachable from existing local data; evaluation itself not yet authorized
    evidence_rules: >
      No result may be claimed until a verified ledger/manifest row exists for this goal. No frozen
      protocol exists; frozen-test evidence is therefore impossible and not an allowed level.
    allowed_evidence_levels: [validation-only, test-descriptive, diagnostic-internal]
    default_query_fields: { attack: none, epsilon: null, split: val, defense: none }
    grant_relevance: "mobility / grant-readiness track — nearest reachable non-fall goal from existing UT-HAR data"
    clinical_caution: MEDIUM
    clinical_claim_boundary:
      permitted: ["activity-recognition descriptive results"]
      forbidden: ["gait pathology or diagnostic claim", "mobility-decline claim"]

  - id: walking_pattern_recognition
    display_name: "Walking Pattern Recognition"
    aliases: ["gait_pattern", "walking_patterns", "gait recognition"]
    task_type: fine_grained_multiclass_recognition
    status: NO_DATA   # UT-HAR has a single walk class; no gait-pattern labels exist locally
    metrics: ["per-pattern recall", "macro F1", "confusion structure"]
    primary_metric_keys: [per_pattern_recall, macro_F1]   # declared, unpopulated
    success_targets: null
    datasets_available: []
    data_needs: ["gait-pattern-labelled CSI dataset (multiple walking styles/speeds per subject)"]
    evidence_rules: "No supporting dataset exists locally; any claimed result is invalid by construction."
    allowed_evidence_levels: [diagnostic-internal]
    default_query_fields: { attack: none, epsilon: null, split: null, defense: none }
    grant_relevance: "high for mobility grants; blocked on data acquisition (first-class data need)"
    clinical_caution: HIGH
    clinical_claim_boundary:
      permitted: []
      forbidden: ["any gait-pathology inference", "any clinical claim"]

  - id: gait_or_mobility_change_detection
    display_name: "Gait / Mobility Change Detection"
    aliases: ["mobility_change", "gait_change", "mobility decline detection"]
    task_type: longitudinal_change_detection
    status: NO_DATA
    metrics: ["change sensitivity", "change specificity", "detection latency", "drift score"]
    primary_metric_keys: [change_sensitivity, change_specificity]   # declared, unpopulated
    success_targets: null
    datasets_available: []
    data_needs: ["longitudinal per-subject CSI (weeks-months)", "ground-truth mobility assessments (e.g. TUG/gait speed)"]
    evidence_rules: "No supporting dataset exists locally; any claimed result is invalid by construction."
    allowed_evidence_levels: [diagnostic-internal]
    default_query_fields: { attack: none, epsilon: null, split: null, defense: none }
    grant_relevance: "very high (aging-in-place, falls-prevention funding); blocked on longitudinal data"
    clinical_caution: HIGH
    clinical_claim_boundary:
      permitted: []
      forbidden: ["mobility-decline diagnosis", "any clinical monitoring claim"]

  - id: future_fall_risk_prediction
    display_name: "Future Fall-Risk Prediction"
    aliases: ["fall_risk", "fall risk prediction", "prognostic fall risk"]
    task_type: prognostic_prediction
    status: NO_DATA_ASPIRATIONAL
    metrics: ["risk AUROC", "calibration (Brier/ECE)", "time-to-event discrimination"]
    primary_metric_keys: [risk_AUROC, brier, ece]   # declared, unpopulated
    success_targets: null
    datasets_available: []
    data_needs: ["prospective cohort with adjudicated fall outcomes", "IRB-approved longitudinal sensing"]
    evidence_rules: "No supporting dataset exists locally; any claimed result is invalid by construction."
    allowed_evidence_levels: []   # nothing may render as evidence for this goal
    default_query_fields: { attack: none, epsilon: null, split: null, defense: none }
    grant_relevance: "flagship long-term grant narrative; explicitly aspirational until cohort data exists"
    clinical_caution: MAX
    clinical_claim_boundary:
      permitted: []
      forbidden: ["any prognostic clinical claim", "any risk-score claim", "any deployment claim"]
