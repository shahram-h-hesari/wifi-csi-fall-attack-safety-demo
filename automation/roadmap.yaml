# Versioned 7-day plans. SOURCE-OF-TRUTH. Pivots never delete: add a new plan with
# `supersedes:` and record why in dashboard_changelog.md. Status is NOT stored here.
schema_version: 1

plans:
  - plan_id: roadmap-2026-07-09-v1
    created: 2026-07-09
    supersedes: null
    rationale: >
      Initial interleaved plan. Dashboard Stage 1+2 lands first (half day), then automation
      #1 test-split-guard (build-first / safety precondition), then val-pilot-gate. Dashboard
      Stage 3-4 land before experiment-queue goes live, because overnight autonomous runs are
      exactly when evidence-gated receipts matter most.
    days:
      - day: 1
        date: 2026-07-09
        primary: "Dashboard Stage 1+2 (RESEARCH_DASHBOARD.md + automation/ YAML SoT + conventions)"
        secondary: "Scaffold test-split-guard acceptance fixtures"
        task_ids: [DASH-S1, DASH-S2]
      - day: 2
        date: 2026-07-10
        primary: "Build + fixture-test test-split-guard (PreToolUse hook)"
        secondary: "Design note for dashboard Stage 3 render phase"
        task_ids: [AUT-TSG]
      - day: 3
        date: 2026-07-11
        primary: "Build val-pilot-gate (reproduction test vs AFAC_maxscore val ledger rows)"
        secondary: null
        task_ids: [AUT-VPG]
      - day: 4
        date: 2026-07-12
        primary: "Dashboard Stage 3: update_dashboard.py (render phase only)"
        secondary: "Design note for ledger-sync --audit"
        task_ids: [DASH-S3]
      - day: 5
        date: 2026-07-13
        primary: "Build ledger-sync + --audit (round-trip test)"
        secondary: "Start dashboard Stage 4 (receipts + verify)"
        task_ids: [AUT-LSA, DASH-S4]
      - day: 6
        date: 2026-07-14
        primary: "Build experiment-queue (2-entry dummy, crash-isolation test)"
        secondary: null
        task_ids: [AUT-EQ]
      - day: 7
        date: 2026-07-15
        primary: "Build protocol-freeze (H15 golden-master); /dashboard-refresh skill"
        secondary: "Extend git-stage-check; write automation usage notes"
        task_ids: [AUT-PF, DASH-S5, AUT-GSC-EXT]

# Future stages beyond the current 7-day horizon. Not dated; picked up only after their
# dependencies are stable. Kept here so the plan history and build order stay in one place.
future_stages:
  - task_id: DASH-S8
    title: "Stage 8 — static HTML dashboard view (dashboard/index.html)"
    depends_on: [DASH-S4, DASH-S6]   # needs stable status.json + artifact_manifest.csv
    rationale: >
      Pure presentation of already-verified state. Has no value before status.json (Stage 4)
      and artifact_manifest.csv (Stage 6) exist and are stable; building it earlier risks
      encoding a schema that then changes and displaying CLAIMED optimism as fact. Peer to the
      Stage 7 Notion push — a downstream view, never source-of-truth, never hand-edited,
      generated only after a fresh verify+render.
    acceptance: acceptance/html-dashboard.yaml
