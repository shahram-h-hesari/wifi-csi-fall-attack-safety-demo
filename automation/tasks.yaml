# Task registry. SOURCE-OF-TRUTH for task DEFINITIONS ONLY.
# Deliberately NO status field: status is computed from receipts + acceptance at Stage 4+.
# Until then, the dashboard holds hand-assessed CLAIMED status.
schema_version: 1

tasks:
  # --- Dashboard build (meta) ---
  - id: DASH-S1
    title: "Dashboard Stage 1 — hand-maintained RESEARCH_DASHBOARD.md"
    kind: dashboard
    automation: dashboard
    gated: false
    acceptance: null
    stale_after_days: 3
  - id: DASH-S2
    title: "Dashboard Stage 2 — automation/ YAML source-of-truth + acceptance/receipt conventions"
    kind: dashboard
    automation: dashboard
    gated: false
    acceptance: null
    stale_after_days: 3
  - id: DASH-S3
    title: "Dashboard Stage 3 — update_dashboard.py (render phase only)"
    kind: dashboard
    automation: dashboard
    gated: false
    acceptance: acceptance/dashboard-refresh.yaml
    stale_after_days: 5
  - id: DASH-S4
    title: "Dashboard Stage 4 — receipts + verify phase (three-fixture test)"
    kind: dashboard
    automation: dashboard-refresh
    gated: false
    acceptance: acceptance/dashboard-refresh.yaml
    stale_after_days: 5
  - id: DASH-S5
    title: "Dashboard Stage 5 — /dashboard-refresh skill (+ --approve path)"
    kind: dashboard
    automation: dashboard-refresh
    gated: false
    acceptance: acceptance/dashboard-refresh.yaml
    stale_after_days: 5
  - id: DASH-S6
    title: "Dashboard Stage 6 — scan_artifacts.py + artifact_manifest.csv + Overleaf-ready section"
    kind: dashboard
    automation: scan-artifacts
    gated: false
    acceptance: acceptance/scan-artifacts.yaml
    stale_after_days: 7
  - id: DASH-S8
    title: "Dashboard Stage 8 — static HTML view (dashboard/index.html)"
    kind: dashboard
    automation: dashboard
    gated: false
    depends_on: [DASH-S4, DASH-S6]   # needs stable status.json + artifact_manifest.csv
    acceptance: acceptance/html-dashboard.yaml
    stale_after_days: 7
  - id: DASH-NEXT-EXP-REVIEW
    title: >-
      Dashboard candidate-review section (Step 14) — scripts/automation/dashboard_candidate_review.py.
      Renders the "## 2b. Next-Experiment Candidate Review" section of RESEARCH_DASHBOARD.md purely
      by DISPLAYING the already-accepted automation/reviews/next_experiment_review.yaml (review_id,
      source_fingerprint, GO/REVIEW/NO-GO counts, accepted rank order, verdict/reasons/blockers/
      required-human-actions/material-difference-status per candidate, highest-ranked candidate,
      and a no-execution/no-queue/no-frozen-protocol/no-test-read warning). Never recalculates,
      reinterprets, reranks, or overrides any verdict the Brainstorm Checker (NEXT-EXP-REVIEW) has
      already produced. Renders a visible integrity warning (never a silent omission) if the review
      file is missing, malformed, or structurally inconsistent (duplicate/missing candidate_id,
      non-contiguous ranks, summary/entry count disagreement).
    kind: dashboard
    automation: dashboard-candidate-review
    gated: true
    depends_on: [NEXT-EXP-REVIEW, DASH-D3]
    acceptance: null   # no dedicated acceptance spec was authored for this step; the claim/approval receipts are the contract
    stale_after_days: 5
  - id: DASH-D3
    title: >-
      Dashboard D3 — Markdown research-evidence rendering (scripts/automation/dashboard_research_
      summary.py). Renders verified scientific evidence, canonical experiment identity, goal/
      dataset readiness, and safety warnings into RESEARCH_DASHBOARD.md's generated
      "## 2. Research Evidence & Canonical Identity" section. A VIEW only: reads Result Explorer's
      run_query() output in-process for all metrics/identity and reference_evidence.yaml only for
      (key, goal) routing pairs; never reconstructs a metric or re-matches an alias independently.
      Still the Markdown dashboard — dashboard/index.html (DASH-S8) remains untouched/deferred.
    kind: dashboard
    automation: dashboard-research-summary
    gated: true
    depends_on: [TOOL-REXP, REG-EXPERIMENT-ID]
    acceptance: acceptance/dashboard-research-summary.yaml
    stale_after_days: 5

  # --- Automations ---
  - id: AUT-TSG
    title: "test-split-guard — PreToolUse hook blocking unauthorized test-split reads"
    kind: automation
    automation: test-split-guard
    gated: false
    build_order: 1
    acceptance: acceptance/test-split-guard.yaml
    stale_after_days: 3
  - id: AUT-VPG
    title: "val-pilot-gate — standardized validation pilot evaluator + GO/NO-GO"
    kind: automation
    automation: val-pilot-gate
    gated: false
    build_order: 2
    acceptance: acceptance/val-pilot-gate.yaml
    stale_after_days: 4
  - id: AUT-LSA
    title: "ledger-sync --audit — attempt-ledger updater + evidence re-derivation audit"
    kind: automation
    automation: ledger-sync
    gated: false
    build_order: 3
    acceptance: acceptance/ledger-sync-audit.yaml
    stale_after_days: 4
  - id: AUT-EQ
    title: "experiment-queue — sequential overnight pilot queue + morning triage"
    kind: automation
    automation: experiment-queue
    gated: false
    build_order: 4
    acceptance: acceptance/experiment-queue.yaml
    stale_after_days: 4
  - id: AUT-PF
    title: "protocol-freeze — frozen-test protocol builder + pre-read verifier"
    kind: automation
    automation: protocol-freeze
    gated: true   # produces frozen-test protocols; every output is approval-gated
    build_order: 5
    acceptance: acceptance/protocol-freeze.yaml
    stale_after_days: 4
  - id: AUT-GSC-EXT
    title: "git-stage-check extensions — memo-reference completeness + frozen-protocol edit block"
    kind: automation
    automation: git-stage-check
    gated: false
    acceptance: acceptance/git-stage-check.yaml
    stale_after_days: 4
  - id: AUT-APPROVAL-BIND
    title: >-
      Approval-binding safety fix — user approvals bind to the exact claim receipt_id they
      approve (approved_claim_receipt_id [+ approved_claim_sha256]), never merely to a task_id.
      Fixes: a newer claim inheriting ACCEPTED from an older approval that never saw it (found in
      AUT-TSG-impl and REG-GOALS). Legacy approvals honored only via a deterministic
      claim-active-at-approval-time rule; never carried forward to a later superseding claim.
    kind: automation
    automation: dashboard-refresh
    gated: false
    acceptance: acceptance/dashboard-refresh.yaml
    stale_after_days: 4

  # --- Research OS layer (registries; Commit D1) ---
  - id: REG-GOALS
    title: "Goal Registry — automation/registry/goals.yaml (5 WiFi-sensing goals, evidence + clinical boundaries)"
    kind: registry
    automation: goal-registry
    gated: false
    acceptance: acceptance/goal-registry.yaml
    stale_after_days: 30
  - id: REG-DATASETS
    title: "Dataset Capability Registry — automation/registry/datasets.yaml (SenseFi/UT-HAR capabilities + integrity gate)"
    kind: registry
    automation: dataset-registry
    gated: false
    acceptance: acceptance/dataset-registry.yaml
    stale_after_days: 30
  - id: REF-EVID
    title: >-
      Curated Reference Evidence registry — automation/registry/reference_evidence.yaml. Hand-
      curated, user-approved pointers (H15_eps0015_frozen, AFAC_eps0030_F20_posthoc) to ALREADY-
      committed evidence artifacts; records published numbers without deriving/inferring any
      metric; must never override manifest evidence_level (cross-check enforced at resolution).
      Does NOT edit results/defense_attempt_inventory/defense_attempt_results_long.csv.
    kind: registry
    automation: reference-evidence
    gated: false
    acceptance: acceptance/result-explorer.yaml
    stale_after_days: 30
  - id: TOOL-REXP
    title: >-
      Result Explorer v1 — read-only lookup tool over committed registries, ledger/manifest result
      summaries, and accepted receipts. Explicitly: NO experiment running; NO validation running;
      NO held-out test access through commands (already-saved committed summaries only); NO result
      file writes (stdout-only); evidence level comes from manifest/accepted provenance, never
      filename inference.
    kind: tool
    automation: result-explorer
    gated: false
    acceptance: acceptance/result-explorer.yaml
    stale_after_days: 30
  - id: REG-PAPERS
    title: >-
      Academic Paper Registry (D4a-1) — automation/literature/paper_registry.yaml. Local-source
      backfill of papers already cited in the thesis/experiment documentation: D1--D12 literature
      anchors, dataset/attack/defense foundations (SenseFi, FGSM, PGD, adversarial training,
      TRADES/GAIRAT/SAT), and locally cited candidate-direction anchors, deduplicated to canonical
      paper IDs with citation-key aliasing. Bibliographic fields copied verbatim from the local
      bibliography (verification_status local_bib_only; external verification deferred to D4a-2);
      paper claims kept strictly separate from Research-OS interpretation; missing directions
      recorded as literature_gaps, never invented. NO web access, NO PDFs/full text, NO experiment
      recommendation, NO thesis-repository modification.
    kind: registry
    automation: paper-registry
    gated: true
    depends_on: [REG-GOALS, REG-DATASETS]
    acceptance: acceptance/paper-registry.yaml
    stale_after_days: 30
  - id: REG-CANDIDATES
    title: >-
      Experiment-Candidate Registry — automation/registry/experiment_candidates.yaml. Structured,
      evidence-grounded record of 8 possible research directions (AFAC low-FAR calibration,
      Neyman-Pearson FAR control, low-FAR partial-AUC objective, temporal/event-level FAR
      reduction, ensemble/gating, walking-detection baseline, gait/mobility data acquisition,
      future fall-risk data acquisition), each separating accepted literature support, verified
      local evidence, our interpretation, prior negative evidence (D13/D14), dataset readiness,
      split restrictions, and frozen-test-read risk. NO manually asserted GO/REVIEW/NO-GO verdict
      anywhere — verdicts are exclusively a future, separately-implemented Brainstorm Checker's
      computed output. NO experiment-queue integration, NO test-read authorization, NO experiment
      recommendation. Implements the accepted design contract acceptance/experiment-candidates.yaml
      (hash-bound by the REG-CANDIDATES-design receipts, not modified here).
    kind: registry
    automation: experiment-candidates
    gated: true
    depends_on: [REG-PAPERS, REG-GOALS, REG-DATASETS, REG-EXPERIMENT-ID, REF-EVID]
    acceptance: acceptance/experiment-candidates.yaml
    stale_after_days: 30
  - id: VALIDATION-PILOT-GATE-design
    title: >-
      Validation-Pilot Gate design contract (Step 15) — automation/acceptance/validation-pilot-gate.yaml.
      Defines the future read-only gate that reviews a human-authored pilot proposal for ONE
      selected experiment candidate: is it specified clearly and safely enough to be proposed for
      a validation-only pilot? Never answers scientific-success guarantee, run authorization,
      queue entry, held-out-test access, frozen-protocol use, or final scientific approval.
      Distinct from the existing, still-unimplemented AUT-VPG (val-pilot-gate) design, which will
      eventually EXECUTE a validation-split evaluation; this gate only reviews a WRITTEN PROPOSAL
      and never runs code or touches val/test data. Design-only: no gate implementation,
      validator, test, pilot-proposal template, or generated review exists yet.
    kind: design
    automation: validation-pilot-gate-readiness
    gated: true
    depends_on: [NEXT-EXP-REVIEW, REG-CANDIDATES]
    acceptance: acceptance/validation-pilot-gate.yaml
    stale_after_days: 30
  - id: EXTERNAL-REPO-RESOLUTION-design
    title: >-
      External-Repository Resolution design contract (Research OS migration Phase 1) —
      automation/acceptance/external-repo-resolution.yaml. Designs the future repository-resolution
      layer that removes the current hard assumption (REPO = Path(__file__).resolve().parents[2] in
      scan_artifacts.py / update_dashboard.py) that Research OS automation and experiment evidence
      must live in the same Git repository. Defines a two-layer configuration model (a tracked,
      portable automation/registry/external_repositories.yaml registry + a gitignored, machine-local
      automation/local/external_repository_paths.yaml override), a read-only resolver's
      responsibilities (identity verification, full-40-char-SHA provenance, path-traversal and
      symlink-escape rejection, no network, no mutation of external repositories), a commit/
      provenance policy distinguishing governance-repo vs. external-repo commits from historical
      single-repo receipt fields, and a legacy-path compatibility/migration policy. Design-only: no
      resolver module, tracked registry file, local-path override file, or test exists yet. Precedes
      a separate, later Migration Phase 2 (actual file relocation) contract; does not move, copy, or
      delete any Research OS file, and does not resume VALIDATION-PILOT-GATE implementation.
    kind: design
    automation: external-repository-resolution
    gated: true
    depends_on: [DASH-D3, TOOL-REXP, REG-EXPERIMENT-ID]
    acceptance: acceptance/external-repo-resolution.yaml
    stale_after_days: 30
  - id: EXTERNAL-REPO-RESOLUTION
    title: >-
      External-Repository Resolution implementation (Research OS migration Phase 1) —
      scripts/automation/repo_resolver.py plus a tracked portable external-repository registry,
      gitignored machine-local override template, read-only registry validator, and synthetic
      temporary-Git-repository tests. Resolves governance-repository identity separately from
      external experiment/evidence repositories; verifies remote URL, full 40-character commit SHA,
      required paths, dirty-worktree policy, allowed evidence roots, path traversal, absolute paths,
      and symlink escapes; supports explicit (repository_id, repository_relative_path) evidence
      references plus bounded legacy-path compatibility. Does not migrate Research OS files, create
      a real local override, copy evidence, run experiments, alter queues/protocols/candidates, or
      read held-out-test data.
    kind: tool
    automation: external-repository-resolution
    gated: true
    depends_on: [EXTERNAL-REPO-RESOLUTION-design, DASH-D3, TOOL-REXP, REG-EXPERIMENT-ID, DASH-S6]
    acceptance: acceptance/external-repo-resolution.yaml
    stale_after_days: 30
  - id: NEXT-EXP-REVIEW
    title: >-
      Next Experiment Brainstorm Checker — scripts/automation/next_experiment_brainstorm_checker.py
      (read-only) + validator + tests, generating automation/reviews/next_experiment_review.yaml.
      Re-resolves every candidate reference, derives GO/REVIEW/NO-GO deterministically from the
      accepted policy (acceptance/next-experiment-review.yaml), reports four separate dimensions
      (scientific_promise / practical_readiness / data_readiness / split_safety), ranks
      deterministically, and is idempotent via a source_fingerprint. GO means human-planning-review
      only; NO verdict authorizes running, queue entry, a test read, or frozen-protocol use. The
      checker's ONLY write target is the review file; it never modifies a registry or the queue.
    kind: tool
    automation: next-experiment-brainstorm-checker
    gated: true
    depends_on: [REG-CANDIDATES, REG-PAPERS, REG-GOALS, REG-DATASETS, REF-EVID, REG-EXPERIMENT-ID]
    acceptance: acceptance/next-experiment-review.yaml
    stale_after_days: 30
  - id: REG-EXPERIMENT-ID
    title: >-
      Experiment Identity & Naming Standard — automation/registry/experiment_identity.yaml (run
      vs. evaluation identity, readable display names, structured legacy aliases) +
      experiment_identity.md (policy) + read-only validator. Initial backfill: H15_eps0015_frozen
      and AFAC_eps0030_F20_posthoc, including a PROVEN shared-run link (checkpoint SHA256
      independently re-hashed) and an honest AMBIGUOUS/REUSED alias record for "A1". Renames
      NOTHING historical; does NOT yet integrate into Result Explorer or the dashboard (separate
      future steps).
    kind: registry
    automation: experiment-identity
    gated: false
    acceptance: acceptance/experiment-identity.yaml
    stale_after_days: 30
