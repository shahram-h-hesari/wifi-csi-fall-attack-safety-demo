# Task registry. SOURCE-OF-TRUTH for task DEFINITIONS ONLY.
# Deliberately NO status field: status is computed from receipts + acceptance at Stage 4+.
# Until then, the dashboard holds hand-assessed CLAIMED status.
schema_version: 1

tasks:
  # --- Dashboard build (meta) ---
  - id: DASH-S1
    title: "Dashboard Stage 1 — hand-maintained RESEARCH_DASHBOARD.md"
    kind: dashboard
    automation: dashboard
    gated: false
    acceptance: null
    stale_after_days: 3
  - id: DASH-S2
    title: "Dashboard Stage 2 — automation/ YAML source-of-truth + acceptance/receipt conventions"
    kind: dashboard
    automation: dashboard
    gated: false
    acceptance: null
    stale_after_days: 3
  - id: DASH-S3
    title: "Dashboard Stage 3 — update_dashboard.py (render phase only)"
    kind: dashboard
    automation: dashboard
    gated: false
    acceptance: acceptance/dashboard-refresh.yaml
    stale_after_days: 5
  - id: DASH-S4
    title: "Dashboard Stage 4 — receipts + verify phase (three-fixture test)"
    kind: dashboard
    automation: dashboard-refresh
    gated: false
    acceptance: acceptance/dashboard-refresh.yaml
    stale_after_days: 5
  - id: DASH-S5
    title: "Dashboard Stage 5 — /dashboard-refresh skill (+ --approve path)"
    kind: dashboard
    automation: dashboard-refresh
    gated: false
    acceptance: acceptance/dashboard-refresh.yaml
    stale_after_days: 5
  - id: DASH-S6
    title: "Dashboard Stage 6 — scan_artifacts.py + artifact_manifest.csv + Overleaf-ready section"
    kind: dashboard
    automation: scan-artifacts
    gated: false
    acceptance: acceptance/scan-artifacts.yaml
    stale_after_days: 7
  - id: DASH-S8
    title: "Dashboard Stage 8 — static HTML view (dashboard/index.html)"
    kind: dashboard
    automation: dashboard
    gated: false
    depends_on: [DASH-S4, DASH-S6]   # needs stable status.json + artifact_manifest.csv
    acceptance: acceptance/html-dashboard.yaml
    stale_after_days: 7
  - id: DASH-D3
    title: >-
      Dashboard D3 — Markdown research-evidence rendering (scripts/automation/dashboard_research_
      summary.py). Renders verified scientific evidence, canonical experiment identity, goal/
      dataset readiness, and safety warnings into RESEARCH_DASHBOARD.md's generated
      "## 2. Research Evidence & Canonical Identity" section. A VIEW only: reads Result Explorer's
      run_query() output in-process for all metrics/identity and reference_evidence.yaml only for
      (key, goal) routing pairs; never reconstructs a metric or re-matches an alias independently.
      Still the Markdown dashboard — dashboard/index.html (DASH-S8) remains untouched/deferred.
    kind: dashboard
    automation: dashboard-research-summary
    gated: true
    depends_on: [TOOL-REXP, REG-EXPERIMENT-ID]
    acceptance: acceptance/dashboard-research-summary.yaml
    stale_after_days: 5

  # --- Automations ---
  - id: AUT-TSG
    title: "test-split-guard — PreToolUse hook blocking unauthorized test-split reads"
    kind: automation
    automation: test-split-guard
    gated: false
    build_order: 1
    acceptance: acceptance/test-split-guard.yaml
    stale_after_days: 3
  - id: AUT-VPG
    title: "val-pilot-gate — standardized validation pilot evaluator + GO/NO-GO"
    kind: automation
    automation: val-pilot-gate
    gated: false
    build_order: 2
    acceptance: acceptance/val-pilot-gate.yaml
    stale_after_days: 4
  - id: AUT-LSA
    title: "ledger-sync --audit — attempt-ledger updater + evidence re-derivation audit"
    kind: automation
    automation: ledger-sync
    gated: false
    build_order: 3
    acceptance: acceptance/ledger-sync-audit.yaml
    stale_after_days: 4
  - id: AUT-EQ
    title: "experiment-queue — sequential overnight pilot queue + morning triage"
    kind: automation
    automation: experiment-queue
    gated: false
    build_order: 4
    acceptance: acceptance/experiment-queue.yaml
    stale_after_days: 4
  - id: AUT-PF
    title: "protocol-freeze — frozen-test protocol builder + pre-read verifier"
    kind: automation
    automation: protocol-freeze
    gated: true   # produces frozen-test protocols; every output is approval-gated
    build_order: 5
    acceptance: acceptance/protocol-freeze.yaml
    stale_after_days: 4
  - id: AUT-GSC-EXT
    title: "git-stage-check extensions — memo-reference completeness + frozen-protocol edit block"
    kind: automation
    automation: git-stage-check
    gated: false
    acceptance: acceptance/git-stage-check.yaml
    stale_after_days: 4
  - id: AUT-APPROVAL-BIND
    title: >-
      Approval-binding safety fix — user approvals bind to the exact claim receipt_id they
      approve (approved_claim_receipt_id [+ approved_claim_sha256]), never merely to a task_id.
      Fixes: a newer claim inheriting ACCEPTED from an older approval that never saw it (found in
      AUT-TSG-impl and REG-GOALS). Legacy approvals honored only via a deterministic
      claim-active-at-approval-time rule; never carried forward to a later superseding claim.
    kind: automation
    automation: dashboard-refresh
    gated: false
    acceptance: acceptance/dashboard-refresh.yaml
    stale_after_days: 4

  # --- Research OS layer (registries; Commit D1) ---
  - id: REG-GOALS
    title: "Goal Registry — automation/registry/goals.yaml (5 WiFi-sensing goals, evidence + clinical boundaries)"
    kind: registry
    automation: goal-registry
    gated: false
    acceptance: acceptance/goal-registry.yaml
    stale_after_days: 30
  - id: REG-DATASETS
    title: "Dataset Capability Registry — automation/registry/datasets.yaml (SenseFi/UT-HAR capabilities + integrity gate)"
    kind: registry
    automation: dataset-registry
    gated: false
    acceptance: acceptance/dataset-registry.yaml
    stale_after_days: 30
  - id: REF-EVID
    title: >-
      Curated Reference Evidence registry — automation/registry/reference_evidence.yaml. Hand-
      curated, user-approved pointers (H15_eps0015_frozen, AFAC_eps0030_F20_posthoc) to ALREADY-
      committed evidence artifacts; records published numbers without deriving/inferring any
      metric; must never override manifest evidence_level (cross-check enforced at resolution).
      Does NOT edit results/defense_attempt_inventory/defense_attempt_results_long.csv.
    kind: registry
    automation: reference-evidence
    gated: false
    acceptance: acceptance/result-explorer.yaml
    stale_after_days: 30
  - id: TOOL-REXP
    title: >-
      Result Explorer v1 — read-only lookup tool over committed registries, ledger/manifest result
      summaries, and accepted receipts. Explicitly: NO experiment running; NO validation running;
      NO held-out test access through commands (already-saved committed summaries only); NO result
      file writes (stdout-only); evidence level comes from manifest/accepted provenance, never
      filename inference.
    kind: tool
    automation: result-explorer
    gated: false
    acceptance: acceptance/result-explorer.yaml
    stale_after_days: 30
  - id: REG-PAPERS
    title: >-
      Academic Paper Registry (D4a-1) — automation/literature/paper_registry.yaml. Local-source
      backfill of papers already cited in the thesis/experiment documentation: D1--D12 literature
      anchors, dataset/attack/defense foundations (SenseFi, FGSM, PGD, adversarial training,
      TRADES/GAIRAT/SAT), and locally cited candidate-direction anchors, deduplicated to canonical
      paper IDs with citation-key aliasing. Bibliographic fields copied verbatim from the local
      bibliography (verification_status local_bib_only; external verification deferred to D4a-2);
      paper claims kept strictly separate from Research-OS interpretation; missing directions
      recorded as literature_gaps, never invented. NO web access, NO PDFs/full text, NO experiment
      recommendation, NO thesis-repository modification.
    kind: registry
    automation: paper-registry
    gated: true
    depends_on: [REG-GOALS, REG-DATASETS]
    acceptance: acceptance/paper-registry.yaml
    stale_after_days: 30
  - id: REG-EXPERIMENT-ID
    title: >-
      Experiment Identity & Naming Standard — automation/registry/experiment_identity.yaml (run
      vs. evaluation identity, readable display names, structured legacy aliases) +
      experiment_identity.md (policy) + read-only validator. Initial backfill: H15_eps0015_frozen
      and AFAC_eps0030_F20_posthoc, including a PROVEN shared-run link (checkpoint SHA256
      independently re-hashed) and an honest AMBIGUOUS/REUSED alias record for "A1". Renames
      NOTHING historical; does NOT yet integrate into Result Explorer or the dashboard (separate
      future steps).
    kind: registry
    automation: experiment-identity
    gated: false
    acceptance: acceptance/experiment-identity.yaml
    stale_after_days: 30
